  /api/gio-giang-import/export:
    get:
      tags:
        - GioGiangImport
      summary: Export gio giang ra file Excel
      description: >-
        Xuat danh sach gio giang import ra file .xlsx (mot sheet, co dong tieu de).
        Truyen query kyHoc (261/262/263) de loc theo ky hoc; bo trong = tat ca cac ky.
        Tra ve file dinh kem; neu kyHoc khong hop le tra JSON loi (GioGiangImportResponse).
      operationId: gioGiangImportExport
      parameters:
        - name: kyHoc
          in: query
          required: false
          description: "Ky hoc: 261 = nam hoc 2025-2026 ky 1; 262 = ky 2; 263 = ky he. Bo trong = tat ca."
          schema:
            type: integer
      responses:
        "200":
          description: OK — file Excel dinh kem (DL_GioGiang_{kyHoc}.xlsx; khong loc ky = DL_GioGiang_TatCa.xlsx).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request (ky hoc khong hop le)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
  /api/gio-giang-import/import:
    post:
      tags:
        - GioGiangImport
      summary: Import gio giang tu file Excel
      description: >-
        Upload file Excel "Tong hop gio giang" va field kyHoc (261/262/263).
        Server tu dong dinh dong tieu de, ghep Ho lot + Ten, doc cac cot gio,
        gan ky_hoc va nguoi import (tu token). Chay all-or-nothing: 1 dong loi
        thi rollback toan bo.
      operationId: gioGiangImportImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xls / .xlsx) theo mau "Tong hop gio giang".
                kyHoc:
                  type: integer
                  description: "Ky hoc: 261/262/263 (2 so dau = nam hoc, so cuoi = ky)."
              required:
                - file
                - kyHoc
      responses:
        "200":
          description: OK — tra ImportedCount = so dong da luu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "400":
          description: Bad Request (thieu file/kyHoc, khong doc duoc Excel, du lieu khong hop le)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "409":
          description: Conflict — import that bai o mot dong (da rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "415":
          description: Unsupported Media Type (khong phai multipart/form-data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
