          type: string
          format: date-time
          nullable: true
        NgayCapNhat:
          type: string
          format: date-time
          nullable: true
        SoMinhChung:
          type: integer
        ChoPhepSua:
          type: boolean
          description: >-
            Nguoi goi sua duoc dong nay: la chinh chu VA TrangThaiDong thuoc (1, 3).
            False tren dong da chot - FE khoa o nhap va an nut xoa.
        ChoPhepXet:
          type: boolean
          description: >-
            Nguoi goi chot / tra ve / mo lai duoc dong nay (co quyen duyet). True ke ca
            khi dong da chot, vi mo lai la hop le.
        MinhChung:
