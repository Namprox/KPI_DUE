    get:
      tags:
        - PhanHoiSinhVien
      summary: Ket qua khao sat sinh vien cua CHINH nguoi dang dang nhap
      description: >
        Tong hop san (khong tra dong tho, khong phan trang). ma_can_bo lay tu token,
        KHONG nhan tu query -> khong can kiem tra vai tro, ai cung chi xem duoc cua
        minh. idNam 4 chu so, server tu quy doi 2026 -> nam_hoc 26 -> ky_hoc 261/262/263.
        BoLoc luon tinh tren ca nam (bo qua kyHoc/maHocPhan) de dropdown khong bi thu hep.
        DiemChot luon la so ca nam, khong theo bo loc; null khi nam chua chot.
      operationId: phanHoiSinhVienCuaToi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: kyHoc
          in: query
          required: false
          schema:
            type: integer
        - name: maHocPhan
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK (ke ca khi khong co phan hoi nao)
        "400":
          description: idNam khong hop le
        "401":
          description: Khong xac dinh duoc nguoi dang nhap
