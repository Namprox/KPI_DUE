        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: CSV list of trang_thai values (e.g. "1,2,3")
          schema:
            type: string
        - name: page
          in: query
          required: false
