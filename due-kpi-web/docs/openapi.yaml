          type: array
          nullable: true
          description: >
            Chi tiết từng bài báo, parse từ cột articles_json.
            VẮNG MẶT khi gọi TOÀN TRƯỜNG: chỉ được trả khi truyền idNhanVien (cùng quy
            ước với MinhChung) vì mảng này rất lớn, không nhân bản cho cả trường.
