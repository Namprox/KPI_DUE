          schema:
            type: integer
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: id_don_vi cua Khoa hoac Phong/Trung tam. Mac dinh = don vi cua nguoi dang dang nhap.
          schema:
            type: integer
      responses:
