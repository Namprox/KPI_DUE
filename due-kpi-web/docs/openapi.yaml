  /api/ke-khai-thanh-tich/cho-duyet:
    get:
      tags:
        - KeKhaiThanhTich
      summary: Danh sach ban ke trong pham vi duyet cua nguoi dang dang nhap
      description: >
        Mot ban ke lot vao danh sach khi nguoi goi duyet duoc IT NHAT MOT DONG cua no.
        Hai duong vao: (a) dong tro toi muc co IdDonViDuyet = don vi nguoi goi giu chuc
        vu duyet (vd P.TCHC thay dong khen thuong cua MOI nhan vien toan truong);
        (b) dong khong chi dinh don vi phu trach -> roi ve truong don vi quan ly truc tiep.
        SoDongChoDuyetCuaToi cho biet phan viec cua rieng nguoi goi.
        KHONG con buoc "nop" nen KHONG loc theo trang thai ban ke nua: nhan vien ke toi
        dau nguoi duyet thay toi do. Ban ke RONG bi loai han khoi danh sach.
        Sap xep theo dong CHO DUYET cu nhat - ai cho lau nhat len truoc.
      operationId: keKhaiThanhTichChoDuyet
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: loai
          in: query
          required: false
          description: "Chi dem dong cua loai nay vao SoDongChoDuyetCuaToi. Bo trong = moi loai."
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: idDonVi
          in: query
          required: false
          description: "Bo loc hien thi (don vi do hoac 1 cap con), KHONG phai phan quyen."
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: "Loc theo NHAN dan xuat cua ban ke. Bo trong (mac dinh) = moi trang thai."
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: chiConChoDuyet
          in: query
          required: false
          description: "1 (mac dinh) = chi ban ke con dong PHAI XET cua chinh nguoi goi. 0 = lay het."
          schema:
            type: integer
            default: 1
            enum: [0, 1]
        - name: tuKhoa
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichChoDuyetResponse"
        "400":
          description: INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN - khong giu chuc vu duyet o don vi nao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/tong-hop:
    get:
      tags:
        - KeKhaiThanhTich
      summary: Tong hop diem thanh tich vuot troi DA DUYET theo nhan vien x loai x quy
      description: >
        Moi dong = 1 nhan vien x 1 loai thanh tich, kem tach theo 4 quy (DiemQ1..DiemQ4).
        DiemDuocTinh la con so THAT SU vao KPI: da khu trung noi dung khen thuong va da
        cap o tran cua tieu chi - trung khop voi fn_nckh_diem_tu_dong.
        quy khac null: chi cong cac dong cua quy do (phuc vu tong diem tich luy hang quy).
      operationId: keKhaiThanhTichTongHop
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: quy
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichTongHopResponse"
        "400":
          description: INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/{id}/duyet-chi-tiet:
    post:
      tags:
        - KeKhaiThanhTich
      summary: Chot / tra ve TUNG DONG (duoc sua so luong)
      description: >
        DAY LA NOI DUY NHAT dieu khien vong doi - khong con chot / tra lai o cap ban ke.
        QuyetDinh 2 = chot (khoa voi nhan vien), 3 = tra ve (nhan vien sua duoc, va
        BAT BUOC kem NhanXet - thieu thi 400 THIEU_LY_DO).
        SoLuongDuyet null = giu nguyen so nhan vien da ke.
        Dong bi tra ve cho DiemDuyet = 0 nhung van giu so lieu da ke de doi chieu.
        Diem duyet tinh lai tu SNAPSHOT cua dong, KHONG doc lai danh muc.
        Dong dang o trang thai 2 van xet lai duoc (mo lai) -> nhat ky HanhDong = 10.
        KHONG con gate theo trang thai ban ke: nhan vien khong phai "nop" truoc.
        GATE CAP DONG: moi dong doi chieu rieng IdDonViDuyet cua muc no tro toi. Gui lan
        sang dong cua don vi khac -> CA request bi tu choi (403 FORBIDDEN_DONG, khong ghi
        mot phan) va response mang DongCoVanDe[] chi ro dong nao thuoc don vi nao.
      operationId: keKhaiThanhTichDuyetChiTiet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuyetChiTietThanhTichRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichItemResponse"
        "400":
          description: INVALID / THIEU_LY_DO - tra ve ma khong ghi ly do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN / FORBIDDEN_DONG - xem DongCoVanDe[]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/{id}/lich-su:
    get:
      tags:
        - KeKhaiThanhTich
      summary: Nhat ky cua mot ban ke
      description: >
        HanhDong dang sinh ra: 1 Tao dong, 2 Sua dong, 3 Xoa dong, 5 Chot dong,
        6 Tra ve dong, 10 Mo lai dong da chot.
        Chi con trong du lieu CU (luong "nop" da go): 4 Nop, 7 Chot ban ke, 8 Tra lai,
        9 Huy nop.
      operationId: keKhaiThanhTichLichSu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichLichSuResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/{id}:
    get:
      tags:
        - KeKhaiThanhTich
      summary: Xem mot ban ke theo id (man hinh duyet cua don vi phu trach)
      operationId: keKhaiThanhTichGet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichItemResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
