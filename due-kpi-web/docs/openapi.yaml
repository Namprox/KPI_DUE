        gop ky_hoc 261/262/263), tinh AVG(danh_gia) cho tung giang vien (JOIN mem qua
        ma_can_bo = nhan_vien.ma_nhan_vien; khong khop bi bo qua, so luong tra ve o
        SoMaKhongKhop). Chi gop 1 diem tong hop ca nam (khong tach rieng tung ky). Moi
        nam chi giu 1 lan chot cuoi cung: chot lai se GHI DE (xoa ket qua cu cua nam do).
        Quyen chot: chi ma_chuc_vu = 'TP' cua don vi ma_don_vi = 'P_DTBDCL' (Phong Dao tao va Bao dam chat luong), hoac ADMIN.
