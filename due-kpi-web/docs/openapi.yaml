        Doc tu CUNG NGUON voi luc cham diem (fn_nhiem_vu_khoa_tran_diem va
        danh_muc_vai_tro_pvcd) nen khong the lech voi ket qua tinh toan.
        Truyen idDonVi/idNam de lay muc diem rieng cua Khoa/nam do (neu Khoa co cau
        hinh rieng); bo trong = bo mac dinh toan truong.
        Co LechCauHinh = true khi diem_toi_da cua tieu chi KPI khac tran cua module.
      operationId: cauHinhNhiemVuKhoa
