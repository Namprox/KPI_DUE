  /api/chi-tiet-don-vi/{idChiTiet}/minh-chung/file:
    post:
      tags:
        - PhieuDonVi
      summary: Upload minh chung (file) cho 1 tieu chi cua phieu don vi
      description: >
        Minh chung TUY CHON - khong bat buoc de nop phieu. sp_phieu_dv_submit KHONG kiem
        bat_buoc_minh_chung, nen co hay khong co minh chung phieu van nop duoc; co
        ChiTietDanhGiaDonViDto.BatBuocMinhChung chi de FE danh dau tieu chi nen dinh kem.
        Quyen GHI: ADMIN, hoac TKK/TKP TAI DUNG don vi cua phieu (chuc vu va don vi phai
        khop tren cung mot dong pham vi - giu chuc vu o don vi khac khong mang sang duoc),
        va phieu phai o trang_thai = 1. Giong het PUT .../diem-nhap.
        Whitelist duoi file va gioi han dung luong dung chung voi luong ca nhan - doc qua
        GET api/cau-hinh/minh-chung.
        KHONG nhan / KHONG doi RowVersion cua phieu: them minh chung khong sua du lieu
        cham diem nen khong duoc lam hong thao tac cham diem dang do cua nguoi khac.
      operationId: minhChungDonViUploadFile
      parameters:
        - name: idChiTiet
          in: path
          required: true
          description: id_chi_tiet_dv (chi_tiet_danh_gia_don_vi), KHONG phai id_chi_tiet cua luong ca nhan.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    Tep nhi phan. Duoi file va dung luong toi da theo appSettings
                    allowedEvidenceExtensions / maxEvidenceFileSizeKb (mac dinh
                    pdf, png, jpg, jpeg; toi da 10 MB). CHI nhan PDF va tep hinh anh.
                    Kiem HAI LOP giong luong ca nhan: duoi file phai nam trong whitelist
                    VA noi dung phai khop chu ky (magic bytes) cua duoi do - doi duoi se
                    bi tu choi 400.
                tenHienThi:
                  type: string
                  description: Ten hien thi (tuy chon). Bo trong -> lay ten tep khong ke duoi.
              required:
                - file
      responses:
        "201":
          description: Created - Item la ban ghi minh chung vua tao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "400":
          description: >
            Thieu tep, duoi file khong duoc phep, tep rong hoac vuot dung luong
            (ErrorCode = VALIDATION_FAILED), hoac luu tep that bai (ErrorCode = IO_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN - khong phai TKK/TKP cua don vi nay, cung khong phai ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "404":
          description: ErrorCode = NOT_FOUND - khong tim thay chi tiet danh gia don vi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "409":
          description: ErrorCode = INVALID_STATE - phieu khong con o trang_thai = 1 (da nop / da duyet / da chot)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "415":
          description: Request khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
