openapi: 3.0.0
info:
  title: KPI - API Documentation
  version: 1.0.0
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/docs:
    get:
      tags:
        - Docs
      summary: Trang Swagger UI (HTML)
      description: >
        Tra ve trang HTML render chinh file Swagger/openapi.yaml nay.
        DocsController KHONG gan [TokenAuthorize] nen 4 endpoint /api/docs,
        /api/openapi.yaml, /api/workflow, /api/concurrency deu truy cap duoc
        khong can dang nhap.
      operationId: docsUi
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
  /api/openapi.yaml:
    get:
      tags:
        - Docs
      summary: File openapi.yaml tho
      operationId: docsOpenApiYaml
      security: []
      responses:
        "200":
          description: Noi dung YAML
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Khong tim thay Swagger/openapi.yaml tren may chu
  /api/workflow:
    get:
      tags:
        - Docs
      summary: Tai lieu luong nghiep vu (Docs/Workflow.html)
      operationId: docsWorkflow
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Khong tim thay Docs/Workflow.html
  /api/concurrency:
    get:
      tags:
        - Docs
      summary: Tai lieu co che chong ghi de (Docs/Concurrency.html)
      operationId: docsConcurrency
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Khong tim thay Docs/Concurrency.html
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: >-
        Dang nhap. Khi thanh cong, access token va refresh token duoc set vao
        2 cookie httpOnly (kpi_access_token, kpi_refresh_token; Path=/;
        SameSite=Lax; Secure khi HTTPS). Body KHONG con tra Tokens — chi gom
        Success va User.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            OK — set cookie httpOnly kpi_access_token va kpi_refresh_token.
            Body chi gom Success va User (khong co Tokens).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Thong tin dang nhap khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      description: >-
        Doc refresh token tu cookie httpOnly kpi_refresh_token (khong nhan
        body). Neu hop le: cap access token moi, xoay (rotate) refresh token
        va set lai ca 2 cookie httpOnly. Body chi tra Success. Refresh
        hong/het han tra 401 va xoa cookie.
      operationId: authRefresh
      security: []
      responses:
        "200":
          description: >-
            OK — set lai cookie httpOnly kpi_access_token va
            kpi_refresh_token (da rotate). Body chi gom Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh token thieu, khong hop le hoac da het han
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: >-
        Doc refresh token tu cookie httpOnly kpi_refresh_token (khong nhan
        body) de thu hoi phia server, sau do xoa ca 2 cookie phien
        (Max-Age=0). Idempotent — khong co cookie van tra 200.
      operationId: authLogout
      security: []
      responses:
        "200":
          description: OK — da thu hoi refresh token va xoa cookie phien
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: >-
        Tra thong tin nguoi dung dang dang nhap. Access token doc tu cookie
        httpOnly kpi_access_token hoac header Authorization Bearer (uu tien
        header). Khong co/khong hop le tra 401.
      operationId: authMe
      responses:
        "200":
          description: OK — body gom Success va User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Khong co token hoac token khong hop le/het han
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register
      operationId: authRegister
      requestBody:
        required: true
        content:
