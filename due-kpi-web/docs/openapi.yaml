          type: string
          description: >
            Mã công thức. Cá nhân: NCKH_BAI_Q1Q2, NCKH_BAI_WOS_SCOPUS,
            NCKH_CHU_BIEN_CHUYEN_KHAO, NCKH_THANH_VIEN_CHUYEN_KHAO,
            NCKH_CHU_BIEN_GIAO_TRINH, NCKH_THANH_VIEN_GIAO_TRINH,
            NCKH_CHU_BIEN_THAM_KHAO, NCKH_THANH_VIEN_THAM_KHAO,
            NCKH_CHU_NHIEM_NN, NCKH_CHU_NHIEM_BO_TINH, NCKH_DE_TAI_CO_SO,
            PHSV_DIEM_TB_GTE_3, VPGD_TUAN_THU.
        DiemTuDong:
          type: number
          nullable: true
          description: >
            diem_toi_da nếu đạt, 0 nếu không đạt, null nếu mã công thức chưa được hỗ trợ.

            Riêng VPGD_TUAN_THU (tuân thủ quy định giảng dạy) là điểm TRỪ dần, không
            phải đạt/không đạt: điểm = diem_toi_da (15) − tổng diem_tru của các vi phạm
            trong năm, sàn ở 0 (không có đường nào ép về 0);
            giảng viên KHÔNG có vi phạm nào được trọn điểm.
        MinhChung:
          type: array
          description: >
            Các bản ghi nguồn đã tạo ra điểm của tiêu chí này (với VPGD_TUAN_THU là các
            vi phạm đã TRỪ điểm). Luôn khác null.
            Rỗng khi không đạt HOẶC khi gọi không kèm idNhanVien
            (với VPGD_TUAN_THU, rỗng nghĩa là không có vi phạm = trọn điểm).
          items:
            $ref: "#/components/schemas/MauDanhGiaMinhChungDto"
