    ToTrinhKhoaPhieuDto:
      type: object
      description: >-
        Mot ho so ca nhan trong goi. Cac cot khong co trong result set tuong ung se
        vang mat (NullValueHandling.Ignore).
      properties:
        IdPhieu:
          type: integer
        IdNhanVien:
          type: integer
        MaNhanVien:
          type: string
          nullable: true
        HoTen:
          type: string
          nullable: true
        IdDonVi:
          type: integer
          nullable: true
        LoaiDoiTuong:
          type: integer
          nullable: true
          description: 1 = Giang vien (vao mau so han ngach), 2 = Vien chuc/NLD (khong tranh han ngach)
        TrangThai:
          type: integer
          nullable: true
        CanHtDuyet:
          type: boolean
          nullable: true
          description: >-
            LUONG DUYET TACH DOI. true = ho so LANH DAO (TK/TKL/PTK/PTKL/TP/PTP): o lai
            trang thai 4 sau khi dong goi, cho Hieu truong duyet goi. false = ho so THUONG:
            HOAN TAT (trang thai 5) ngay tai buoc dong goi, khong qua Hieu truong.
            Chi co nghia khi TrangThai >= 4. Vang mat o result set khong tra cot nay
            (vd nhanh loi DONG_HANG).
            Cap (TrangThai = 4, CanHtDuyet = false) la DU LIEU TON tu quy trinh cu —
            hop le tam thoi, TK phai dong goi lai mot lan de no hoan tat.
        TongDiemCoBan:
          type: number
          nullable: true
        TongDiemVuotTroi:
          type: number
          nullable: true
        TongDiemTichLuy:
          type: number
          nullable: true
        MucNckhcnQd838:
          type: integer
          nullable: true
        DuDinhMucGioNckh:
          type: boolean
          nullable: true
        KhongViPhamPhapLuat:
          type: boolean
          nullable: true
        XepLoaiDeXuat:
          type: integer
          nullable: true
        XepLoaiKhoa:
          type: integer
          nullable: true
        XepLoai:
          type: integer
          nullable: true
          description: Ket qua CUOI CUNG - chi duoc ghi o buoc dong goi to trinh (co the = 4)
        XepLoaiText:
          type: string
          nullable: true
          readOnly: true
        LyDoXepLoai:
          type: string
          nullable: true
        UuTienXuatSac:
          type: boolean
          nullable: true
        HangTrongKhoa:
          type: integer
          nullable: true
          description: >-
            Thu hang TRONG NHOM (tren toan bo quan the nhom), snapshot luc dong goi.
            KHONG CON NULL voi vien chuc nhu truoc day.
        NhomXepHang:
          type: integer
          enum: [1, 2, 3]
          nullable: true
          description: Snapshot nhom luc dong goi. NULL = phieu chua tung duoc dong goi.
        NhomHienTai:
          type: integer
          enum: [1, 2, 3]
          nullable: true
          description: >-
            Nhom NEU dong goi ngay bay gio (tinh live). Dung cho man hinh xem truoc: phieu
            chua dong goi thi NhomXepHang con NULL, va chuc vu co the da doi ke tu lan truoc.
        NhomXepHangText:
          type: string
          nullable: true
          readOnly: true
        IdToTrinh:
          type: integer
          nullable: true
        LyDoHtTraVe:
          type: string
          nullable: true
        IdNguoiXepLoai:
          type: integer
          nullable: true
        NgayXepLoai:
          type: string
          format: date-time
          nullable: true
        DuDieuKienXuatSac:
          type: boolean
          nullable: true
          description: >-
            loai_doi_tuong = 1 AND xep_loai_khoa = 3 AND muc_nckhcn_qd838 = 2. Chi nhung
            nguoi nay moi tranh han ngach 20%.
        RowVersion:
          type: string
          format: byte
          nullable: true
    LichSuToTrinhDto:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        IdToTrinh:
          type: integer
        LanTrinh:
          type: integer
        TrangThaiTruoc:
          type: integer
          nullable: true
        TrangThaiSau:
          type: integer
        HanhDong:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
          description: >-
            1 Dong goi, 2 Trinh HT, 3 HT duyet, 4 HT tra ve, 5 Mo lai goi,
            6 TU DONG HOAN TAT (moi) — dong goi xong ma don vi khong co ho so lanh dao
            nao nen goi di thang sang trang thai 4, khong qua Hieu truong.
        HanhDongText:
          type: string
          nullable: true
          readOnly: true
        SoHoSoTraVe:
          type: integer
          nullable: true
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        LyDo:
          type: string
          nullable: true
        NhanXet:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    ToTrinhKhoaNhomDto:
      type: object
      description: >-
        Han ngach xuat sac cua MOT NHOM. Moi don vi xep hang toi da 3 bang doc lap:
        1 Giang vien thuong, 2 Vien chuc / NLD, 3 Can bo quan ly (TK/TKL/PTK/PTKL/TP/PTP).
        Moi dong mang CA ve snapshot (lan dong goi gan nhat) lan ve hien tai (neu dong goi
        ngay bay gio) - ve hien tai lam man hinh xem truoc chay duoc khi goi chua tung
        dong goi, va giup phat hien snapshot da cu.
      properties:
        Nhom:
          type: integer
          enum: [1, 2, 3]
          description: 1 Giang vien, 2 Vien chuc / NLD, 3 Can bo quan ly
        TenNhom:
          type: string
          nullable: true
          readOnly: true
        SoNguoi:
          type: integer
          nullable: true
          description: Tong dau nguoi trong nhom (snapshot)
        SoNguoiMuc3:
          type: integer
          nullable: true
          description: So nguoi xep_loai_khoa = 3 (snapshot)
        SoMauSo:
          type: integer
          nullable: true
          description: >-
            MAU SO THUC DUNG de tinh han ngach. Nhom 1 = SoNguoiMuc3; nhom 2/3 = SoNguoi.
            BAT DOI XUNG CO CHU Y - FE PHAI doc cot nay, KHONG duoc tu suy tu SoNguoiMuc3
            hay SoNguoi.
        SoDuDieuKien:
          type: integer
          nullable: true
          description: So nguoi du dieu kien muc 4 trong TOAN nhom (khong chi trong Top)
        HanNgach:
          type: integer
          nullable: true
          description: MAX(1, FLOOR(SoMauSo x TyLeXuatSac)); SoMauSo = 0 thi bang 0
        SoDat:
          type: integer
          nullable: true
          description: >-
            So nguoi THUC TE dat muc 4. CO THE NHO HON HanNgach: nguoi nam trong Top nhung
            thieu dieu kien thi giu muc 3 va suat do BO TRONG, khong don xuong nguoi ke tiep.
        SoNguoiHienTai:
          type: integer
          nullable: true
        SoNguoiMuc3HienTai:
          type: integer
          nullable: true
        SoMauSoHienTai:
          type: integer
          nullable: true
        SoDuDieuKienHienTai:
          type: integer
          nullable: true
        HanNgachHienTai:
          type: integer
          nullable: true

    ToTrinhKhoaDongHangNhomDto:
      type: object
      description: Chi tiet the be tac DONG_HANG cua MOT nhom
      properties:
        Nhom:
          type: integer
          enum: [1, 2, 3]
        TenNhom:
          type: string
          nullable: true
          readOnly: true
        SoNguoi:
          type: integer
        SoNguoiMuc3:
          type: integer
        SoMauSo:
          type: integer
        SoDuDieuKien:
          type: integer
        HanNgach:
          type: integer
        SoSuatConLai:
          type: integer
        SoNguoiDongHang:
          type: integer
          description: So nguoi cung diem ranh gioi, KE CA nguoi khong du dieu kien muc 4
        SoDongHangDuDk:
          type: integer
          description: >-
            Trong so do, bao nhieu nguoi DU DIEU KIEN len muc 4. He thong chi chan khi so
            nay LON HON SoSuatConLai - dong hang giua nhung nguoi khong the len muc 4 thi
            ai chiem suat cung khong doi ket qua.
        SoNguoiDaUuTien:
          type: integer
        DiemRanhGioi:
          type: number

    ToTrinhKhoaDongHangDto:
      type: object
      description: >-
        Chi tiet the be tac DONG_HANG o ranh gioi Top. Mo ta nhom bi chan co so hieu NHO
        NHAT - khi SoNhomDongHang > 1, doc ToTrinhKhoaResponse.DongHangNhom de biet het.
      properties:
        Nhom:
          type: integer
          enum: [1, 2, 3]
          description: Nhom dang bi be tac
        TenNhom:
          type: string
          nullable: true
          readOnly: true
        HanNgachXuatSac:
          type: integer
        SoGiangVien:
          type: integer
          deprecated: true
          description: >-
            DEPRECATED - alias cu cua SoMauSo, giu de FE dang chay khong vo. Ten sai ke tu
            khi tach 3 nhom: gia tri nay la MAU SO cua nhom bi chan, khong phai so giang
            vien. Chuyen sang dung SoMauSo.
        SoMauSo:
          type: integer
          description: Mau so han ngach cua nhom bi chan
        SoNguoiMuc3:
          type: integer
        SoSuatConLai:
          type: integer
          description: So suat con lai sau khi tru nhung nguoi diem CAO HON diem ranh gioi
        SoNguoiDongHang:
          type: integer
          description: So nguoi cung diem ranh gioi, KE CA nguoi khong du dieu kien muc 4
        SoDongHangDuDk:
          type: integer
          description: Trong so do, bao nhieu nguoi DU DIEU KIEN len muc 4
        SoNguoiDaUuTien:
          type: integer
          description: >-
            So nguoi DU DIEU KIEN da duoc truong don vi danh dau uu tien. Dong goi chi di
            tiep khi so nay BANG DUNG SoSuatConLai.
        DiemRanhGioi:
          type: number
        SoNhomDongHang:
          type: integer
          description: Tong so nhom dang be tac (1..3)
    ToTrinhKhoaResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        ErrorCode:
          type: string
          nullable: true
          description: >-
            CHUA_DU_HO_SO / DONG_HANG / TO_TRINH_DA_TRINH / INVALID_STATE / FORBIDDEN /
            NOT_FOUND / TY_LE_KHONG_HOP_LE / DANH_SACH_RONG / HO_SO_KHONG_HOP_LE /
            KHONG_CO_HO_SO / TRAN_LAN_TRINH / KHONG_CO_HO_SO_LANH_DAO
        Item:
          $ref: "#/components/schemas/ToTrinhKhoaDto"
        Items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToTrinhKhoaDto"
        HoSo:
          type: array
          nullable: true
          description: >-
            Nghia thay doi theo ket qua - dong-goi thanh cong: toan bo ho so trong goi;
            CHUA_DU_HO_SO: ho so chua duoc TK chot; DONG_HANG: nhung nguoi dong diem;
            ht-tra-lai: ho so vua bi tra ve.
          items:
            $ref: "#/components/schemas/ToTrinhKhoaPhieuDto"
        DongHang:
          $ref: "#/components/schemas/ToTrinhKhoaDongHangDto"
        DongHangNhom:
          type: array
          nullable: true
          description: >-
            TAT CA cac nhom dang be tac dong hang (toi da 3). SP xet het 3 nhom roi bao loi
            mot lan - fail-fast nhom dau se bat truong don vi dong goi lai 3 lan moi biet
            het. Khoi DongHang o tren chi mo ta nhom co so hieu nho nhat.
          items:
            $ref: "#/components/schemas/ToTrinhKhoaDongHangNhomDto"
        Nhom:
          type: array
          nullable: true
          description: Han ngach theo tung nhom sau khi dong goi thanh cong.
          items:
            $ref: "#/components/schemas/ToTrinhKhoaNhomDto"
        TongSoDong:
          type: integer
          nullable: true
        SoHoSoHoanTat:
          type: integer
          nullable: true
          description: >-
            LUONG DUYET TACH DOI. O dong-goi: so ho so THUONG (CanHtDuyet = false) vua
            duoc chuyen thang sang HOAN TAT (trang thai 5) — khong can Hieu truong duyet.
            O ht-duyet: so ho so LANH DAO vua chuyen sang HOAN TAT.
            Vang mat o cac endpoint khac.
        SoHoSoChoHt:
          type: integer
          nullable: true
          description: >-
            CHI co o dong-goi. So ho so LANH DAO (CanHtDuyet = true) con o trang thai 4,
            cho Truong khoa trinh Hieu truong.
            * > 0  => Item.TrangThai = 2 (DA_DONG_GOI), FE hien nut "Trinh Hieu truong".
            * = 0  => Item.TrangThai = 4 (goi TU DONG HOAN TAT), FE PHAI AN nut do —
                      bam vao se nhan 409 KHONG_CO_HO_SO_LANH_DAO.
    ToTrinhKhoaDongGoiRequest:
      type: object
      required:
        - RowVersion
      properties:
        TyLeXuatSac:
          type: number
          nullable: true
          example: 0.2
          description: >-
            NULL = giu ty le dang luu tren goi (mac dinh 0.2000). Khoang hop le (0, 1].
            Chi truyen khi nam do co quy dinh ty le khac.
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaTrinhRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
          maxLength: 1000
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaHtDuyetRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
          maxLength: 2000
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaHtTraLaiRequest:
      type: object
      required:
        - LyDo
        - RowVersion
      properties:
        IdPhieuList:
          type: array
          description: >-
            BAT BUOC co it nhat 1 phan tu. Moi id phai thuoc dung goi nay va dang o trang
            thai 4. Cac ho so KHONG duoc chon giu nguyen trang thai 4.
          items:
            type: integer
        LyDo:
          type: string
          maxLength: 1000
        RowVersion:
          type: string
          format: byte

    # =======================================================================
    # KE KHAI GIO QUY DOI THEO PHU LUC II
    # =======================================================================
    CongViecQuyDoiDto:
      type: object
      description: >-
        Mot nut trong danh muc PHU LUC II. Cay toi da 4 cap, do sau KHONG deu nen
        la co the nam o cap 2, 3 hoac 4. Chi nut co LaLa = true moi ke khai duoc.
        Cong thuc: gio = ROUND(SoLuong * HeSoQuyDoi / SoLuongMau, 2).
      properties:
        IdCongViec:
          type: integer
        IdCha:
          type: integer
          nullable: true
        Cap:
          type: integer
          description: "1..4"
        MaCongViec:
          type: string
          description: "VD: SDH_1_A, DH_5_D"
        TenCongViec:
          type: string
        SoThuTu:
          type: string
          nullable: true
          description: "So thu tu goc trong quyet dinh: 1, a, b..."
        LaLa:
          type: boolean
          description: "true = dau viec ke khai duoc. false = nut gom."
        HeSoQuyDoi:
          type: number
          format: double
          nullable: true
          description: "Null khi la nut gom. VD 10 cho '10/hoc vien', 1 cho '1,0/10 bai'."
        SoLuongMau:
          type: integer
          description: "Mau so cua he so. '1,0/10 bai' -> 10. Luon >= 1."
        DonViTinh:
          type: string
          nullable: true
          description: "Don vi giang vien nhap: hoc vien, bo de, bai, LV(DA), khoa luan, lop/nam..."
        GhiChuQuyDoi:
          type: string
          nullable: true
          description: "Chuoi goc trong quyet dinh, de FE hien thi dung van ban. VD '1,0/10 bai'."
        ThuTu:
          type: integer
        TrangThai:
          type: boolean
        DuongDanTen:
          type: string
          nullable: true
          description: "Ten ghep tu goc xuong, de hien thi mot dong. Chi co o endpoint doc cay."

    CongViecQuyDoiCreateRequest:
      type: object
      required:
        - MaCongViec
        - TenCongViec
      properties:
        IdCha:
          type: integer
          nullable: true
          description: "Null = nut goc (cap 1). Cap tu suy ra tu cha, KHONG nhan tu client."
        MaCongViec:
          type: string
          maxLength: 50
        TenCongViec:
          type: string
          maxLength: 500
        SoThuTu:
          type: string
          maxLength: 10
          nullable: true
        LaLa:
          type: boolean
          description: "true = ke khai duoc; khi do HeSoQuyDoi BAT BUOC."
        HeSoQuyDoi:
          type: number
          format: double
          nullable: true
        SoLuongMau:
          type: integer
          nullable: true
          description: "Null hoac < 1 se duoc coi la 1."
        DonViTinh:
          type: string
          maxLength: 50
          nullable: true
        GhiChuQuyDoi:
          type: string
          maxLength: 200
          nullable: true
        ThuTu:
          type: integer

    CongViecQuyDoiUpdateRequest:
      type: object
      description: "KHONG doi duoc cha / cap. Sua HeSoQuyDoi KHONG hoi to len ban ke da luu."
      required:
        - MaCongViec
        - TenCongViec
      properties:
        MaCongViec:
          type: string
          maxLength: 50
        TenCongViec:
          type: string
          maxLength: 500
        SoThuTu:
          type: string
          maxLength: 10
          nullable: true
        LaLa:
          type: boolean
        HeSoQuyDoi:
          type: number
          format: double
          nullable: true
        SoLuongMau:
          type: integer
          nullable: true
        DonViTinh:
          type: string
          maxLength: 50
          nullable: true
        GhiChuQuyDoi:
          type: string
          maxLength: 200
          nullable: true
        ThuTu:
          type: integer
        TrangThai:
          type: boolean
          nullable: true
          description: "Null = giu nguyen trang thai hien tai."

    KeKhaiGioQuyDoiDto:
      type: object
      description: >-
        Ban ke khai gio quy doi cua mot giang vien trong mot nam (1 ban / GV / nam).
        VONG DOI NAM O TUNG DONG (xem ChiTietKeKhaiDto.TrangThaiDong), khong o header.
      properties:
        IdKeKhai:
          type: integer
          description: "0 = ban ke CHUA TON TAI (chua luu dong nao). Khong phai loi."
        IdNhanVien:
          type: integer
        MaNhanVien:
          type: string
          nullable: true
        HoTen:
          type: string
          nullable: true
        IdDonVi:
          type: integer
          nullable: true
        MaDonVi:
          type: string
          nullable: true
        TenDonVi:
          type: string
          nullable: true
        IdNam:
          type: integer
        TrangThai:
          type: integer
          description: >-
            NHAN DAN XUAT tu cac dong, KHONG phai khoa nghiep vu - server tinh lai sau
            moi lan luu / xet, khong ai set tay:
            4 con dong bi tra ve (uu tien cao nhat) | 2 con dong cho duyet |
            3 co dong va TAT CA da chot | 1 khong con dong song nao.
