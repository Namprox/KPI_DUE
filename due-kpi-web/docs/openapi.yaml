        moi tieu chi co diem cap don vi, VA moi tieu chi da phan quyen
        (tieu_chi_don_vi_cham) co LoaiNguonDiem = 1 phai co DiemDuyetDv - tuc don vi
        duoc giao da cham. Thieu -> 422 VALIDATION_FAILED ("Con N tieu chi da phan
