    get:
      tags:
        - TieuChiDonViCham
      summary: >
        Danh sách phân quyền chấm tiêu chí cho đơn vị. Lọc theo idTieuChi (1 tiêu chí)
        hoặc idMau (mọi tiêu chí thuộc mẫu — dựng bảng phân quyền cho cả mẫu; tiêu chí
        không có dòng = mặc định trưởng khoa/phòng chấm).
      operationId: tieuChiDonViChamGetAll
      parameters:
        - name: idTieuChi
          in: query
          required: false
          schema:
            type: integer
        - name: idMau
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TieuChiDonViChamResponse"
    put:
      tags:
        - TieuChiDonViCham
      summary: >
        Thay thế toàn bộ danh sách đơn vị được phân quyền chấm của 1 tiêu chí (Admin).
        Tiêu chí có phân quyền: chỉ TRƯỞNG các đơn vị đó (ma_chuc_vu TK/TKL/TP) được chấm
        điểm cấp Khoa của tiêu chí (lưu vết người chấm qua id_nguoi_dg_khoa + lich_su_cham_diem).
        Danh sách rỗng = bỏ phân quyền, quay về mặc định trưởng khoa/phòng đơn vị chủ quản chấm.
      operationId: tieuChiDonViChamSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TieuChiDonViChamSetRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TieuChiDonViChamResponse"
        "400":
          description: Id tiêu chí / danh sách đơn vị không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TieuChiDonViChamResponse"
        "404":
          description: Không tìm thấy tiêu chí
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TieuChiDonViChamResponse"
