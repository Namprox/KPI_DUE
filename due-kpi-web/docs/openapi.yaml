        TrangThaiSau:
          type: integer
          enum: [1, 2, 3, 4, 5]
        HanhDong:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 Submit, 2 Approve & forward, 3 Return, 4 Chot, 5 Mo lai
        CapThucHien:
          type: integer
          nullable: true
          enum: [1, 2, 3]
          description: 1 GV, 2 Khoa, 3 Truong; NULL when system-initiated
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        LyDo:
          type: string
          nullable: true
        NhanXet:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    LichSuTrangThaiResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/LichSuTrangThaiPhieuDto"
