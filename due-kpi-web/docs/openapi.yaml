  /api/nhan-vien:
    get:
      tags:
        - NhanVien
      summary: Danh sách nhân viên (danh bạ) có phân trang + lọc
      description: >
        Trả về danh sách nhân viên dạng danh bạ, có phân trang. KHÔNG trả các
        trường nhạy cảm (mat_khau, refresh_token). Các tham số lọc
        đều tùy chọn; tham số nào bỏ trống thì không áp dụng điều kiện đó.
      operationId: nhanVienGetList
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Tìm theo ma_nhan_vien / ho_ten / email (LIKE, không phân biệt vị trí)
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
          description: Lọc theo khóa số đơn vị (id_don_vi). Dùng được kết hợp với maDonVi.
        - name: maDonVi
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
          description: >
            Lọc theo mã đơn vị (ma_don_vi, khớp chính xác, vd "P.KT"). Dùng độc lập
            hoặc kết hợp với idDonVi (hai điều kiện AND với nhau).
        - name: baoGomDonViCon
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            true = lấy luôn nhân viên thuộc các đơn vị con (mọi cấp) của đơn vị khớp
            bộ lọc (đệ quy theo id_don_vi_cha). Chỉ có tác dụng khi có lọc idDonVi/maDonVi.
            Mặc định false = chỉ đúng đơn vị đó.
        - name: idChucVu
          in: query
          required: false
          schema:
            type: integer
          description: Lọc theo chức vụ áp dụng hiện tại
        - name: trangThai
          in: query
          required: false
          schema:
            type: boolean
          description: "Lọc theo trạng thái (true: đang làm việc). Bỏ trống = lấy tất cả."
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Trang hiện tại (mặc định 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
          description: Số dòng mỗi trang (mặc định 20, tối đa 200)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVienListResponse"
        "400":
          description: Tham số lọc không hợp lệ (idDonVi / maDonVi / idChucVu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVienListResponse"
        "401":
          description: Chưa xác thực
  /api/nhan-vien/{id}/ho-so:
    put:
      tags:
        - NhanVien
      summary: Cập nhật hồ sơ nhân viên (gioi_tinh, ngay_sinh)
      description: >
        Cập nhật bộ phận: field nào null thì GIỮ NGUYÊN giá trị hiện tại.
        Phân quyền gioi_tinh / ngay_sinh: GV tự cập nhật hồ sơ của CHÍNH MÌNH;
        Admin/BGH cập nhật bất kỳ ai.
      operationId: nhanVienCapNhatHoSo
