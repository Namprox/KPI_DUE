          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
  /api/minhchung/{idMinhChung}/tai-ve:
    get:
      tags:
        - MinhChung
      summary: Tai tep minh chung ve (ho tro xem truoc inline)
      description: >
        Tra ve tep. Mac dinh Content-Disposition: attachment (ten file goc); truyen
        inline=1 de doi sang inline cho FE xem truoc trong iframe / tab moi.
        Content-Type suy tu loai_file - minh chung phieu cho phep
        pdf/doc/docx/xls/xlsx/png/jpg nen khong co dinh mot kieu; duoi la se tra
        application/octet-stream. Chi ap dung cho minh chung LoaiMinhChung = 1 (File);
        loai 2 (Link) / 3 (DOI) khong co tep tren dia.
        Quyen doc giong GET api/chitiet/{idChiTiet}/minh-chung: chu phieu, cap Truong
        (HT/ADMIN), hoac cap Khoa (TK/TKL/TP) trong pham vi don vi / don vi cha.
        KHONG rang buoc trang thai phieu (doc duoc o moi trang thai).
        Endpoint nam sau [TokenAuthorize], nhung filter co fallback doc cookie httpOnly
        kpi_access_token nen <a href> / <iframe src> van xac thuc duoc khi FE cung-site
        (khac origin thi phai dat Cookie:SameSite = None + HTTPS).
        Response luon kem X-Content-Type-Options: nosniff.
      operationId: minhChungTaiVe
      parameters:
        - name: idMinhChung
          in: path
          required: true
          schema:
            type: integer
        - name: inline
          in: query
          required: false
          description: >
            inline=1 -> Content-Disposition: inline. Chi co hieu luc voi cac kieu trinh
            duyet render an toan (application/pdf, image/png, image/jpeg); cac kieu con
            lai (doc/docx/xls/xlsx, octet-stream) van tra attachment de tranh nguy co
            stored XSS neu whitelist duoi file duoc mo rong. Bo qua / khac 1 -> attachment.
          schema:
            type: integer
            enum: [1]
      responses:
        "200":
          description: Noi dung tep
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            idMinhChung <= 0 (khong co ErrorCode), hoac
            ErrorCode = MINH_CHUNG_KHONG_PHAI_FILE (minh chung la Link/DOI —
            phan hoi kem Item de FE mo thang DuongDan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN_CHUC_VU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: >
            ErrorCode = MINH_CHUNG_NOT_FOUND (khong ton tai / da xoa mem) /
            FILE_NOT_FOUND (metadata con nhung tep da mat tren may chu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
  /api/minhchung:
    get:
      tags:
        - MinhChung
      summary: Kho minh chung - liet ke theo ca phieu hoac theo nam
      description: >
        Tra ve minh chung kem NGU CANH (tieu chi, phieu, nam) de FE dung o mot man hinh
        "Kho minh chung" rieng, thay vi phai goi GET api/chitiet/{idChiTiet}/minh-chung
        cho tung tieu chi.
        Bo loc: idPhieu (uu tien cao nhat) -> dung phieu do; idNam -> phieu cua idNhanVien
        trong nam do; KHONG truyen gi -> tat ca cac nam cua idNhanVien (kho xuyen nam).
        idNhanVien mac dinh la nguoi dang dang nhap, nen khong the vo tinh liet ke minh
        chung cua toan truong.
        Quyen doc giong GET api/phieu/{id}. Khong tim thay phieu nao khop bo loc -> 404;
        co phieu nhung khong duoc doc -> 403 (KHONG tra ve mang rong im lang).
        Ket qua sap xep theo nam giam dan, roi theo thu tu hien thi cua tieu chi.
      operationId: minhChungGetKho
      parameters:
        - name: idPhieu
          in: query
          required: false
          schema:
            type: integer
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          description: Chi dung kem idNam. Mac dinh = nguoi dang dang nhap.
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungKhoResponse"
        "400":
          description: idPhieu / idNam <= 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungKhoResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungKhoResponse"
        "404":
          description: ErrorCode = NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungKhoResponse"
  /api/minhchung/{idMinhChung}:
    put:
      tags:
        - MinhChung
      summary: Sua ten hien thi / duong dan cua 1 minh chung
      description: >
        Patch semantics - truong nao NULL / khong truyen thi giu nguyen gia tri cu; chuoi
        rong hoac chi khoang trang cung duoc coi la "khong truyen" (tranh vo tinh xoa ten).
        Truyen ca hai deu rong -> 400.
        DuongDan CHI sua duoc voi minh chung dang Link (2) / DOI (3); voi dang File (1)
        do la duong dan vat ly do server sinh ra nen API tra 400 kem
        ErrorCode = MINH_CHUNG_LA_FILE (muon doi tep thi xoa roi tai len tep moi).
        Rang buoc giong DELETE: phieu phai o trang thai Nhap (1) va nguoi goi phai la chu
        phieu hoac cap Truong (HT/ADMIN).
      operationId: minhChungUpdate
      parameters:
        - name: idMinhChung
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinhChungUpdateRequest"
      responses:
        "200":
          description: OK - Item la ban ghi sau khi cap nhat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "400":
          description: >
            Khong truyen truong nao, vuot do dai (255 / 500), hoac
            ErrorCode = MINH_CHUNG_LA_FILE (co doi DuongDan cua minh chung dang tep)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: Khong phai chu phieu / khong du quyen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: Minh chung khong ton tai hoac da xoa mem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "409":
          description: Phieu khong o trang thai Nhap (1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
    delete:
      tags:
        - MinhChung
      summary: Soft-delete an evidence record (physical file kept on disk)
      operationId: minhChungDelete
      parameters:
        - name: idMinhChung
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "409":
          description: Phieu not in NHAP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
  /api/cau-hinh/minh-chung:
    get:
      tags:
        - CauHinh
      summary: Cau hinh upload minh chung cho FE
      description: >
        Tra ve whitelist duoi file, gioi han dung luong va do dai truong ma server dang
        ap dung khi them minh chung. FE dung de dat thuoc tinh accept cua input file va
        chan som file qua co / ten qua dai thay vi doi API tra 400.
        Nguon: Web.config appSettings (allowedEvidenceExtensions, maxEvidenceFileSizeKb)
        va gioi han cot cua bang minh_chung — doc lai tu dung ham ma luong upload dung
        (MinhChungService) nen khong the lech cau hinh.
        Khong truy van DB, khong phu thuoc user (chi can token hop le).
      operationId: cauHinhMinhChung
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauHinhMinhChungResponse"
        "401":
          description: Thieu hoac sai token
  /api/chitiet/{idChiTiet}/nhiem-vu:
    post:
      tags:
        - NhiemVuCongDong
      summary: Add a community-service task (Group III) to a chi_tiet
      description: |
        Validates that the parent phieu is in NHAP (1) state and the current user owns it.
        Resolves the vai tro using the Phase-1.1 priority logic for the phieu's (don_vi, nam).
        Snapshots diem_quy_doi at write time. Rejects with 422 if the new task would push
        the Group-III total above the 20-point hard cap.
      operationId: nhiemVuCreate
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhiemVuCongDongCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "400":
          description: Bad Request (invalid fields, inactive nhom, or vai tro not in resolved set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "403":
          description: Forbidden (not the GV who owns the phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "404":
          description: chi_tiet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "409":
          description: Phieu not in NHAP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "422":
          description: Group-III 20-point cap would be exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvcdCapExceededResponse"
    get:
      tags:
        - NhiemVuCongDong
      summary: List active community-service tasks for a chi_tiet
      description: |
        Returns all non-deleted tasks ordered by ngay_tao ASC.
        Response includes summary header — tongDiemSnapshot, soNhiemVu, conLai (= 20 - tongDiemSnapshot).
        GV sees only their own phieu; Khoa sees their scope; Truong sees all.
      operationId: nhiemVuGetByChiTiet
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "404":
          description: chi_tiet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
  /api/nhiemvu/{idNhiemVu}:
    put:
      tags:
        - NhiemVuCongDong
      summary: Update a community-service task
      description: |
        idVaiTro and/or idNhomNv may change; the snapshot is recomputed and the 20-point
        cap is re-evaluated excluding the task itself from the running total.
        Only allowed when the parent phieu is in NHAP (1) state and the caller owns it.
      operationId: nhiemVuUpdate
      parameters:
        - name: idNhiemVu
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhiemVuCongDongUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "400":
          description: Bad Request (invalid fields, inactive nhom, or vai tro not in resolved set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "404":
          description: nhiem_vu not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "409":
          description: Phieu not in NHAP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "422":
          description: Group-III 20-point cap would be exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvcdCapExceededResponse"
    delete:
      tags:
        - NhiemVuCongDong
      summary: Soft-delete a community-service task
      description: |
        Sets da_xoa = 1. Only allowed when the parent phieu is in NHAP (1) state and
        the caller owns it. No cap re-check needed — deletion only reduces the running total.
      operationId: nhiemVuDelete
      parameters:
        - name: idNhiemVu
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "404":
          description: nhiem_vu not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
        "409":
          description: Phieu not in NHAP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuCongDongResponse"
