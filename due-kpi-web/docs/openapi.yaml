            (vd NCKH_BAI_Q1Q2, PHSV_DIEM_TB_GTE_3, VPGD_TUAN_THU, NCKH_GIO_TY_LE,
            NCKH_BBQT_DIEM_KPI).
            Chi duoc tra o GET /api/phieu/{id}.
        DiemTuDong:
          type: number
          nullable: true
          description: >
            Diem engine tinh (audit / re-run). Engine ghi dong thoi vao DiemChinhThuc,
            nen NgayTuDong khac null nghia la DiemChinhThuc la diem may cham chu khong
            phai Truong cham tay.
        IdNguoiTuDong:
          type: integer
          nullable: true
          description: Nguoi kich hoat cham tu dong (= chu phieu khi engine chay luc nop phieu).
        NgayTuDong:
          type: string
          format: date-time
          nullable: true
        MoTaHoanThanh:
          type: string
          nullable: true
        LaTruongHopDacBiet:
          type: boolean
        LyDoDacBiet:
          type: string
          nullable: true
        NgayTao:
          type: string
          format: date-time
          nullable: true
        MinhChung:
          type: array
          items:
            $ref: "#/components/schemas/MinhChungDto"
        NhiemVuCongDong:
          type: array
          items:
            $ref: "#/components/schemas/NhiemVuCongDongDto"
        LichSu:
          type: array
          nullable: true
          description: >
            Lich su cham diem cua RIENG tieu chi nay (moi lan_danh_gia, moi cap),
            sap xep tang dan theo thoi gian. CHI xuat hien khi goi
            GET api/phieu/{id}?kemLichSu=true hoac api/phieu/me/{idNam}?kemLichSu=true;
            mac dinh truong nay bi bo qua trong JSON.
          items:
            $ref: "#/components/schemas/LichSuChamDiemDto"
    ChiTietDanhGiaTuDanhGiaRequest:
      type: object
      properties:
        Diem:
          type: number
          nullable: true
          description: >-
            Khoang hop le phu thuoc tieu chi (SP kiem, tra error_code
            DIEM_VUOT_TOI_DA / DIEM_DUOI_SAN):
            LoaiDoiTuong <> 2 => 0..DiemToiDa;
            LoaiDoiTuong = 2 va DiemToiDa > 0 => -DiemToiDa..DiemToiDa;
            LoaiDoiTuong = 2 va DiemToiDa < 0 => DiemToiDa..0 (tieu chi chi tru diem).
        NhanXet:
          type: string
          nullable: true
        IdThangDiemChon:
          type: integer
          nullable: true
    ChiTietDanhGiaResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Item:
          $ref: "#/components/schemas/ChiTietDanhGiaDto"
        Items:
          type: array
          items:
            $ref: "#/components/schemas/ChiTietDanhGiaDto"
        TrangThaiPhieu:
          type: integer
          nullable: true
          description: >-
            Trang thai phieu SAU thao tac cap dong. = 3 nghia la dong vua chot la dong
            CUOI CUNG chua chot, ho so da tu chuyen sang cho Truong khoa duyet va roi
            khoi hang doi tham dinh. NULL o cac thao tac khong doi trang thai phieu.
        ErrorCode:
          type: string
          nullable: true
          description: >-
            Ma loi nghiep vu do SP tra ve: THIEU_DIEM / THIEU_LY_DO / AUTO_SCORED /
            INVALID_STATE_DONG / INVALID_STATE / FORBIDDEN_DON_VI / TO_TRINH_DA_TRINH /
            NOT_FOUND. NULL khi thanh cong.
        NewRowVersion:
          type: string
          format: byte
          nullable: true
          description: >-
            row_version MOI cua phieu cha sau thao tac. FE PHAI dung gia tri nay cho lan
            goi tiep theo tren cung phieu, neu khong se dinh 409 ngay o thao tac ke.
    PhieuQuyDto:
      type: object
      description: >
        Phieu danh gia cua MOT quy (vien chuc / NLD). CO Y gon hon PhieuDanhGiaChiTietDto:
        phieu quy khong co xep loai, khong co to trinh, khong co dinh muc / QD 838.
        No chi san sinh MOT CON SO: TongDiemCoBan cua quy do.
      properties:
        IdPhieu:
          type: integer
        IdNam:
          type: integer
        Quy:
          type: integer
          enum: [1, 2, 3, 4]
          description: Luon 1..4. Quy = 0 la phieu NAM, khong bao gio xuat hien o day.
        IdNhanVien:
          type: integer
        MaNhanVien:
          type: string
          nullable: true
        HoTen:
          type: string
          nullable: true
        IdDonVi:
          type: integer
        TenDonVi:
          type: string
          nullable: true
        IdChucVu:
          type: integer
          nullable: true
        TenChucVu:
          type: string
          nullable: true
        IdChucDanh:
          type: integer
          nullable: true
        TenChucDanh:
          type: string
          nullable: true
        IdMau:
          type: integer
          nullable: true
        LoaiDoiTuong:
          type: integer
          description: Luon 2 (vien chuc / NLD) — chk_pdg_quy_loai_doi_tuong chan cung.
        TrangThai:
          type: integer
          enum: [1, 2, 5]
          description: >
            CHI ba gia tri. 1 = nhan vien dang tu cham; 2 = DA NOP, CHO TRUONG PHONG
            DUYET (doc KHAC luong nam, o do 2 la "Dang tham dinh"); 5 = TP da chot diem.
            Gia tri 3 va 4 khong bao gio xuat hien (chk_pdg_quy_trang_thai).
        TrangThaiText:
          type: string
          nullable: true
          readOnly: true
          description: Nhap / Cho Truong phong duyet / Da chot diem quy.
        LanDanhGia:
          type: integer
        TongDiemCoBan:
          type: number
          format: double
          nullable: true
          description: Con so duy nhat phieu quy sinh ra — dau vao cua roll-up cuoi nam.
        TongDiemVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            Luon 0 tren phieu quy. Diem vuot troi duoc cong NGUYEN ca nam o phieu NAM
            chu khong lay trung binh, nen phieu quy khong seed dong nhom B.
        TongDiemTichLuy:
          type: number
          format: double
          nullable: true
        IdNguoiDgKhoa:
          type: integer
          nullable: true
          description: Truong phong da duyet (tai dung cot id_nguoi_dg_khoa cua bang chung).
        NgayKhoaDuyet:
          type: string
          format: date-time
          nullable: true
        NhanXetKhoa:
          type: string
          nullable: true
        IdNguoiChot:
          type: integer
          nullable: true
        NgayChotKetQua:
          type: string
          format: date-time
          nullable: true
        NgayGui:
          type: string
          format: date-time
          nullable: true
        NgayTao:
          type: string
          format: date-time
          nullable: true
        NgayCapNhat:
          type: string
          format: date-time
          nullable: true
        RowVersion:
          type: string
          format: byte
          nullable: true
        ChiTiet:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChiTietDanhGiaDto"
    PhieuQuyResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
          nullable: true
        ErrorCode:
          type: string
          nullable: true
        Item:
          allOf:
            - $ref: "#/components/schemas/PhieuQuyDto"
          nullable: true
        Items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PhieuQuyDto"
        TotalCount:
          type: integer
          nullable: true
        TongDiemCoBan:
          type: number
          format: double
          nullable: true
          description: >
            CHI POST /api/phieu-quy/{id}/tp/duyet chieu ba cot nay — ket qua chot diem
            cua quy vua duyet, de FE hien ngay khong phai goi lai GET. Cac thao tac khac
            de null (NullValueHandling.Ignore nen JSON bo qua han).
        TongDiemVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            Nhu tren. DA cat tran nhom B neu nhom co cau hinh tran — xem
            PhieuNamTongHopQuyResponse.TranNhomVuotTroi.
        TongDiemTichLuy:
          type: number
          format: double
          nullable: true
          description: Nhu tren. = TongDiemCoBan + TongDiemVuotTroi.
    PhieuQuyCreateRequest:
      type: object
      required:
        - IdNam
        - IdNhanVien
        - Quy
        - IdMau
      properties:
        IdNam:
          type: integer
        IdNhanVien:
          type: integer
        Quy:
          type: integer
          enum: [1, 2, 3, 4]
        IdMau:
          type: integer
          description: Phai la mau co loai_doi_tuong = 2.
        IdDonVi:
          type: integer
          nullable: true
          description: Bo trong = don vi chinh cua nhan vien.
    PhieuQuyNopRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
        RowVersion:
          type: string
          format: byte
    PhieuQuyHuyNopRequest:
      type: object
      required:
        - RowVersion
      properties:
        LyDo:
          type: string
          nullable: true
        RowVersion:
          type: string
          format: byte
    PhieuQuyTraVeRequest:
      type: object
      required:
        - LyDo
        - RowVersion
      properties:
        LyDo:
          type: string
          description: BAT BUOC — thieu tra THIEU_LY_DO.
        RowVersion:
          type: string
          format: byte
    PhieuQuyDiemItem:
      type: object
      required:
        - IdChiTiet
      properties:
        IdChiTiet:
          type: integer
        Diem:
          type: number
          format: double
          nullable: true
          description: >
            Bo trong = giu nguyen diem nhan vien tu cham cho dong nay.
            DUOC PHEP AM: tieu chi vien chuc co the chi tru diem.
        NhanXet:
          type: string
          nullable: true
    PhieuQuyTpDuyetRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
        Diem:
          type: array
          nullable: true
          description: Bo trong = chap nhan nguyen diem nhan vien tu cham.
          items:
            $ref: "#/components/schemas/PhieuQuyDiemItem"
        RowVersion:
          type: string
          format: byte
    PhieuQuyTongHopDto:
      type: object
      properties:
        Quy:
          type: integer
          enum: [1, 2, 3, 4]
        IdPhieu:
          type: integer
          nullable: true
          description: null = quy nay chua tao phieu.
        TrangThai:
          type: integer
          nullable: true
        TrangThaiText:
          type: string
          nullable: true
          readOnly: true
        TongDiemCoBan:
          type: number
          format: double
          nullable: true
        TongDiemVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            Vuot troi RIENG cua quy nay, CHUA kep tran cuoi nam. DUNG cong bon con so
            nay lai roi doi khop voi tong nam: cuoi nam tung tieu chi bi kep lai mot lan
            nua roi ca nhom bi cat tiep, nen tong nam co the NHO HON.
        TongDiemTichLuy:
          type: number
          format: double
          nullable: true
        NgayChotKetQua:
          type: string
          format: date-time
          nullable: true
        DaChot:
          type: boolean
          description: CHI nhung quy nay vao mau so cua phep trung binh.
    PhieuQuyVuotTroiTieuChiDto:
      type: object
      description: >
        MOT tieu chi nhom B (thanh tich vuot troi), cong don qua cac quy DA CHOT roi kep
        vao khoang hop le cua chinh tieu chi do. Day la bang FE PHAI hien de nguoi bi kep
        diem hieu vi sao tong cuoi nam nho hon tong bon quy cong lai.
        LUU Y: bang nay chi giai trinh duoc phep cat THU NHAT (theo tung tieu chi). Phep
        cat THU HAI (tran cua ca nhom B) khong xuat hien o dong nao trong bang — xem
        TranNhomVuotTroi / TongVuotTroiTruocTranNhom o response bao ngoai.
      properties:
        IdTieuChi:
          type: integer
        TenTieuChi:
          type: string
          nullable: true
        DiemToiDa:
          type: number
          format: double
          nullable: true
          description: >
            Dau AM co nghia: tieu chi CHI TRU DIEM. Khi do khoang hop le la
            [DiemToiDa, 0] chu khong phai [0, DiemToiDa].
        DiemQuy1:
          type: number
          format: double
          nullable: true
        DiemQuy2:
          type: number
          format: double
          nullable: true
        DiemQuy3:
          type: number
          format: double
          nullable: true
        DiemQuy4:
          type: number
          format: double
          nullable: true
        TongCacQuy:
          type: number
          format: double
          nullable: true
          description: Tong bon quy TRUOC khi kep.
        DiemSauKep:
          type: number
          format: double
          nullable: true
          description: Con so THUC SU duoc cong vao diem vuot troi cuoi nam.
        BiKep:
          type: boolean
          description: true = TongCacQuy da cham tran (hoac san) nen bi cat bot.
        SoQuyCoDong:
          type: integer
          nullable: true
          description: So quy co dong cua tieu chi nay trong cac quy da chot (toi da 4).
    PhieuQuyTongHopResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
          nullable: true
        ErrorCode:
          type: string
          nullable: true
        IdNam:
          type: integer
        IdNhanVien:
          type: integer
        IdDonVi:
          type: integer
        Quy:
          type: array
          description: LUON du 4 phan tu, quy 1..4 theo thu tu.
          items:
            $ref: "#/components/schemas/PhieuQuyTongHopDto"
        SoQuyDaChot:
          type: integer
          description: MAU SO thuc dung cua phep trung binh — khong phai 4.
        DiemCoBanTbQuy:
          type: number
          format: double
          nullable: true
          description: >
            null khi SoQuyDaChot = 0. KHONG phai 0 — hai truong hop khac nhau.
            DA LOAI 3 dong VPVC_* ra khoi phep trung binh — xem DiemVpvcNam.
        DiemVpvcNam:
          type: number
          format: double
          description: >
            3 tieu chi VPVC_* tren phieu NAM, cham TRON NAM (tru du moi vi pham trong
            nam, KHONG lay trung binh 4 quy vi nhu vay chi tru ~1/4). 0 khi chua co
            phieu nam. Ve co ban cuoi nam = DiemCoBanTbQuy + DiemVpvcNam.
        DiemVuotTroiTongQuy:
          type: number
          format: double
          nullable: true
          description: >
            CONG DON cac quy da chot, tung tieu chi da KEP o tran cua no, ROI ca nhom B
            da cat o TranNhomVuotTroi. Day la con so ma roll-up cuoi nam se ghi that.
            null khi SoQuyDaChot = 0 — cung hop dong voi DiemCoBanTbQuy.
        TranNhomVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            Tran cua CA nhom B (nhom_tieu_chi.diem_toi_da cua nut goc, vd 50 voi bang
            vien chuc / NLD). null = KHONG co tran (chua co phieu nam, hoac mau khong co
            tieu chi nhom B nao). null KHONG phai 0 — 0 se la "khong duoc diem nao".
        TongVuotTroiTruocTranNhom:
          type: number
          format: double
          nullable: true
          description: >
            Tong sau khi kep TUNG tieu chi nhung TRUOC khi cat tran nhom. Lon hon
            DiemVuotTroiTongQuy => tran nhom da cat bot. FE PHAI hien ro cho nguoi bi
            cat: day la phep cat THU HAI, no khong the hien duoc trong bang
            VuotTroiTheoTieuChi.
        DiemTichLuyDuKien:
          type: number
          format: double
          nullable: true
          description: >
            XEM TRUOC tich luy cuoi nam
            = DiemCoBanTbQuy + DiemVpvcNam + DiemVuotTroiTongQuy.
            Con so ghi that do POST /api/phieu/{id}/tong-hop-tu-quy tinh lai.
        VuotTroiTheoTieuChi:
          type: array
          description: >
            Phan ra vuot troi theo tung tieu chi. LUON khac null (co the rong) de FE
            khong phai kiem tra null truoc khi duyet.
          items:
            $ref: "#/components/schemas/PhieuQuyVuotTroiTieuChiDto"
        DanhSachQuyDaChot:
          type: string
          nullable: true
          description: Vi du "1,2,4".
    PhieuNamTongHopQuyRequest:
      type: object
      required:
        - RowVersion
      properties:
        RowVersion:
          type: string
          format: byte
    PhieuNamTongHopQuyResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
          nullable: true
        ErrorCode:
          type: string
          nullable: true
        IdPhieu:
          type: integer
          nullable: true
        CanhBao:
          type: boolean
          description: >
            true khi tong hop tu DUOI 4 quy. KHONG phai loi — mau so la so quy thuc co —
            nhung FE phai hien ro "chi tong hop tu N quy".
        SoQuyDaChot:
          type: integer
        DanhSachQuyDaChot:
          type: string
          nullable: true
        DiemCoBanTbQuy:
          type: number
          format: double
          nullable: true
          description: >
            SO HANG THU NHAT cua ve co ban: TRUNG BINH nhom A cac quy da chot, DA LOAI
            3 dong VPVC_*. Giu rieng de con doi chieu duoc phep trung binh.
        DiemVpvcNam:
          type: number
          format: double
          nullable: true
          description: >
            SO HANG THU HAI: 3 tieu chi VPVC_* cham TRON NAM tren chinh phieu nam.
            Chung KHONG lay trung binh 4 quy — trung binh chi tru ~1/4 so vi pham ca nam.
        TongDiemCoBan:
          type: number
          format: double
          nullable: true
          description: = DiemCoBanTbQuy + DiemVpvcNam. Day moi la con so ghi vao phieu.
        TongDiemVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            CONG DON cac quy theo TUNG TIEU CHI (moi tieu chi kep vao khoang hop le cua
            chinh no), ROI ca nhom B cat o TranNhomVuotTroi. DUNG doi khop con so nay
            voi tong bon quy cong lai: khi tran can no NHO HON. Do la hai phep cat,
            khong phai lech du lieu.
        TranNhomVuotTroi:
          type: number
          format: double
          nullable: true
          description: >
            Tran cua CA nhom B (nhom_tieu_chi.diem_toi_da cua nut goc, vd 50).
            null = KHONG co tran, KHONG phai 0.
        TongVuotTroiTruocTranNhom:
          type: number
          format: double
          nullable: true
          description: >
            Tong sau khi kep TUNG tieu chi nhung TRUOC khi cat tran nhom. Lon hon
            TongDiemVuotTroi => tran nhom da cat bot. PHAI hien cung VuotTroiTheoTieuChi:
            bang do chi giai trinh duoc phep kep THU NHAT.
        TongDiemTichLuy:
          type: number
          format: double
          nullable: true
          description: = TongDiemCoBan + TongDiemVuotTroi.
        VuotTroiTheoTieuChi:
          type: array
          description: >
            Phan ra theo tung tieu chi nhom B: tieu chi nao bi kep va kep bao nhieu.
            LUON khac null (co the rong).
          items:
            $ref: "#/components/schemas/PhieuQuyVuotTroiTieuChiDto"
        SoTieuChiTuDongBoSot:
          type: integer
          description: >
            TRIPWIRE: so tieu chi CHAM TU DONG co trong mau nhung khong phieu nao seed,
            nen dang dong gop 0 diem. 3 ma VPVC_* va 4 ma TTVT_* da duoc mo cong seed
            nen deu duoc loai tru; > 0 nghia la con ma cham tu dong KHAC chua co cho
            dung o cap quy.
        CanhBaoTieuChiTuDong:
          type: boolean
          description: >
            true khi SoTieuChiTuDongBoSot > 0 — FE phai hien banner tren man hinh roll-up.
    PhieuDanhGiaChiTietDto:
      type: object
      properties:
        IdPhieu:
          type: integer
        Quy:
          type: integer
          description: >
            Quy phat sinh cua phieu. 0 = phieu NAM (mac dinh; moi phieu giang vien va
            moi phieu co truoc dot "Danh gia theo quy"). 1..4 = phieu QUY cua vien chuc.
            GET /api/phieu va /api/phieu/me/{idNam} mac dinh CHI tra phieu nam.
        NguonDiemCoBan:
          type: integer
          enum: [1, 2]
          description: >
            Chi co o GET /api/phieu/{id}. 1 = TongDiemCoBan la tong dong nhom A cua
            CHINH phieu nay (hanh vi cu). 2 = TongDiemCoBan la TRUNG BINH cac quy DA
            CHOT; phieu nay KHONG co dong nhom A. Chi vien chuc / NLD trong nam da bat
            ap_dung_phieu_quy.
        DiemCoBanTbQuy:
          type: number
          format: double
          nullable: true
          description: Ban sao audit cua trung binh da tinh. null khi chua chay roll-up.
        SoQuyDaChot:
          type: integer
          nullable: true
          description: MAU SO thuc dung — so quy DA CHOT, KHONG phai 4.
        DanhSachQuyDaChot:
          type: string
          nullable: true
          description: Vi du "1,2,4". SoQuyDaChot mot minh khong audit duoc la quy nao.
        NgayTongHopQuy:
          type: string
          format: date-time
          nullable: true
        IdNguoiTongHopQuy:
          type: integer
          nullable: true
        TrangThaiText:
          type: string
          nullable: true
          readOnly: true
          description: >-
            1 Nhap, 2 Dang tham dinh, 3 Cho Truong khoa duyet, 4 CHO HIEU TRUONG DUYET,
            5 Hoan tat. Nghia cua 3 va 4 DA DOI so voi luong cu.
            LUONG DUYET TACH DOI: text cua muc 4 doi tu "Truong khoa da chot" thanh
            "Cho Hieu truong duyet" — sau buoc dong goi to trinh, trang thai 4 chi con
            la tram dung cua HO SO LANH DAO (CanHtDuyet = true). Ho so thuong di thang
            4 -> 5 ngay trong sp_to_trinh_khoa_dong_goi.
            FE co bang map rieng thi PHAI sua muc 4; hoac dung thang TrangThaiText nay.
        IdToTrinh:
          type: integer
          nullable: true
          description: Goi KPI Khoa ma ho so nay thuoc ve; gan luc TK chot ho so (3 -> 4)
        XepLoaiKhoa:
          type: integer
          format: int32
          nullable: true
          enum: [1, 2, 3]
          description: Truong khoa chon tay. Muc 4 do buoc dong goi to trinh quyet dinh.
        XepLoaiDeXuat:
          type: integer
          format: int32
          nullable: true
          description: He thong goi y (XepLoaiCalculator), chi de doi chieu - khong rang buoc TK
        IdNguoiXepLoai:
          type: integer
          nullable: true
        NgayXepLoai:
          type: string
          format: date-time
          nullable: true
        LyDoXepLoai:
