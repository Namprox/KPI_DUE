      description: >
        Tra ve minh chung kem NGU CANH (tieu chi, phieu, nam, don vi) de FE dung o mot man
        hinh "Kho minh chung" rieng, thay vi phai goi GET
        api/chi-tiet-don-vi/{idChiTiet}/minh-chung cho tung tieu chi.
        DUNG CHUNG cho Khoa va Phong/Trung tam: ca hai deu la don_vi.cap_don_vi = 2 va
        schema khong co cot nao tach rieng hai loai - FE loc bang idDonVi.
        Bo loc: idPhieuDv (uu tien cao nhat) -> dung phieu do; nguoc lai ap idNam va/hoac
        idDonVi; KHONG truyen gi -> mac dinh don vi cua nguoi dang dang nhap, xuyen nam
        (nen HT/ADMIN khong vo tinh liet ke minh chung cua toan truong).
        Quyen doc giong GET api/chi-tiet-don-vi/{idChiTiet}/minh-chung: ADMIN/HT toan he
        thong; TKK/TKP/TK/TKL/TP trong pham vi don vi. KHONG rang buoc trang thai phieu.
        Khong co phieu nao khop bo loc -> 404; co phieu nhung khong duoc doc -> 403
        (KHONG tra ve mang rong im lang). Phieu hop le nhung chua co minh chung -> 200 voi
        Items la mang rong.
        Ket qua sap xep theo nam giam dan, ten don vi, roi thu tu hien thi cua tieu chi.
      operationId: minhChungDonViGetKho
      parameters:
