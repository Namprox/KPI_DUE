  /api/maudanhgia/{id}/diem-tu-dong:
    get:
      tags:
        - MauDanhGia
      summary: Xem trước điểm tự động của các tiêu chí loai_nguon_diem=2 trong mẫu
      description: >
        Tính on-the-fly qua fn_nckh_diem_tu_dong, KHÔNG ghi DB và không cần phiếu.
        Năm đánh giá lấy từ chính mẫu (mau_danh_gia.id_nam).
        Mỗi phần tử Items = 1 giảng viên × 1 tiêu chí tự động.
        DiemTuDong = null nghĩa là mã công thức chưa được hỗ trợ.

        PHẠM VI THỜI GIAN — tham số quy: bỏ trống (hoặc 0) = TRỌN NĂM, đúng hành vi
        trước đây. quy = 1..4 = bản XEM TRƯỚC của phiếu quý: dùng chung
        fn_nckh_diem_tu_dong với sp_phieu_cham_tu_dong_apply (engine chạy bên trong
        POST /api/phieu-quy/{id}/nop) nên con số KHÔNG THỂ lệch với lúc nộp phiếu quý đó.
        CHỈ 7 mã đọc bộ lọc quý — 4 mã TTVT_* và 3 mã VPVC_*; các mã còn lại khóa theo
        năm nên vẫn trả số trọn năm. Dùng Items[].ApDungQuy để biết dòng nào thực sự
        được lọc, thay vì hardcode danh sách mã ở phía FE.

        MinhChung (các bản ghi nguồn đã tạo ra điểm) CHỈ được trả khi truyền
        idNhanVien — gọi toàn trường luôn trả mảng rỗng để tránh payload quá lớn.
        Minh chứng dùng chung bộ vị từ với sp_nckh_dong_bo (fn_nckh_minh_chung_tu_dong)
        nên luôn khớp với cờ trong nckh_tong_hop.

        Riêng tiêu chí NCKH_GIO_TY_LE (điểm là kết quả một phép chia, không phải
        đạt/không đạt) có thêm DuLieuGioNckh = dòng nckh_gio_nckh đã sinh ra điểm, và
        LyDoDiemTuDong khi điểm 0 là do dữ liệu nguồn — đủ để FE hiển thị cách tính mà
        không phải gọi thêm GET /api/nckh/gio-nckh. Hai trường này KHÔNG phụ thuộc
        idNhanVien (gọi toàn trường vẫn có).

        Tương tự, tiêu chí NCKH_BBQT_DIEM_KPI (điểm do phía NCKH tính sẵn) có thêm
        DuLieuBaiBaoQuocTe = dòng nckh_kpi_bai_bao_quoc_te đã sinh ra điểm, để đối chiếu
        con số với dữ liệu gốc. Trường này cũng KHÔNG phụ thuộc idNhanVien, NHƯNG trường
        con BaiBao (mảng bài báo chi tiết) thì CÓ: chỉ trả khi truyền idNhanVien, cùng
        quy ước với MinhChung để tránh payload quá lớn. Gọi toàn trường vẫn có SoBaiBao
        để biết số lượng.
      operationId: mauDanhGiaGetDiemTuDong
      parameters:
        - name: id
          in: path
          required: true
          description: Id mẫu đánh giá
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          description: >
            Bỏ trống = tất cả giảng viên đang hoạt động có dữ liệu tự động của năm
            (có snapshot nckh_tong_hop hoặc đã chốt điểm TB phản hồi sinh viên);
            nếu mẫu có tiêu chí VPGD_TUAN_THU thì mở rộng ra toàn bộ giảng viên Khoa
            (v_giang_vien_khoa) vì không vi phạm = trọn điểm; nếu mẫu có tiêu chí
            NCKH_BBQT_DIEM_KPI thì mở rộng thêm những người có dòng trong
            nckh_kpi_bai_bao_quoc_te của năm đó (nguồn đồng bộ RIÊNG, không kéo theo
            snapshot nckh_tong_hop).
            Có giá trị = chỉ giảng viên đó, VÀ kèm MinhChung + DuLieuBaiBaoQuocTe.BaiBao.
          schema:
            type: integer
        - name: quy
          in: query
          required: false
          description: >
            Bỏ trống hoặc 0 = trọn năm (mặc định, hành vi trước đây).
            1..4 = chỉ dữ liệu ghi nhận trong quý đó — bản xem trước của phiếu quý.
            Lọc theo quý ảnh hưởng ĐÚNG 7 mã: TTVT_SANG_KIEN, TTVT_KHEN_THUONG,
            TTVT_DAO_TAO, TTVT_PHONG_TRAO (lọc chi_tiet_ke_khai_thanh_tich.quy) và
            VPVC_HOAN_THANH_CV, VPVC_NOI_QUY, VPVC_CHINH_TRI (lọc vi_pham_giang_day.quy).
            Các mã NCKH / phản hồi SV / VPGD_TUAN_THU / NVK_PHAN_CONG_KHOA khóa theo năm
            → vẫn là số trọn năm. MinhChung cũng được lọc CÙNG phạm vi nên luôn cộng ra
            đúng con số hiển thị bên cạnh.
            Ngoài [0, 4] → 400.
          schema:
            type: integer
            minimum: 0
            maximum: 4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
        "400":
          description: Id mẫu, id nhân viên hoặc quý không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
        "404":
          description: Không tìm thấy mẫu đánh giá hoặc nhân viên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
