      operationId: minhChungGetByChiTiet
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "403":
          description: Forbidden
