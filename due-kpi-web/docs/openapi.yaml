  /api/phieu/{id}/lich-su-trang-thai:
    get:
      tags:
        - BaoCao
      summary: Audit trail of phieu state transitions
      description: |
        Returns all rows from lich_su_trang_thai_phieu for the phieu, ordered by ngay_thuc_hien ASC.
        Each row is one state transition (submit / approve / return / chot / mo-lai), with the
        person's name joined from nhan_vien. ly_do and nhan_xet are returned verbatim.
        Don_vi scoping mirrors GET /api/phieu (Khoa sees their tree; Truong sees all; GV sees own).
      operationId: phieuGetLichSuTrangThai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuTrangThaiResponse"
  /api/phieu/{id}/lich-su-cham-diem:
    get:
      tags:
        - BaoCao
      summary: Audit trail of score changes for a phieu, grouped by (lan_danh_gia, id_chi_tiet, cap)
      description: |
        Used by the UI to show "Round 1 Khoa scored X, after return Round 2 Khoa scored Y".
        Each group contains its ordered list of entries (timestamps), so the consumer can render
        a full timeline per criterion per evaluator level per round.
      operationId: phieuGetLichSuChamDiem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
