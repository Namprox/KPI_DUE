  /api/chitiet/{idChiTiet}/diem-khoa:
    put:
      tags:
        - ChiTietDanhGia
      summary: Tham dinh SUA diem cua 1 dong (dong 2 -> 3)
      description: |
        GIAI DOAN 2. Quyền theo ma_chuc_vu: nếu tiêu chí có phân quyền riêng
        (tieu_chi_don_vi_cham) thì CHỈ trưởng đơn vị được giao (TK/TKL/TP) chấm;
        nếu không có phân quyền thì mặc định trưởng đơn vị chủ quản (TK/TKL/TP).
        Vết người chấm lưu ở id_nguoi_dg_khoa + id_don_vi_tham_dinh.

        HAI RANG BUOC MOI cua quy trinh 4 giai doan:
        - `Diem` BAT BUOC (400 / THIEU_DIEM neu thieu). Truoc day cho NULL vi diem
          chinh thuc chot o buoc HT; nay dong chot ngay tai day nen "chot ma khong
          co diem" la vo nghia.
        - `NhanXet` BAT BUOC khi `Diem` KHAC diem chu phieu tu ke khai
          (409 / THIEU_LY_DO). Sua diem cua nguoi khac ma khong noi ly do la nguon
          khieu nai lon nhat cua quy trinh cu.

        Muon GIU NGUYEN diem chu phieu tu ke khai thi dung
        POST /api/chitiet/{idChiTiet}/tham-dinh/duyet (khong doi lay ly do).

        SP ghi luon diem_chinh_thuc + trang_thai_dong = 3 + id_don_vi_tham_dinh, roi
        dong bo trang thai phieu: khi day la dong CUOI CUNG chua chot, phieu tu chuyen
        2 -> 3 (doc `TrangThaiPhieu` trong response).
      operationId: chiTietDanhGiaDiemKhoa
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChiTietDanhGiaDiemKhoaRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
  /api/chitiet/{idChiTiet}/tham-dinh/duyet:
    post:
      tags:
        - ChiTietDanhGia
      summary: Tham dinh DUYET giu nguyen diem chu phieu (dong 2 -> 3)
      description: |
        GIAI DOAN 2, duong di NHANH. Chuyen vien doi chieu minh chung, thay khop,
        bam Duyet: diem_khoa = diem_chinh_thuc = diem chu phieu tu ke khai,
        trang_thai_dong -> 3 DA_CHOT. KHONG doi ly do.

        Muon SUA diem thi dung PUT /api/chitiet/{idChiTiet}/diem-khoa (o do nhan xet
        BAT BUOC khi diem lech).

        AI GOI: tieu chi CO dong trong tieu_chi_don_vi_cham -> chi truong cua DUNG
        don vi duoc giao (TK/TKL/TP); tieu chi CHUA phan quyen -> truong don vi chu
        quan cua nguoi duoc danh gia.

        Khi dong nay la dong CUOI CUNG chua chot, phieu tu chuyen 2 -> 3 (cho Truong
        khoa duyet ho so) - doc TrangThaiPhieu trong response de bo dong khoi hang doi.
      operationId: chiTietThamDinhDuyet
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChiTietThamDinhDuyetRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "403":
          description: Khong co quyen tham dinh tieu chi nay (FORBIDDEN_DON_VI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "409":
          description: >-
            Conflict - tieu chi cham tu dong (AUTO_SCORED), dong khong o trang thai 2
            (INVALID_STATE_DONG), phieu khong o giai doan tham dinh (INVALID_STATE),
            hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
  /api/chitiet/{idChiTiet}/tham-dinh/tra-ve:
    post:
      tags:
        - ChiTietDanhGia
      summary: Tham dinh TRA VE mot dong cho chu phieu bo sung (dong 2 -> 1)
      description: |
        GIAI DOAN 2. THAY THE POST /api/phieu/{id}/khoa/tra-lai cua luong cu - SP do
        xoa sach diem_khoa cua MOI dong khi tra phieu ve, ke ca nhung tieu chi do
        Phong khac da cham dung (bug goc cua module).

        O day chi DUNG MOT dong tut ve 1 KE_KHAI: cac dong khac giu nguyen tien do va
        giu nguyen diem da cham. lan_danh_gia KHONG doi - day khong phai mot vong danh
        gia moi. Phieu VAN o trang thai 2.

        diem_khoa / diem_chinh_thuc cua RIENG dong nay bi xoa (dong khong con o trang
        thai chot thi khong duoc phep con diem chot). so_lan_tra_ve cong don ca vong
        doi, khong reset khi nop lai.

        LyDo BAT BUOC. Sau do chu phieu sua dong roi goi POST /api/phieu/{id}/nop-lai.

        ENDPOINT NAY KHONG KIEM TRA HAN - tham dinh vien tra ve duoc bat cu luc nao.
        Chu phieu sau do gate bang ngay_dong_danh_gia_cap_tren (khong phai han tu danh
        gia), nen tra ve sau khi han tu danh gia dong van hoan toan binh thuong.
        Chi luu y: neu han THAM DINH cung da het thi dong tra ve nay se khong ai hoan
        thanh duoc - khi do phai cap gia han qua POST /api/gia-han.
      operationId: chiTietThamDinhTraVe
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChiTietTraVeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "400":
          description: Thieu ly do tra ve (THIEU_LY_DO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "403":
          description: Khong co quyen tham dinh tieu chi nay (FORBIDDEN_DON_VI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "409":
          description: >-
            Conflict - tieu chi cham tu dong (AUTO_SCORED), dong khong o trang thai 2
            (INVALID_STATE_DONG), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
  /api/chitiet/{idChiTiet}/khoa/tra-tham-dinh:
    post:
      tags:
        - ChiTietDanhGia
      summary: Truong khoa tra mot dong ve don vi tham dinh lam lai (dong 3 -> 2)
      description: |
        GIAI DOAN 3. Vi du that: "Phong Dao tao kiem tra lai gio chuan cua thay X".

        Khac POST .../tham-dinh/tra-ve (tra cho CHU PHIEU): day tra ve cho DON VI
        THAM DINH, chu phieu khong phai lam gi. diem_khoa GIU NGUYEN de chuyen vien
        doi chieu, nhung diem_chinh_thuc bi xoa.

        AI GOI: truong don vi CHU QUAN cua ho so (TK/TKL/TP trong cay don vi cua minh)
        hoac ADMIN.

        HAU QUA THEO TRANG THAI HO SO:
        - Ho so o 3: tu tut ve 2 (bat bien 2 <-> 3).
        - Ho so o 4 (TK da chot): tut thang ve 2 va TOAN BO ket luan xep loai cua TK
          bi HUY (xep_loai_khoa, xep_loai_de_xuat, ly_do_xep_loai, hang_trong_khoa,
          xep_loai, id_to_trinh deu ve NULL) - phai chot lai sau khi tham dinh xong.
          Goi KPI Khoa cung tut ve 1 DANG_TONG_HOP.

        CHAN khi goi KPI da trinh HT (trang thai 3) hoac da duoc HT duyet THAT
        (trang thai 4 + id_nguoi_duyet IS NOT NULL): phai de HT tra ho so ve truoc qua
        POST /api/to-trinh-khoa/{id}/ht-tra-lai.
        NGOAI LE: goi o trang thai 4 ma id_nguoi_duyet IS NULL la goi TU DONG HOAN TAT
        (don vi khong co ho so lanh dao) — chua qua tay HT lan nao nen VAN rut dong ra
        duoc, goi se tu ha ve 1 DANG_TONG_HOP.

        LyDo BAT BUOC.
      operationId: chiTietKhoaTraThamDinh
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChiTietTraVeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "400":
          description: Thieu ly do tra ve (THIEU_LY_DO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "403":
          description: Khong phai truong don vi chu quan cua ho so (FORBIDDEN / FORBIDDEN_DON_VI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
        "409":
          description: >-
            Conflict - tieu chi cham tu dong (AUTO_SCORED), dong chua chot diem
            (INVALID_STATE_DONG), ho so khong o trang thai 3/4 (INVALID_STATE), goi KPI
            da trinh HT (TO_TRINH_DA_TRINH), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiTietDanhGiaResponse"
  /api/chitiet/{idChiTiet}/minh-chung/file:
    post:
      tags:
        - MinhChung
      summary: Upload file evidence for a chi_tiet
      operationId: minhChungUploadFile
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    Binary file - CHI nhan PDF va tep hinh anh (pdf, png, jpg, jpeg; max 10 MB).
                    Kiem HAI LOP: duoi file phai nam trong whitelist VA noi dung phai khop
                    chu ky (magic bytes) cua duoi do - doi duoi se bi tu choi 400.
                    Cac dinh dang Office (doc/docx/xls/xlsx) KHONG con duoc chap nhan; ban ghi
                    cu da upload truoc do van tai xuong binh thuong.
                tenHienThi:
                  type: string
                  description: Optional display name. Defaults to the file's base name.
                rowVersion:
                  type: string
                  description: >-
                    row_version cua PHIEU cha (base64, 8 byte) - TUY CHON. Khong gui thi
                    bo qua kiem tra optimistic concurrency (tuong thich nguoc). Gui gia tri
                    cu se nhan 409 CONCURRENCY_CONFLICT.
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "400":
          description: >-
            Bad Request (thieu file, sai duoi file, file qua lon, noi dung khong khop
            chu ky dinh dang, hoac RowVersion sai dinh dang)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: chi_tiet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "409":
          description: >-
            Dong tieu chi khong o trang_thai_dong = 1 KE_KHAI (dang cho tham dinh hoac
            da chot diem), hoac da qua han. Gate theo DONG chu khong theo trang thai
            phieu - dong vua bi tra ve van ghi minh chung duoc du phieu o trang thai 2.
            Han lay theo giai doan phieu: trang thai 1 -> ngay_dong_tu_danh_gia;
            trang thai 2 -> ngay_dong_danh_gia_cap_tren.
            Cung tra 409 voi ErrorCode = CONCURRENCY_CONFLICT khi rowVersion duoc gui
            nhung khong con khop row_version hien tai cua phieu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
