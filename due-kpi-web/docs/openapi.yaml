          in: query
          required: false
          schema:
            type: string
        - name: choToiCham
          in: query
          required: false
          description: >-
            true = hang doi cua don vi duoc giao: chi phieu o trang_thai = 2 con it nhat
            1 tieu chi duoc giao cho nguoi goi (tieu_chi_don_vi_cham) ma chua co
            DiemDuyetDv. Tieu chi tu dong (LoaiNguonDiem = 2) cung tinh - cham/xac nhan
            xong thi phieu roi hang doi; phieu len trang_thai 3 cung roi hang doi.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaDonViResponse"
