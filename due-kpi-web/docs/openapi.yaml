      summary: List phieu awaiting Khoa evaluation
      description: >
        GIAI ĐOẠN 2 — hàng đợi thẩm định theo **PHIẾU** (view tổng quan hồ sơ).
        Đơn vị nào cần danh sách thao tác theo **DÒNG** thì dùng
        GET /api/tham-dinh/pending; hai endpoint bổ sung cho nhau, không thay thế nhau.

        Chỉ trưởng đơn vị xem được (ma_chuc_vu TK/TKL/TP), lấy theo phân quyền
        **tieu_chi_don_vi_cham**: chỉ trả phiếu (trang_thai=2) mà đơn vị của người
        đăng nhập có ≥1 tiêu chí được giao chấm — hoặc do tiêu chí đã phân quyền cho
        đơn vị này, hoặc tiêu chí chưa phân quyền và đơn vị này là chủ quản của phiếu.

        Kiêm nhiệm: "đơn vị của người đăng nhập" ở đây là **mọi đơn vị mà người đó
        thực sự giữ chức vụ TK/TKL/TP** (+ cây đơn vị cấp dưới), không chỉ đơn vị
        trong JWT — xem mục phân quyền ở đầu tài liệu. Đơn vị mà họ chỉ là thành viên
        (giảng dạy, không giữ chức vụ) **không** vào hàng đợi này.

        Mỗi phiếu kèm tiến độ SoTieuChiDuocGiao / SoTieuChiDaCham. Từ quy trình 4 giai
        đoạn, **SoTieuChiDaCham đếm theo trang_thai_dong = 3 (DA_CHOT)**, không còn đếm
        "diem_khoa IS NOT NULL": một dòng bị trả về vẫn giữ diem_khoa của vòng trước,
        đếm theo diem_khoa sẽ báo "đã chấm xong" trong khi đơn vị vẫn còn phải xử lý nó.
        Cả 2 chỉ số đều bỏ qua dòng chấm tự động (loai_nguon_diem = 2).

        Phiếu rời hàng đợi khi **mọi dòng** đạt trang_thai_dong = 3; lúc đó phiếu
        **tự chuyển** sang trang_thai=3 CHO_TK_DUYET — chờ **Trưởng khoa** chốt hồ sơ qua
        POST /api/phieu/{id}/khoa/duyet-ho-so, KHÔNG phải chờ Hiệu trưởng (HT nay duyệt
        cả gói qua POST /api/to-trinh-khoa/{id}/ht-duyet). Phiếu có thể quay lại hàng đợi
        này khi một dòng bị trả về (3 → 2). Response của
        PUT /api/chitiet/{idChiTiet}/diem-khoa trả về TrangThaiPhieu để FE biết phiếu
        vừa rời hàng đợi.
      operationId: phieuDanhGiaGetKhoaPending
      parameters:
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          description: "ngay_gui (mac dinh) hoac ngay_tao."
          schema:
            type: string
            enum: [ngay_gui, ngay_tao]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
  /api/phieu/truong/pending:
    get:
      tags:
        - PhieuDanhGia
      summary: List ho so LANH DAO cho Hieu truong duyet (theo doi, KHONG con nut duyet le)
      description: >
        GIAI ĐOẠN 4 — danh sách hồ sơ cấp Trường: chỉ trả phiếu ở **trang_thai = 4
        **VÀ** `can_ht_duyet = 1`** trên TOÀN TRƯỜNG, không lọc theo cây đơn vị.

        ⚠️ **LUỒNG DUYỆT TÁCH ĐÔI — danh sách này nay NGẮN HƠN HẲN trước.** Chỉ còn hồ sơ
        của **lãnh đạo đơn vị** (TK/TKL/PTK/PTKL/TP/PTP). KPI của nhân viên / giảng viên
        thường chỉ cần Trưởng khoa (TK/TKL) hoặc Trưởng phòng (TP) duyệt là xong — chúng
        HOÀN TẤT (trạng thái 5) ngay tại bước
        POST /api/to-trinh-khoa/{id}/dong-goi và **không bao giờ** xuất hiện ở đây.

        FE đổi tiêu đề màn hình cho khớp: *"Hồ sơ lãnh đạo chờ duyệt"* thay vì
        *"Hồ sơ chờ Hiệu trưởng"*.

        Bộ lọc `can_ht_duyet = 1` là **tường minh** để danh sách vẫn đúng với dữ liệu tồn
        từ quy trình cũ (hồ sơ thường còn đọng ở trạng thái 4 vì đơn vị chưa đóng gói lại).

        Phiếu ở **trang_thai = 3 (CHO_TK_DUYET) KHÔNG còn xuất hiện ở đây**: quy trình 4
        giai đoạn đổi nghĩa trạng thái 3 từ CHO_HT_DUYET thành CHO_TK_DUYET, tức hồ sơ mới
        xong bước thẩm định từng dòng và đang chờ **Trưởng khoa** chốt
        (POST /api/phieu/{id}/khoa/duyet-ho-so) — chưa tới lượt cấp Trường.

        ⚠️ Đây là view **CHỈ ĐỂ THEO DÕI**, không phải hàng đợi hành động: Hiệu trưởng
        KHÔNG duyệt / trả lại / chốt từng phiếu lẻ nữa (POST /api/phieu/{id}/truong/duyet,
        /truong/tra-lai và /chot đã bị bỏ). Thao tác của HT chuyển hết sang cấp GÓI:
        POST /api/to-trinh-khoa/{id}/ht-duyet (các phiếu LÃNH ĐẠO còn ở 4 → 5) và
        POST /api/to-trinh-khoa/{id}/ht-tra-lai (trả một DANH SÁCH hồ sơ về 3).
        Dùng GET /api/to-trinh-khoa để lấy hàng đợi hành động thật của HT.

        Quyền: chỉ ma_chuc_vu **HT/ADMIN** — Trưởng khoa gọi vào đây bị **403**. TK muốn
        xem hồ sơ chờ mình duyệt thì dùng GET /api/phieu?trangThai=3: endpoint đó tự giới
        hạn cho cấp Khoa về đơn vị của người đăng nhập + đơn vị con trực tiếp.
      operationId: phieuDanhGiaGetTruongPending
      parameters:
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: "Toi da 100; gui lon hon se bi kep ve 100."
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          description: "ngay_gui (mac dinh) hoac ngay_tao."
          schema:
            type: string
            enum: [ngay_gui, ngay_tao]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
  /api/phieu/{id}/submit:
    post:
      tags:
        - PhieuDanhGia
      summary: Submit a GV self-evaluation to Khoa
      description: |
        Validates that the phieu is in NHAP (1), owned by the current GV,
        and that all chi_tiet rows have diem_tu_danh_gia plus required minh_chung.

        CHOT 0 DIEM KHI NOP: moi tieu chi cham tay (LoaiNguonDiem = 1) con
        diem_tu_danh_gia NULL se duoc ghi 0 trong cung transaction nop. Sau khi nop,
        phieu KHONG con dong nao thieu diem. 0 diem KHONG bi bat minh chung —
        validate minh chung chi soi cac dong GV ke khai diem > 0, va chay TRUOC
        buoc dien 0 nen khong bi anh huong. Tong diem khong doi.

        CHAM TU DONG KHI NOP: trong cung transaction nop phieu, SP goi
        sp_phieu_cham_tu_dong_apply de ghi diem cho moi chi_tiet co
        LoaiNguonDiem = 2 (NCKH / phan hoi sinh vien / vi pham giang day) vao
        diem_tu_dong VA diem_chinh_thuc. Con so bang dung preview
        GET /api/maudanhgia/{id}/diem-tu-dong vi ca hai dung chung
        fn_nckh_diem_tu_dong. Engine loi thi ca thao tac nop bi rollback.
        Goi lai GET /api/phieu/{id} sau khi nop de doc DiemChinhThuc / NgayTuDong.
      operationId: phieuDanhGiaSubmit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuSubmitRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Bad Request (invalid id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Forbidden (not the GV who owns the phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >
            Conflict - phieu not in NHAP state, qua han TU DANH GIA (QUA_HAN - da qua
            ngay_dong_tu_danh_gia / han gia han rieng; nop lan dau luon dung han giai
            doan 1, khac POST /nop-lai), or concurrency conflict (phieu was modified by
            another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
        "422":
          description: Missing diem_tu_danh_gia or required minh_chung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
  /api/phieu/{id}/huy-nop:
    post:
      tags:
        - PhieuDanhGia
      summary: Chu phieu tu rut phieu vua nop (2 -> 1)
      description: |
        GV/vien chuc rut lai phieu da gui de sua tiep. Chi hop le khi: nguoi goi la CHU
        PHIEU, phieu dang o trang_thai = 2 (cho Khoa danh gia), Khoa CHUA cham bat ky
        tieu chi nao, va con trong han tu danh gia (ngay_dong_tu_danh_gia cua nam hoac
        han gia han rieng - xem GET /api/gia-han/me/{idNam}).

        NGOAI LE CO CHU DICH: du phieu dang o trang_thai = 2, endpoint nay van gate bang
        ngay_dong_tu_danh_gia (KHONG dung ngay_dong_danh_gia_cap_tren nhu POST /nop-lai).
        Huy nop la hanh vi cua giai doan 1 - khong duoc bien no thanh duong vong de sua
        bai sau khi han tu danh gia da het. Vi vay sau han tu danh gia, chu phieu co the
        nop lai dong bi tra ve nhung KHONG the huy nop ca phieu.

        Giu nguyen lan_danh_gia (khac khoa-tra-lai). Ghi lich_su_trang_thai_phieu voi
        hanh_dong = 6 (Huy nop), trang_thai_truoc = 2, trang_thai_sau = 1.
      operationId: phieuDanhGiaHuyNop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuHuyNopRequest"
      responses:
        "200":
          description: OK - phieu ve trang thai Nhap, header moi (kem RowVersion moi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Bad Request (invalid id / RowVersion)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Forbidden (khong phai chu phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >
            Conflict - phieu khong o trang_thai = 2 (INVALID_STATE), Khoa da bat dau cham
            (DA_CHAM), qua han TU DANH GIA (QUA_HAN - luon la ngay_dong_tu_danh_gia, xem
            mo ta), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
  /api/gia-han:
    get:
      tags:
        - GiaHan
      summary: Danh sach gia han tu danh gia cua 1 nam (HT/ADMIN)
      operationId: giaHanList
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "403":
          description: Forbidden (khong phai HT/ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "404":
          description: Nam danh gia khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
    post:
      tags:
        - GiaHan
      summary: Cap / cap lai (ghi de) gia han tu danh gia cho 1 nguoi (HT/ADMIN)
      description: |
        Moi (idNam, idNhanVien) chi giu 1 dong gia han hieu luc - goi lai = ghi de han cu.
        HanMoi phai tu hom nay tro di va sau ngay_dong_tu_danh_gia cua nam.
        Han hieu luc cua nguoi do = MAX(han cua giai doan phieu dang o, HanMoi) - tuc
        gia han nay nang han o CA HAI giai doan, khong rieng giai doan tu danh gia.

        KHI NAO THUC SU CAN: tu khi han cua tung giai doan duoc tach bach (dong bi tham
        dinh tra ve gate bang ngay_dong_danh_gia_cap_tren), gia han KHONG con can cho
        truong hop thong thuong "bi tra ve sau han tu danh gia" nua. Chi dung khi ca han
        tham dinh cung da het, hoac khi mot ca nhan can them thoi gian ke khai lan dau.
      operationId: giaHanUpsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiaHanUpsertRequest"
      responses:
        "200":
          description: OK - dong gia han sau khi cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "400":
          description: Bad Request (thieu HanMoi / han khong hop le)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "403":
          description: Forbidden (khong phai HT/ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "404":
          description: Nam / nhan vien khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
  /api/gia-han/{id}:
    delete:
      tags:
        - GiaHan
      summary: Thu hoi gia han (HT/ADMIN, soft delete)
      operationId: giaHanDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "403":
          description: Forbidden (khong phai HT/ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "404":
          description: Khong tim thay gia han hieu luc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
  /api/gia-han/me/{idNam}:
    get:
      tags:
        - GiaHan
      summary: Han tu danh gia hieu luc cua chinh nguoi dang dang nhap
      description: |
        FE dung de hien thi han nop va an/hien nut sua - nop - huy nop.
        HanHieuLuc = MAX(HanMacDinh = ngay_dong_tu_danh_gia, HanMoi = gia han rieng);
        null = khong gioi han. QuaHan = true nghia la phieu tu danh gia da bi khoa.
      operationId: giaHanMe
      parameters:
        - name: idNam
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
        "404":
          description: Nam danh gia khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiaHanResponse"
  /api/phieu/{id}/nop-lai:
    post:
      tags:
        - PhieuDanhGia
      summary: Nop lai cac dong da bi tham dinh tra ve (dong 1 -> 2)
      description: |
        GIAI DOAN 1, vong lap tra ve. Chu phieu (owner) nop lai NHUNG DONG dang o
        trang_thai_dong = 1 KE_KHAI. Phieu GIU NGUYEN trang thai 2 va GIU NGUYEN
        lan_danh_gia - day khong phai mot vong danh gia moi (lich su ghi
        hanh_dong = 7, khac han "tra lai phieu" cua luong cu).

        Cac dong dang cho tham dinh (2) hoac da chot (3) KHONG bi dung toi.

        Dong khong ke khai duoc tu dien 0 diem (cung quy uoc voi POST /submit), va
        0 diem thi khong bi doi minh chung.

        THAY THE POST /api/phieu/{id}/khoa/tra-lai cua luong cu - tra ve nay nay lam
        o cap DONG (POST /api/chitiet/{idChiTiet}/tham-dinh/tra-ve).

        HAN AP DUNG (khac POST /submit - doc ky): buoc nay gate bang
        ngay_dong_danh_gia_cap_tren, KHONG phai ngay_dong_tu_danh_gia. Ly do: giai doan
        tham dinh theo thiet ke chay sau khi han tu danh gia da dong, nen neu gate bang
        han tu danh gia thi gan nhu moi lan tra ve deu bi 409 QUA_HAN. Nguyen tac: con
        quyen tra ve thi con quyen tra loi - hai ben dong cung luc.
        Han hieu luc = MAX(ngay_dong_danh_gia_cap_tren, han gia han rieng); doc gia tri
        thuc te o GET /api/phieu/{id}/kiem-tra-hop-le (truong HanNop).
        Chi khi han THAM DINH cung da het thi moi can cap gia han qua POST /api/gia-han.
      operationId: phieuDanhGiaNopLai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuNopLaiRequest"
      responses:
        "200":
          description: OK - cac dong da chuyen sang cho tham dinh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Chi chu phieu moi duoc nop lai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >-
            Conflict - phieu khong o trang thai 2 (INVALID_STATE), khong con dong nao
            cho nop (KHONG_CO_DONG_CHO_NOP), da qua han THAM DINH (QUA_HAN - qua
            ngay_dong_danh_gia_cap_tren / han gia han rieng), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "422":
          description: Cac tieu chi bi tra ve chua duoc bo sung minh chung day du
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
  /api/phieu/{id}/xem-truoc-chot:
    get:
      tags:
        - PhieuDanhGia
      summary: Xem truoc man hinh chot ho so (dry-run, khong ghi DB)
      description: |
        GIAI DOAN 3. Cap toan bo so lieu cho man hinh "Chot ho so" cua Truong khoa
        TRUOC khi bam POST /api/phieu/{id}/khoa/duyet-ho-so.

        VI SAO CAN: ba cot tong_diem_co_ban / tong_diem_vuot_troi / tong_diem_tich_luy
        va xep_loai_de_xuat CHI duoc UPDATE trong sp_phieu_khoa_duyet_ho_so, tuc la
        tai chinh buoc chot. Truoc do GET /api/phieu/{id} tra NULL cho ca 4 cot, nen
        FE khong co nguon nao de hien khoi diem va muc de xuat. Endpoint nay tinh
        bang DUNG cong thuc ma buoc chot se dung, KHONG ghi gi vao DB.

        FE goi lai moi khi nguoi dung doi 1 trong 3 dieu kien ket luan (3 query
        param ben duoi) de con so tren man hinh luon trung con so luc chot.

        AI GOI: giong POST .../khoa/duyet-ho-so - ma_chuc_vu TK/TKL/TP trong pham vi
        cay don vi cua minh, hoac ADMIN. Nguoi khac nhan 403.

        CacMucChonDuoc la danh sach muc Truong khoa duoc phep chon, tinh san o server:
        luon la 1..XepLoaiDeXuat. Truong khoa KHONG nang xep loai o buoc nay, va muc 4
        khong bao gio co mat (han ngach 20% quyet dinh o buoc dong goi to trinh).
        FE render dung danh sach nay; muc khong co trong day thi hien "Da khoa" kem
        cau GiaiThichMucDeXuat.

        SanSangChot = true chi khi phieu o trang_thai 3 VA 100% dong da chot diem;
        nguoc lai FE tat nut Chot va hien DongChuaChot.
      operationId: phieuDanhGiaXemTruocChot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: duNckh
          in: query
          required: false
          description: |
            Dieu kien "du dinh muc gio NCKH" ma nguoi dung dang tick. Bo trong =
            lay ket luan tu dong cua he thong (DuDinhMucGioNckhTuDong).
          schema:
            type: boolean
        - name: khongViPham
          in: query
          required: false
          description: |
            Dieu kien "khong vi pham phap luat". Bo trong = gia tri da luu tren
            phieu, chua co thi mac dinh true.
          schema:
            type: boolean
        - name: qd838
          in: query
          required: false
          description: |
            Muc NCKHCN theo QD 838 - 0 chua/khong dat, 1 HT tot, 2 HT xuat sac.
            Bi BO QUA (ep null) khi khong phai giang vien hoac nam hoc < 2025-2026;
            xem co BatBuocQd838 trong response de biet co hien khoi nay hay khong.
          schema:
            type: integer
            format: int32
            enum: [0, 1, 2]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuXemTruocChotResponse"
        "403":
          description: Khong phai truong don vi chu quan cua ho so
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuXemTruocChotResponse"
        "404":
          description: Khong tim thay phieu danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuXemTruocChotResponse"
  /api/phieu/{id}/khoa/duyet-ho-so:
    post:
      tags:
        - PhieuDanhGia
      summary: Truong khoa chot ho so ca nhan (phieu 3 -> 4)
      description: |
        GIAI DOAN 3. THAY THE ca POST /api/phieu/{id}/truong/duyet lan
        POST /api/phieu/{id}/chot cua luong cu.

        AI GOI: truong don vi CHU QUAN cua ho so - ma_chuc_vu TK/TKL (Khoa) hoac TP
        (Phong), trong pham vi cay don vi cua minh; ADMIN di duong tat. Hieu truong
        KHONG chot ho so le nua, HT chi duyet CA GOI
        (POST /api/to-trinh-khoa/{id}/ht-duyet).

        XEP LOAI - ba cot khac nhau, dung nham la sai nghiep vu:
        - XepLoaiDeXuat: he thong tinh (XepLoaiCalculator), la TRAN duoc chon.
        - XepLoaiKhoa: Truong khoa CHON TAY, chi 1/2/3. Gui 4 -> 400
          (muc 4 do han ngach 20% cua Khoa quyet dinh o buoc dong goi to trinh).
        - xep_loai: ket qua CUOI CUNG, VAN NULL sau buoc nay - chi
          POST /api/to-trinh-khoa/{id}/dong-goi duoc ghi.

        ⚠️ KHONG NANG XEP LOAI DUOC O BUOC NAY. XepLoaiKhoa > XepLoaiDeXuat -> 400
        CAM_NANG_XEP_LOAI, ghi LyDoXepLoai cung khong qua. Truong khoa chi duoc GIU
        NGUYEN hoac HA muc; nang muc anh huong toi han ngach 20% cua ca Khoa nen phai
        di qua buoc dong goi to trinh. Dung GET /api/phieu/{id}/xem-truoc-chot de lay
        CacMucChonDuoc (= 1..XepLoaiDeXuat) truoc khi render man hinh.

        LyDoXepLoai BAT BUOC khi XepLoaiKhoa khac muc he thong de xuat - sau chan tran
        o tren thi "khac" chi con nghia la HA muc.

        DIEU KIEN DIEM TICH LUY LA TIEN QUYET, chan cung trong SP bang tong ma SP TU
        TINH LAI (khong tin so BLL gui len): muc >= 2 can tong tich luy >= 80.
        Nguong muc 3 LECH THEO LOAI DOI TUONG, co chu y:
          - Giang vien (loai_doi_tuong = 1): can tong tich luy > 100
          - Vien chuc / NLD (loai_doi_tuong = 2): can tong tich luy >= 101
        Diem le la co that (diem tieu chi la DECIMAL(5,2), co thang diem Lien tuc /
        Cong thuc, khong co buoc lam tron) nen o dai 100.01-100.99 giang vien len duoc
        muc 3 con vien chuc thi khong. Khong dat -> 400 DIEM_KHONG_DU.

        Vien chuc / NLD (loai_doi_tuong = 2) NAY LEN DUOC muc 3 va muc 4. Tran muc 2 cu
        (VUOT_MUC_VIEN_CHUC) da bi go bo. Ho tranh han ngach o bang xep hang rieng cua
        minh - xem POST /api/to-trinh-khoa/{id}/dong-goi.

        Server tu tinh lai 3 tong diem bang dung cong thuc cua
        sp_phieu_danh_gia_tinh_tong_diem (chong tamper), snapshot dinh muc ap dung
        + gio thuc te, roi MO GOI KPI cua (nam, don vi) neu chua co va gan
        id_to_trinh cho ho so. Goi dang o trang thai 2 DA_DONG_GOI, 5 HT_TRA_VE, hoac 4
        TU DONG HOAN TAT (id_nguoi_duyet IS NULL) se bi ha ve 1 DANG_TONG_HOP: co ho so
        moi vao thi han ngach cu khong con dung. Goi da trinh HT (3) hoac da duoc HT duyet
        THAT (4 + id_nguoi_duyet IS NOT NULL) thi chan bang TO_TRINH_DA_TRINH — khong duoc
        am tham lat quyet dinh cua Hieu truong.

        LUONG DUYET TACH DOI — CONTRACT KHONG DOI (request / response / error code y
        nguyen). Diem moi: buoc nay ghi them snapshot phieu_danh_gia.can_ht_duyet, quyet
        dinh ho so se ket thuc o cap Truong khoa hay con phai qua Hieu truong. Xem
        truong CanHtDuyet trong PhieuDanhGiaChiTietDto.

        ⚠️ FE PHAI SUA THONG DIEP THANH CONG. Sau buoc nay phieu MOI o trang thai 4, CHUA
        hoan tat. Dung noi "da gui len Hieu truong" (sai voi da so ho so) va cung dung noi
        "da hoan tat". Thong diep dung:
        "Da chot ho so. Ket qua se hoan tat khi Truong khoa dong goi to trinh."
      operationId: phieuDanhGiaKhoaDuyetHoSo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuKhoaDuyetHoSoRequest"
      responses:
        "200":
          description: OK - chi tiet ho so sau khi chot (xep_loai_khoa, xep_loai_de_xuat, id_to_trinh)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: >-
            Bad request - XepLoaiKhoa = 4 hoac ngoai 1..3; XepLoaiKhoa > XepLoaiDeXuat
            (CAM_NANG_XEP_LOAI); tong diem tich luy khong du cho muc da chon
            (DIEM_KHONG_DU); thieu LyDoXepLoai khi ha muc khac de xuat (THIEU_LY_DO);
            thieu MucNckhcnQd838 voi giang vien nam >= 2025-2026; hoac GV chua co chuc
            danh / chua cau hinh dinh muc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Khong phai truong don vi chu quan cua ho so
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >-
            Conflict - ho so khong o trang thai 3 (INVALID_STATE), con tieu chi chua
            chot diem (CHUA_CHOT_HET), chon muc 4 (CAM_CHON_XUAT_SAC),
            goi KPI da trinh HT (TO_TRINH_DA_TRINH), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "422":
          description: Con tieu chi chua chot diem (trang_thai_dong != 3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
  /api/phieu/{id}/uu-tien-xuat-sac:
    put:
      tags:
        - PhieuDanhGia
      summary: Chi dinh ho so duoc suat xuat sac cuoi cung (go the be tac DONG_HANG)
      description: |
        GIAI DOAN 4. Khi nhieu nguoi BANG DIEM tranh so suat xuat sac cuoi cung,
        POST /api/to-trinh-khoa/{id}/dong-goi CO Y dung lai voi error_code = DONG_HANG
        thay vi tu tie-break bang id - do la quyet dinh nhan su, he thong khong duoc
        am tham chon thay nguoi.

        Truong don vi dung endpoint nay danh dau tung ho so. So nguoi duoc danh dau PHAI
        BANG DUNG SoSuatConLai CUA NHOM DO - khong nhieu khong it, neu khong dong goi
        van bao DONG_HANG. Dong hang co the no o nhieu nhom cung luc: doc mang
        DongHangNhom de biet moi nhom con thieu bao nhieu suat.

        Chi nguoi DU DIEU KIEN len muc 4 moi duoc tinh (co du_dieu_kien_muc4 tren RS2
        cua loi DONG_HANG): danh dau mot nguoi khong the len muc 4 la vo nghia.

        Ap dung cho ho so o trang thai 4, MOI loai doi tuong (vien chuc / NLD nay cung
        tranh han ngach - tran muc 2 cu da bi go bo).

        QUYEN: chi TK / TKL / TP tai dung don vi cua ho so (hoac ADMIN). PTK / PTKL /
        PTP KHONG duoc chi dinh: ho so cua ho can Hieu truong duyet nhung ban than ho
        khong co quyen chot ho so nguoi khac.
      operationId: phieuDanhGiaUuTienXuatSac
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuUuTienXuatSacRequest"
      responses:
        "200":
          description: OK - HoSo[0] la ho so vua duoc cap nhat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Khong phai truong don vi chu quan cua ho so
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "409":
          description: >-
            Conflict - ho so khong o trang thai 4 (INVALID_STATE), goi da trinh HT
            (TO_TRINH_DA_TRINH), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/phieu/{id}/mo-lai:
    post:
      tags:
        - PhieuDanhGia
      summary: Reopen a finalized phieu (state 5 HOAN_TAT -> 1/2/3)
      description: |
        HT-only (ma_chuc_vu = HT; Admin KHONG duyet). Most destructive operation in the system. In a single transaction:
        1) Snapshots every non-NULL chi_tiet score column (tu DG, Khoa, Truong, chinh thuc)
           into lich_su_cham_diem under the CURRENT lan_danh_gia (hanh_dong = 3) BEFORE clearing.
        2) Clears chi_tiet scores selectively based on trangThaiMoi:
              1 -> clear ALL (tu DG, Khoa, Truong, chinh thuc)
              2 -> clear Khoa + Truong + chinh thuc (keep tu DG)
              3 -> clear Truong + chinh thuc (keep tu DG + Khoa)
           Rows with LoaiNguonDiem = 2 are NEVER cleared: their diem_chinh_thuc is
           machine-computed from source data, not a manual score, and chot skips them
           (so a cleared value could never be recomputed when reopening to state 3).
        3) Updates phieu: trang_thai = trangThaiMoi, lan_danh_gia +=1, lan_mo_lai +=1,
           sets tracking columns, clears totals/xep_loai/chot info.
        4) Writes lich_su_trang_thai_phieu (hanh_dong = 5 Mo lai, cap_thuc_hien = 3).
      operationId: phieuDanhGiaMoLai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuMoLaiRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Invalid request (missing TrangThaiMoi / LyDo, out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Caller is not Truong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: Conflict - phieu not in trang_thai = 5 (HOAN_TAT), or concurrency conflict (phieu was modified by another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
  /api/phieu/{id}:
    get:
      tags:
        - PhieuDanhGia
      summary: Get phieu danh gia detail
      operationId: phieuDanhGiaGetDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kemLichSu
          in: query
          required: false
          description: >
            true = do them lich su cham diem vao tung ChiTiet[].LichSu (gom MOI
            lan danh gia, moi cap). Mac dinh false de khong lam phinh payload.
            Du lieu y het GET /api/phieu/{id}/lich-su-cham-diem, chi khac la da
            duoc nhom san theo tieu chi.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
  /api/phieu/{id}/tong-hop-tu-dong:
    post:
      tags:
        - PhieuDanhGia
      summary: Cham diem tu dong cac tieu chi loai_nguon_diem = 2 tren 1 phieu
      description: >
        Chay engine sp_phieu_tong_hop_tu_dong: voi moi tieu chi co LoaiNguonDiem = 2,
        tinh diem tu du lieu da dong bo (NCKH, gio giang, phan hoi sinh vien...) theo
        CongThucSnapshot roi GHI THANG vao diem_chinh_thuc — don vi khong cham tay
        cac tieu chi nay.
        LUU Y: POST /api/phieu/{id}/nop da TU DONG chay engine nay trong cung
        transaction nop phieu, nen endpoint nay chi con dung de cham som (khi phieu
        con Nhap) hoac cham lai sau khi du lieu nguon thay doi.
        Chay duoc khi phieu o trang thai Nhap (1) hoac Da nop (2); tu trang thai 3
        tro len tra PHIEU_INVALID_STATE. Quyen: ADMIN, hoac TK/TKL/TP
        trong pham vi don vi (enforce trong SP).
        ScienceUserId = null nghia la giang vien chua duoc map sang he thong NCKH,
        khi do cac tieu chi NCKH tu dong se ra 0 diem.
        KIEM NHIEM DA DON VI: moi nguon diem tu dong khoa theo (nguoi, nam) chu khong
        theo don vi, nen neu mot nguoi co nhieu phieu trong cung mot nam thi chi DUNG
        MOT phieu duoc cham tu dong — uu tien phieu mang mau Giang vien (LoaiDoiTuong
        = 1), roi den don vi chinh, roi IdPhieu nho nhat. Goi endpoint nay tren phieu
        con lai tra 409 ErrorCode = PHIEU_KHONG_NHAN_DIEM_TU_DONG kem so hieu phieu
        dang giu diem tu dong. Nguoi chi co 1 phieu khong bi anh huong.
      operationId: phieuTongHopTuDong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuTongHopTuDongResponse"
        "400":
          description: Id phieu khong hop le / loi khac tu engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuTongHopTuDongResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN (khong du quyen cham tu dong phieu nay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuTongHopTuDongResponse"
        "404":
          description: PHIEU_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuTongHopTuDongResponse"
        "409":
          description: >-
            PHIEU_INVALID_STATE (phieu khong o trang thai Nhap) hoac
            PHIEU_KHONG_NHAN_DIEM_TU_DONG (nguoi nay co phieu khac trong nam dang
            giu diem tu dong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuTongHopTuDongResponse"
  /api/phieu/{id}/kiem-tra-hop-le:
    get:
      tags:
        - PhieuDanhGia
      summary: Kiem tra phieu du dieu kien nop chua (dry-run cua submit)
      description: >
        Chay dung bo quy tac validate cua POST api/phieu/{id}/submit nhung KHONG doi trang
        thai, khong can RowVersion. Dung cho checklist "con thieu gi truoc khi nop" o
        dashboard / form cham KPI - truoc day FE phai goi POST submit va doc response loi
        VALIDATION_FAILED moi biet.
        QUY TAC (giong het sp_phieu_submit): bo qua tieu chi cham tu dong
        (LoaiNguonDiem = 2); chi bao thieu minh chung khi tieu chi co BatBuocMinhChung = 1
        VA giang vien thuc su ke khai DiemTuDanhGia > 0 (NULL hoac 0 = khong ke khai thi
        khong bat gi ca).
        Quyen doc giong GET api/phieu/{id} (chu phieu, HT/ADMIN, hoac TK/TKL/TP trong pham
        vi don vi / duoc giao cham tieu chi). Rieng CoTheNop chi = true voi CHU PHIEU.
      operationId: phieuKiemTraHopLe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - xem Item.CoTheNop va Item.ThieuMinhChung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuKiemTraHopLeResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuKiemTraHopLeResponse"
        "404":
          description: ErrorCode = NOT_FOUND (phieu khong ton tai / da xoa mem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuKiemTraHopLeResponse"
  /api/phieu/{id}/lich-su-trang-thai:
    get:
      tags:
        - BaoCao
      summary: Audit trail of phieu state transitions
      description: |
        Returns all rows from lich_su_trang_thai_phieu for the phieu, ordered by ngay_thuc_hien ASC.
        Each row is one state transition (submit / approve / return / chot / mo-lai), with the
        person's name joined from nhan_vien. ly_do and nhan_xet are returned verbatim.
        Don_vi scoping mirrors GET /api/phieu (Khoa sees their tree; Truong sees all; GV sees own).
      operationId: phieuGetLichSuTrangThai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuTrangThaiResponse"
  /api/phieu/{id}/lich-su-cham-diem:
    get:
      tags:
        - BaoCao
      summary: Audit trail of score changes for a phieu, grouped by (lan_danh_gia, id_chi_tiet, cap)
      description: |
        Used by the UI to show "Round 1 Khoa scored X, after return Round 2 Khoa scored Y".
        Each group contains its ordered list of entries (timestamps), so the consumer can render
        a full timeline per criterion per evaluator level per round.
      operationId: phieuGetLichSuChamDiem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuChamDiemResponse"
  /api/chitiet/{idChiTiet}/lich-su-cham-diem:
    get:
      tags:
        - BaoCao
      summary: Audit trail of score changes scoped to a single chi_tiet
      description: |
        Same shape as the phieu-scoped variant but filtered to one chi_tiet, ordered by
        ngay_thuc_hien. Useful when the UI is already focused on a single criterion.
      operationId: chiTietGetLichSuChamDiem
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuChamDiemResponse"
  /api/bao-cao/tong-quan:
    get:
      tags:
        - BaoCao
      summary: Overview report - phieu counts, chua lap phieu, ty le hoc vu
      description: |
        Counts phieu NAM (quy = 0) by trang_thai (1..5) and, for trang_thai=5 only, also by xep_loai.
        DemTheoTrangThai chỉ có phần tử cho trạng thái có phiếu — FE mặc định 0 cho trạng thái vắng.
        Phạm vi theo ma_chuc_vu: Trường (HT/ADMIN) xem tất cả; Khoa (TK/TKL/TP) và
        Thư ký Khoa (TKK, chỉ đọc) giới hạn cây đơn vị mình; chủ phiếu (id 11) xem phiếu
        của chính mình.

        SoChuaLapPhieu: nhân viên đang hoạt động CHƯA có phiếu năm tại ĐƠN VỊ CHÍNH, cùng phạm vi
        và cùng bộ lọc idDonVi như các số đếm phiếu. Phiếu ở đơn vị kiêm nhiệm là tùy chọn nên không tính.

        HocVu: tỷ lệ tốt nghiệp đúng hạn + tỷ lệ cảnh báo học vụ GỘP các Khoa người gọi được xem
        (công thức của fn_ty_le_hoc_vu_khoa; nhiều Khoa thì cộng tử/mẫu rồi chia). Khoa được xem:
        ADMIN / HT / TP@P_DTBDCL mọi Khoa; TK / TKL / TKK Khoa của mình. Không được xem Khoa nào
        (vd TP của Phòng) hoặc idDonVi không phải Khoa → HocVu vắng mặt trong JSON.
      operationId: baoCaoTongQuan
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoTongQuanResponse"
  /api/bao-cao/diem-trung-binh:
    get:
      tags:
        - BaoCao
      summary: Avg / min / max of tong_diem_tich_luy grouped by one-level-deep child don_vi
      description: |
        Only includes phieu with trang_thai=5 (HOAN_TAT). Buckets are the direct children of the
        requested idDonVi. If idDonVi is omitted, Trường (ma_chuc_vu HT/ADMIN) defaults to root
        (children = Khoa); Khoa (ma_chuc_vu TK/TKL/TP) defaults to their own don_vi (children =
        Bo mon). Grandchild phieu (Bo mon under a Khoa) roll up under their parent Khoa bucket.

        Kiem nhiem: nguoi giu chuc vu truong o NHIEU don vi ma khong truyen idDonVi thi
        goc gom nhom duoc chon xac dinh - uu tien don vi CHINH, roi don vi ho truc tiep
        thuoc, roi id nho nhat. Muon xem goc khac thi truyen idDonVi. Goc gom nhom KHONG
        phai diem phan quyen: du truyen idDonVi nao, ban van chi doc duoc phieu trong
        pham vi cua minh (xem muc phan quyen o dau tai lieu).
      operationId: baoCaoDiemTrungBinh
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoDiemTrungBinhResponse"
  /api/bao-cao/chua-hoan-tat:
    get:
      tags:
        - BaoCao
      summary: List phieu where trang_thai != 5, with days elapsed since ngay_tao
      description: |
        Useful for chasing late submissions. Ordered by days-elapsed DESC so oldest stale
        phieu come first. Don_vi scoping matches GET /api/phieu.
      operationId: baoCaoChuaHoanTat
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoChuaHoanTatResponse"
  /api/bao-cao/phong/tong-quan:
    get:
      tags:
        - BaoCao
      summary: Thống kê riêng của Phòng (TP / TKP)
      description: |
        Quyền: TP / TKP xem các Phòng (cấp 2, mã P_*) mình thực sự giữ chức vụ đó (kiêm nhiệm
        nhiều Phòng thấy đủ); HT / ADMIN xem mọi Phòng; người khác 403 FORBIDDEN.
        idDonVi (tùy chọn) phải là một Phòng trong phạm vi đó, ngược lại 403 FORBIDDEN_DON_VI.
        Năm không tồn tại → 404 NOT_FOUND.

        Số của Tổ trực thuộc được gộp lên Phòng cha. TongHop = cộng các dòng DonVi.
        PhieuQuy (tiến độ phiếu quý của viên chức) rỗng khi năm chưa bật đánh giá theo quý.
        Khoa dùng GET /api/bao-cao/tong-quan.
      operationId: baoCaoPhongTongQuan
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoPhongResponse"
        "403":
          description: FORBIDDEN / FORBIDDEN_DON_VI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoPhongResponse"
        "404":
          description: NOT_FOUND - năm đánh giá không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoPhongResponse"
  /api/bao-cao/toan-truong:
    get:
      tags:
        - BaoCao
      summary: Thống kê toàn trường của Hiệu trưởng (HT / ADMIN)
      description: |
        Quyền: chỉ HT / ADMIN; người khác 403 FORBIDDEN. Năm không tồn tại → 404 NOT_FOUND.

        DonVi: 1 dòng / đơn vị gốc (Trường → các Khoa → các Phòng); số của Bộ môn / Tổ gộp lên
        đơn vị cha; đơn vị ngừng hoạt động chỉ hiện khi còn số liệu. TongHop = cộng các dòng DonVi.
        ChoHieuTruong: việc đang chờ HT (tờ trình, hồ sơ lãnh đạo, phiếu đánh giá đơn vị).
        HocVu: tỷ lệ gộp mọi Khoa (cùng phép gộp với HocVu của /api/bao-cao/tong-quan).
        PhieuQuy rỗng khi năm chưa bật đánh giá theo quý.
      operationId: baoCaoToanTruong
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoToanTruongResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoToanTruongResponse"
        "404":
          description: NOT_FOUND - năm đánh giá không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoToanTruongResponse"
  /api/viphamgiangday:
    get:
      tags:
        - ViPhamGiangDay
      summary: Danh sach vi pham (giang vien VA vien chuc, scope theo vai tro)
      description: >
        HT/ADMIN xem tat ca; TK/TKL/TP xem don vi minh (+ don vi con) va cac vi pham
        do don vi minh ghi nhan; nguoi dung khac chi xem vi pham cua chinh minh.
        Endpoint dung chung cho CA HAI doi tuong — loc theo doi tuong bang cach
        doi chieu truong LoaiDoiTuong tra ve (1 = giang vien, 2 = vien chuc/NLD).
      operationId: viPhamGiangDayGetAll
      parameters:
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Don vi chinh cua nguoi bi ghi nhan (giang vien hoac vien chuc/NLD)
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
    post:
      tags:
        - ViPhamGiangDay
      summary: Ghi nhan vi pham (TP/TK/TKL dung don vi, hoac ADMIN)
      description: >
        Doi tuong bi ghi nhan phai thuoc dung TAP cua loai vi pham:
        LoaiDoiTuong = 1 -> giang vien thuoc Khoa (ma_don_vi LIKE 'K_%');
        LoaiDoiTuong = 2 -> vien chuc / NLD (ke ca nhan vien van phong Khoa).
        Nguoi kiem nhiem thuoc ca hai tap, moi tap theo dung don vi cua ho.


        Muc DiemTru bi rang buoc boi CheDoDiemTru cua danh muc:
        0 = tu do (nhap bao nhieu cung duoc);
        1 = co dinh (server LUON ghi DiemTruMacDinh, bo qua gia tri gui len);
        2 = toi thieu (phai >= DiemTruMacDinh; neu lon hon thi BAT BUOC co LyDoDieuChinh).


        Nguoi ghi nhan va don vi ghi nhan lay tu JWT, KHONG nhan tu body.
      operationId: viPhamGiangDayCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViPhamGiangDayCreateRequest"
      responses:
        "201":
          description: Da tao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "400":
          description: >
            Du lieu khong hop le. ErrorCode = VALIDATION,
            DIEM_TRU_DUOI_TOI_THIEU (DiemTru thap hon muc toi thieu cua danh muc),
            THIEU_LY_DO_DIEU_CHINH (tru cao hon muc toi thieu ma khong ghi ly do)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: >
            ErrorCode = FORBIDDEN_CHUC_VU (khong phai TP/TK/TKL/ADMIN),
            FORBIDDEN_DON_VI (don vi khong duoc ghi loai vi pham nay),
            NOT_GIANG_VIEN_KHOA (loai vi pham cua giang vien nhung doi tuong
            khong phai giang vien thuoc Khoa),
            NOT_VIEN_CHUC (loai vi pham cua vien chuc nhung doi tuong khong
            thuoc tap vien chuc / NLD dang hoat dong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = LOAI_VI_PHAM_NOT_FOUND / NAM_NOT_FOUND / NHAN_VIEN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "409":
          description: Xung dot du lieu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
  /api/viphamgiangday/{id}:
    get:
      tags:
