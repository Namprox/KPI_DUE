  /api/vi-pham/tong-hop-giang-vien:
    get:
      tags:
        - ViPhamGiangDay
      summary: Tong hop diem tru cua tung giang vien (tran 15 diem/ca nhan)
      description: >
        Chi liet ke giang vien THUOC KHOA. DiemTruCaNhan = MIN(tong diem tru trong nam, 15).
        IdDonVi tra ve la KHOA chu quan de khop voi api/vi-pham/diem-tru-khoa.
      operationId: viPhamTongHopGiangVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Loc theo Khoa
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopGiangVienResponse"
        "400":
          description: Thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopGiangVienResponse"
        "401":
          description: Thieu hoac sai token
  /api/vi-pham/diem-tru-khoa:
    get:
      tags:
        - ViPhamGiangDay
      summary: Diem tru KPI tap the cua tung Khoa
      description: >
        DiemTruTapThe = MIN( 7.5 * T / (0.2 * 15 * N) , 7.5 ), N = 0 -> 0.
        T = tong diem tru cua cac ca nhan (moi ca nhan da ap tran 15),
        N = tong so giang vien dang hoat dong cua Khoa.
        HT/ADMIN/TK/TKL/TP xem moi Khoa; nguoi dung khac chi xem Khoa cua minh.
      operationId: viPhamDiemTruKhoa
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Loc 1 Khoa cu the
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamDiemTruKhoaResponse"
        "400":
          description: Thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamDiemTruKhoaResponse"
        "401":
          description: Thieu hoac sai token
