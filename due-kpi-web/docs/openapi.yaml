  /api/phieu/{id}/submit:
    post:
      tags:
        - PhieuDanhGia
      summary: Submit a GV self-evaluation to Khoa
      description: |
        Validates that the phieu is in NHAP (1), owned by the current GV,
        and that all chi_tiet rows have diem_tu_danh_gia plus required minh_chung.
      operationId: phieuDanhGiaSubmit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuSubmitRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Bad Request (invalid id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Forbidden (not the GV who owns the phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >
            Conflict - phieu not in NHAP state, qua han tu danh gia (QUA_HAN - da qua
            ngay_dong_tu_danh_gia / han gia han rieng), or concurrency conflict
            (phieu was modified by another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
        "422":
          description: Missing diem_tu_danh_gia or required minh_chung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
  /api/phieu/{id}/huy-nop:
    post:
      tags:
        - PhieuDanhGia
      summary: Chu phieu tu rut phieu vua nop (2 -> 1)
      description: |
        GV/vien chuc rut lai phieu da gui de sua tiep. Chi hop le khi: nguoi goi la CHU
        PHIEU, phieu dang o trang_thai = 2 (cho Khoa danh gia), Khoa CHUA cham bat ky
        tieu chi nao, va con trong han tu danh gia (ngay_dong_tu_danh_gia cua nam hoac
        han gia han rieng - xem GET /api/gia-han/me/{idNam}).

        Giu nguyen lan_danh_gia (khac khoa-tra-lai). Ghi lich_su_trang_thai_phieu voi
        hanh_dong = 6 (Huy nop), trang_thai_truoc = 2, trang_thai_sau = 1.
      operationId: phieuDanhGiaHuyNop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuHuyNopRequest"
      responses:
        "200":
          description: OK - phieu ve trang thai Nhap, header moi (kem RowVersion moi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Bad Request (invalid id / RowVersion)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Forbidden (khong phai chu phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: >
            Conflict - phieu khong o trang_thai = 2 (INVALID_STATE), Khoa da bat dau cham
            (DA_CHAM), qua han tu danh gia (QUA_HAN), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
