      description: >
        Moi dong = 1 luot sinh vien tra loi 1 cau hoi cho 1 giang vien (co MSSV va
        danh_gia tho 1..5). Diem trung binh KHONG tinh o day. Nen loc theo
        maCanBo/maHocPhan/namHoc de tranh keo ca ~200,000 dong. Tat ca filter tuy chon.
