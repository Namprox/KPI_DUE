  /api/diem-tb-phan-hoi-sv/chot:
    post:
      tags:
        - DiemTbPhanHoiSinhVien
      summary: Chot (tinh + luu snapshot) diem trung binh phan hoi sinh vien cho TOAN BO giang vien trong 1 nam
      description: >
        Gop du lieu tho phan_hoi_sinh_vien theo nam (idNam, vd 2026 -> nam_hoc=26 ->
        gop ky_hoc 261/262/263), tinh AVG(danh_gia) cho tung giang vien (JOIN mem qua
        ma_can_bo = nhan_vien.ma_nhan_vien; khong khop bi bo qua, so luong tra ve o
        SoMaKhongKhop). Chi gop 1 diem tong hop ca nam (khong tach rieng tung ky). Moi
        nam chi giu 1 lan chot cuoi cung: chot lai se GHI DE (xoa ket qua cu cua nam do).
        Quyen chot: chi ma_chuc_vu = 'TP' cua don vi ma_don_vi = 'P_QLCL', hoac ADMIN.
      operationId: diemTbPhanHoiSvChot
      requestBody:
        required: true
