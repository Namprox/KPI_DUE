            So lieu tong hop tham khao: tong so nguoi muc 3 cua ca 3 nhom. KHONG phai mau
            so. NULL = goi legacy, chua tinh theo luat tach 3 nhom (FE dung lam co nhan
            biet de fallback ve cac cot phang).
        SoNguoiMuc3HienTai:
          type: integer
          nullable: true
          description: So nguoi muc 3 HIEN TAI cua don vi. Chi co o GET chi tiet.
        Nhom:
