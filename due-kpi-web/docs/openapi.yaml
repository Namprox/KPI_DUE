  /api/maudanhgia/{id}/diem-tu-dong:
    get:
      tags:
        - MauDanhGia
      summary: Xem trước điểm tự động của các tiêu chí loai_nguon_diem=2 trong mẫu
      description: >
        Tính on-the-fly qua fn_nckh_diem_tu_dong, KHÔNG ghi DB và không cần phiếu.
        Năm đánh giá lấy từ chính mẫu (mau_danh_gia.id_nam).
        Mỗi phần tử Items = 1 giảng viên × 1 tiêu chí tự động.
        DiemTuDong = null nghĩa là mã công thức chưa được hỗ trợ.

        MinhChung (các bản ghi nguồn đã tạo ra điểm) CHỈ được trả khi truyền
        idNhanVien — gọi toàn trường luôn trả mảng rỗng để tránh payload quá lớn.
        Minh chứng dùng chung bộ vị từ với sp_nckh_dong_bo (fn_nckh_minh_chung_tu_dong)
        nên luôn khớp với cờ trong nckh_tong_hop.
      operationId: mauDanhGiaGetDiemTuDong
      parameters:
        - name: id
          in: path
          required: true
          description: Id mẫu đánh giá
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          description: >
            Bỏ trống = tất cả giảng viên đang hoạt động có dữ liệu tự động của năm
            (có snapshot nckh_tong_hop hoặc đã chốt điểm TB phản hồi sinh viên);
            nếu mẫu có tiêu chí VPGD_TUAN_THU thì mở rộng ra toàn bộ giảng viên Khoa
            (v_giang_vien_khoa) vì không vi phạm = trọn điểm.
            Có giá trị = chỉ giảng viên đó, VÀ kèm MinhChung.
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
        "400":
          description: Id mẫu hoặc id nhân viên không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
        "404":
          description: Không tìm thấy mẫu đánh giá hoặc nhân viên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MauDanhGiaDiemTuDongResponse"
