            KHONG CON LA MAU SO HAN NGACH. Chi la headcount hien thi (so phieu
            loai_doi_tuong = 1), snapshot luc dong goi. Mau so THUC DUNG nam o
            Nhom[].SoMauSo va KHAC NHAU theo nhom.
        SoNguoiMuc3:
