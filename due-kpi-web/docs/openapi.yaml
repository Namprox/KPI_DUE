            $ref: "#/components/schemas/ToTrinhKhoaNhomDto"
        TyLeXuatSac:
          type: number
          nullable: true
          example: 0.2
          description: Hien khoa cung o 0.2000. Cot van duoc snapshot de tra cuu to trinh cu.
        HanNgachXuatSac:
          type: integer
          nullable: true
          description: FLOOR(SoGiangVien x TyLeXuatSac) tai thoi diem dong goi
        SoDatXuatSac:
