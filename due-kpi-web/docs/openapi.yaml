  /api/nhan-vien:
    get:
      tags:
        - NhanVien
      summary: Danh sách nhân viên (danh bạ) có phân trang + lọc
      description: >
        Trả về danh sách nhân viên dạng danh bạ, có phân trang. KHÔNG trả các
        trường nhạy cảm (mat_khau, refresh_token). Các tham số lọc
        đều tùy chọn; tham số nào bỏ trống thì không áp dụng điều kiện đó.


        KIÊM NHIỆM ĐA ĐƠN VỊ: bộ lọc đơn vị / chức vụ chạy trên **ĐƠN VỊ CHÍNH**
        (dòng nhan_vien_chuc_vu có la_chinh = 1). Người kiêm nhiệm **chỉ xuất hiện
        ở danh sách của đơn vị chính**, không xuất hiện ở đơn vị kiêm nhiệm. Nhờ
        vậy cột lọc và cột id_don_vi / ten_don_vi TRẢ VỀ luôn khớp nhau: lọc theo
        Khoa K sẽ không còn trả về người hiển thị đơn vị là Phòng.


        Cần phạm vi GỒM CẢ kiêm nhiệm (vd kiểm tra quyền) thì dùng endpoint khác —
        danh bạ này cố ý chỉ soi đơn vị chính.
      operationId: nhanVienGetList
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Tìm theo ma_nhan_vien / ho_ten / email (LIKE, không phân biệt vị trí)
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
          description: >
            Lọc theo khóa số đơn vị (id_don_vi), so với ĐƠN VỊ CHÍNH của nhân viên.
            Dùng được kết hợp với maDonVi. KHÔNG bao gồm đơn vị cha; muốn lấy thêm
            đơn vị con thì bật baoGomDonViCon.
        - name: maDonVi
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
          description: >
            Lọc theo mã đơn vị (ma_don_vi, khớp chính xác, vd "P.KT"). Dùng độc lập
            hoặc kết hợp với idDonVi (hai điều kiện AND với nhau).
        - name: baoGomDonViCon
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            true = lấy luôn nhân viên thuộc các đơn vị con (mọi cấp) của đơn vị khớp
            bộ lọc (đệ quy theo id_don_vi_cha). Chỉ có tác dụng khi có lọc idDonVi/maDonVi.
            Mặc định false = chỉ đúng đơn vị đó.
        - name: idChucVu
          in: query
          required: false
          schema:
            type: integer
          description: >
            Lọc theo CHỨC VỤ CHÍNH (chức vụ trên dòng la_chinh = 1). Chức vụ kiêm
            nhiệm KHÔNG được xét. Kết hợp với idDonVi/maDonVi thì hai điều kiện
            đương nhiên khớp trên cùng một dòng quan hệ, vì mỗi người chỉ có đúng
            một dòng chính.
        - name: trangThai
          in: query
          required: false
          schema:
            type: boolean
          description: "Lọc theo trạng thái (true: đang làm việc). Bỏ trống = lấy tất cả."
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Trang hiện tại (mặc định 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
          description: Số dòng mỗi trang (mặc định 20, tối đa 200)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVienListResponse"
        "400":
          description: Tham số lọc không hợp lệ (idDonVi / maDonVi / idChucVu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVienListResponse"
        "401":
          description: Chưa xác thực
