  /api/gio-giang-tkb/import:
    post:
      tags:
        - GioGiangTkb
      summary: Import file Excel thoi khoa bieu va tinh gio giang trong nam
      description: >-
        Doc file Excel thoi khoa bieu giang vien, lay cac dong thuoc NAM DANH GIA dang
        tinh, quy doi tiet sang gio chuan theo si so lop, gop theo giang vien.


        DONG NAO THUOC NAM NAO - chi dua vao cot KY_HOC, khong tinh ngay thang. ky_hoc
        ma hoa nam_hoc * 10 + {1,2,3} voi nam_hoc la nam KET THUC cua nam hoc do. Nam
        danh gia N nhan dung BA ky:
        (N-2000)*10+2 (ky 2 nam hoc truoc),
        (N-2000)*10+3 (ky he nam hoc truoc),
        (N-1999)*10+1 (ky 1 nam hoc moi).
        Vi du idNam = 2026 -> nhan 262, 263 va 271.


        Dong co ky khac (261, 272...) thuoc nam duong lich khac nen bi BO QUA im lang,
        KHONG bao loi - so luong tra ve o SoDongBoQua. Nho vay co the day thang file
        xuat ra nhieu ky ma khong phai loc truoc.


        SO TIET lay THANG cot SoTiet cua file, khong tinh lai tu cac cot lich hoc
        (Thu2..chuNhat) - cac cot do khong con duoc doc nua.


        He so quy doi theo si so: toi da 40 SV = 1,0 gio chuan / tiet; 41-50 = 1,1;
        51-60 = 1,2; 61-70 = 1,3; 71-80 = 1,4; tu 81 tro len = 1,5.
        GioChuanTrongNam = SoTiet * he so, lam tron 2 chu so (AwayFromZero).


        ANH XA TU DONG: sau khi ghi xong, he thong TU GAN nhung ho ten khop DUY NHAT
        mot nhan vien dang hoat dong (so luong tra ve o SoDongTuDongAnhXa). Trung ten
        (>= 2 nguoi) hoac khong khop ai thi de trong - dem vao SoDongChuaAnhXa, phai
        anh xa tay qua POST /api/gio-giang-tkb/anh-xa.


        Viec tu gan CHI THEM anh xa con thieu, KHONG BAO GIO ghi de dong da co: neu
        ban da sua tay mot anh xa, import lai se KHONG keo no ve nguoi khop ten.


        GHI DE toan bo du lieu TKB cua nam do. Anh xa ho ten -> nhan vien (bang
        gio_giang_tkb_anh_xa) KHONG bi xoa, nen cong anh xa tay van con nguyen.
        Chay all-or-nothing: bat ky loi du lieu nao cung huy ca lan import.


        Quyen: ADMIN / HT.
      operationId: gioGiangTkbImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    File Excel (.xls / .xlsx) thoi khoa bieu; toi da 100 MB
                    (appSettings allowedImportExtensions / maxImportFileSizeKb).
                    Kiem HAI LOP: duoi file phai la .xls/.xlsx VA noi dung phai khop
                    chu ky (magic bytes ZIP/OLE2) - doi duoi se bi tu choi 400.
                    Cot bat buoc: KY_HOC, Ten, SLSV_DangKyHoc, SoTiet.
                    Cot tuy chon: HoLot, MA_LOP_TIN_CHI, MA_HOC_PHAN, TEN_HOC_PHAN,
                    TenKhoa. Cot tim theo TEN TIEU DE, khong theo vi tri.
                    Cac cot lich hoc (Thu2..chuNhat) KHONG con duoc doc.
                idNam:
                  type: integer
                  description: >-
                    Nam danh gia can tinh, vd 2026. Quyet dinh 3 ky hoc duoc nhan -
                    xem mo ta endpoint.
              required:
                - file
                - idNam
      responses:
        "200":
          description: >-
            OK - tra ImportedCount (so dong chi tiet da luu), SoGiangVien, SoDongBoQua
            (dong thuoc ky cua nam khac), SoDongTuDongAnhXa / SoDongChuaAnhXa va danh
            sach CanhBao (TRUNG_LOP / SO_TIET_TRONG).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "400":
          description: >-
            Bad Request - thieu/sai idNam, tep rong hoac sai dinh dang, thieu cot bat
            buoc, dong thieu ho ten giang vien, hoac file khong co dong nao thuoc 3 ky
            cua nam dang import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "403":
          description: FORBIDDEN - chi ADMIN / HT duoc import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "415":
          description: Unsupported Media Type (khong phai multipart/form-data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
  /api/gio-giang-tkb:
    get:
      tags:
        - GioGiangTkb
      summary: Danh sach gio giang TKB theo nam (kem trang thai anh xa)
      description: >-
        Mot dong / giang vien. Cot IdNhanVien khac null = da anh xa; null = CHUA anh xa
        (dong do khong vao duoc bang tong hop).


        GoiYIdNhanVien la GOI Y do server tinh khi ten khop DUY NHAT mot nhan vien dang
        hoat dong - he thong KHONG tu ghi anh xa, nguoi dung phai xac nhan qua
        POST /api/gio-giang-tkb/anh-xa. Trung ten hoac khong khop ai -> khong goi y.


        SoDongChuaAnhXa tinh tren TOAN BO nam, khong chiu anh huong cua bo loc.
      operationId: gioGiangTkbList
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: keyword
          in: query
          required: false
          description: Loc theo ho ten hoac ten khoa.
          schema:
            type: string
        - name: chuaAnhXa
          in: query
          required: false
          description: "true = chi dong chua anh xa; false = chi dong da anh xa; bo trong = tat ca."
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "400":
          description: INVALID - idNam khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
  /api/gio-giang-tkb/tong-hop:
    get:
      tags:
        - GioGiangTkb
      summary: TONG GIO GIANG trong nam = gio TKB + gio ke khai da duyet
      description: >-
        KET QUA CUOI CUNG cua module. Moi dong: GioTkb (tu thoi khoa bieu) +
        GioKeKhaiDuyet (Phu luc II, CHI ban ke da chot trang_thai = 3 va dong duoc duyet
        TrangThaiDong = 2, tach san GioSauDaiHoc / GioDaiHoc) = TongGio.


        TAP GIANG VIEN la HOP cua hai nguon: nguoi co dong TKB DA ANH XA, va nguoi co
        ban ke khai da chot. Nguoi chi co mot nguon van xuat hien, nguon con lai bang 0.


        Dong TKB CHUA anh xa khong vao duoc day (khong biet la ai); so luong nhung dong
        do tra ve o SoDongChuaAnhXa - con lon hon 0 nghia la bang tong hop CHUA DAY DU.


        Quyen: ADMIN / HT xem toan truong; TK / TKL / TP xem don vi minh giu chuc vu
        (+ cay don vi cap duoi).
      operationId: gioGiangTkbTongHop
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Bo loc hien thi (don vi do hoac mot cap con), khong phai phan quyen.
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
  /api/gio-giang-tkb/anh-xa/tu-dong:
    post:
      tags:
        - GioGiangTkb
      summary: Quet lai anh xa tu dong tren du lieu da import
      description: >-
        Gan nhan vien cho cac ho ten khop DUY NHAT mot nhan vien dang hoat dong, tren
        du lieu DA CO cua nam - khong phai import lai file. Can khi nhan vien moi duoc
        them vao he thong sau lan import gan nhat.


        Import da tu chay viec nay roi; endpoint chi de quet BO SUNG.


        CHI THEM anh xa con thieu, KHONG BAO GIO ghi de dong da co - anh xa tay van
        nguyen ven. Vi vay chay bao nhieu lan cung vo hai: lan thu hai tra ve
        SoDongTuDongAnhXa = 0.


        Trung ten (>= 2 nguoi) hoac khong khop ai -> van de trong, dem vao
        SoDongChuaAnhXa; dung GET /api/gio-giang-tkb de xem SoNguoiKhopTen cua tung dong.


        Quyen: ADMIN / HT / TK / TKL / TP.
      operationId: gioGiangTkbAnhXaTuDong
      parameters:
        - name: idNam
          in: query
          required: true
          description: "Nam danh gia can quet, vd 2026."
          schema:
            type: integer
      responses:
        "200":
          description: >-
            OK - tra SoDongTuDongAnhXa (so vua gan) va SoDongChuaAnhXa (so con lai phai
            anh xa tay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "400":
          description: INVALID - thieu hoac sai idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
  /api/gio-giang-tkb/anh-xa:
    post:
      tags:
        - GioGiangTkb
      summary: Gan / go anh xa ho ten trong file TKB ve mot nhan vien
      description: >-
        Dung cho cac dong ma anh xa TU DONG khong xu ly duoc: trung ten (SoNguoiKhopTen
        >= 2) hoac khong khop ai (= 0). Cung dung de SUA mot anh xa tu dong bi sai -
        import lai se KHONG keo no ve nhu cu.


        Anh xa KHONG gan voi nam va KHONG bi xoa khi import lai -> chi can lam mot lan
        cho moi giang vien. Vi duoc join LUC DOC, sua anh xa co hieu luc NGAY, khong
        phai import lai.


        IdNhanVien = null -> GO anh xa cua ho ten do.
        HoTenChuan duoc chuan hoa lai o server (bo dau, gop khoang trang, viet hoa) nen
        co the gui ten con dau lay tu man hinh.


        Quyen: ADMIN / HT / TK / TKL / TP.
      operationId: gioGiangTkbAnhXa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GioGiangTkbAnhXaRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "400":
          description: INVALID - thieu ho ten hoac id nhan vien khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
        "404":
          description: NOT_FOUND - khong tim thay nhan vien
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangTkbResponse"
