          description: OK - Items la danh sach minh chung kem ngu canh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViKhoResponse"
        "400":
          description: idPhieuDv / idNam / idDonVi <= 0 (ErrorCode = VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViKhoResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN - don vi nam ngoai pham vi cua nguoi goi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViKhoResponse"
        "404":
          description: ErrorCode = NOT_FOUND - khong co phieu danh gia don vi nao khop bo loc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViKhoResponse"
  /api/minh-chung-don-vi/{idMinhChung}/tai-ve:
    get:
      tags:
        - PhieuDonVi
      summary: Tai tep minh chung don vi ve (ho tro xem truoc inline)
      description: >
        Mac dinh Content-Disposition: attachment (ten tep goc); truyen inline=1 de doi
        sang inline cho FE xem truoc trong iframe / tab moi.
        Content-Type suy tu loai_file - upload moi chi con pdf/png/jpg/jpeg, nhung ban ghi
        CU van co the la doc/docx/xls/xlsx nen khong co dinh mot kieu; duoi la se tra
        application/octet-stream.
        Chi ap dung cho LoaiMinhChung = 1 (File); loai 2 (Link) / 3 (DOI) khong co tep tren dia.
        Quyen doc giong GET api/chi-tiet-don-vi/{idChiTiet}/minh-chung, khong rang buoc trang thai phieu.
        Endpoint nam sau [TokenAuthorize], nhung filter co fallback doc cookie httpOnly
        kpi_access_token nen the a/iframe van xac thuc duoc khi FE cung-site.
        Response luon kem X-Content-Type-Options: nosniff.
      operationId: minhChungDonViTaiVe
      parameters:
        - name: idMinhChung
          in: path
          required: true
          description: id_minh_chung_dv (minh_chung_don_vi).
          schema:
            type: integer
        - name: inline
          in: query
          required: false
          description: >
            inline=1 -> Content-Disposition: inline. Chi co hieu luc voi cac kieu trinh
            duyet render an toan (application/pdf, image/png, image/jpeg); cac kieu con
            lai van tra attachment de tranh nguy co stored XSS neu whitelist duoi file
            duoc mo rong. Bo qua / khac 1 -> attachment.
          schema:
            type: integer
            enum: [1]
      responses:
        "200":
          description: Noi dung tep
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            idMinhChung <= 0 (ErrorCode = VALIDATION_FAILED), hoac
            ErrorCode = MINH_CHUNG_KHONG_PHAI_FILE (minh chung la Link/DOI - phan hoi
            kem Item de FE mo thang DuongDan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
        "404":
          description: >
            ErrorCode = NOT_FOUND (khong ton tai / da xoa mem) hoac
            FILE_NOT_FOUND (metadata con nhung tep da mat tren may chu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungDonViResponse"
  /api/minh-chung-don-vi/{idMinhChung}:
