  /api/phieu/{id}/submit:
    post:
      tags:
        - PhieuDanhGia
      summary: Submit a GV self-evaluation to Khoa
      description: |
        Validates that the phieu is in NHAP (1), owned by the current GV,
        and that all chi_tiet rows have diem_tu_danh_gia plus required minh_chung.
      operationId: phieuDanhGiaSubmit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuSubmitRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Bad Request (invalid id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Forbidden (not the GV who owns the phieu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: Conflict - phieu not in NHAP state, or concurrency conflict (phieu was modified by another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
        "422":
          description: Missing diem_tu_danh_gia or required minh_chung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
