        "400":
          description: Id / giới tính / hệ số phụ cấp không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoSoNhanVienResponse"
        "401":
          description: Chưa xác thực
        "403":
          description: Không có quyền (GV sửa hồ sơ người khác, hoặc sửa hệ số phụ cấp mà không phải Admin/BGH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoSoNhanVienResponse"
        "404":
          description: Không tìm thấy nhân viên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoSoNhanVienResponse"
        "409":
