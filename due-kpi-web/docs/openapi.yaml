        HeSoNckh:
          type: number
          format: decimal
          nullable: true
          description: Multiplier NCKH (VD 1.20). Lấy MAX khi nhiều ngoại lệ.
        HeSoGiamNckh:
          type: number
          format: decimal
          nullable: true
        SoGioThemNckh:
          type: number
          format: decimal
          nullable: true
          description: Giờ NCKH cộng thêm vào thực tế (loại 6)
        HeSoGiamPvcd:
          type: number
          format: decimal
          nullable: true
        MienNckh:
          type: boolean
        TuNgay:
          type: string
          format: date
          nullable: true
        DenNgay:
          type: string
          format: date
          nullable: true
        LyDo:
          type: string
          nullable: true
        MinhChungUrl:
          type: string
          nullable: true
        IdNguoiTao:
          type: integer
        NgayTao:
          type: string
          format: date-time
        TrangThai:
          type: boolean
    NgoaiLeDinhMucResponse:
      type: object
      properties:
