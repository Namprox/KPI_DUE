            chí NCKH_BBQT_DIEM_KPI (sau khi sàn 0 và chặn trần ở DiemToiDa của tiêu chí)
            — nếu DiemTuDong nhỏ hơn giá trị này nghĩa là đã bị chặn trần.
        SoBaiBao:
          type: integer
          description: >
            Cột DẪN XUẤT bên DB (= số phần tử của articles_json lúc đồng bộ). Luôn có kể
            cả khi BaiBao vắng mặt — dùng để biết có bao nhiêu bài mà không cần tải cả mảng.
