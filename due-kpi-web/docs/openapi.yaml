          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "400":
          description: >
            ErrorCode = VALIDATION (khong phai PDF, tep rong, vuot kich thuoc) / IO_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN_CHUC_VU / FORBIDDEN_DON_VI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = VI_PHAM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "415":
          description: Yeu cau khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
    delete:
