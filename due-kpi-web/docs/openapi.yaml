                tenHienThi:
                  type: string
                  description: Optional display name. Defaults to the file's base name.
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "400":
          description: Bad Request (missing file, invalid extension, file too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: chi_tiet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "409":
          description: Phieu not in NHAP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
  /api/chitiet/{idChiTiet}/minh-chung/link:
    post:
      tags:
