  /api/phieu:
    get:
      tags:
        - PhieuDanhGia
      summary: Get phieu danh gia list
      description: >
        Phạm vi theo ma_chuc_vu: cấp Trường (HT/ADMIN) xem tất cả; cấp Khoa
        (TK/TKL/TP) xem đơn vị mình + đơn vị con; người khác chỉ xem phiếu của
        chính mình. Thay cho magic id {1,7,8}/6 cũ.
      operationId: phieuDanhGiaGetPaged
      parameters:
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: CSV list of trang_thai values (e.g. "1,2,3")
          schema:
            type: string
        - name: tuNgay
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: denNgay
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - ngay_tao
              - ngay_gui
      responses:
