        "400":
          description: >-
            Bad Request — thieu LoaiNhom khi LoaiDoiTuong khac 4; hoac TenNhom
            rong / qua 200 ky tu, LoaiNhom ngoai 1..2, LoaiDoiTuong ngoai 1..4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhomTieuChiResponse"
