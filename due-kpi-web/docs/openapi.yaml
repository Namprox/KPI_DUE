    get:
      tags:
        - DinhMucGiangVien
      summary: Giờ NCKH thực tế đã tính thêm so_gio_them_nckh từ ngoại lệ
      description: >
        = gio_thuc_hien_gv.gio_nckh_thuc_te (0 nếu chưa nhập)
          + Σ ngoai_le_active.so_gio_them_nckh (loại 6 — quân nhân dự bị).
        Session 7 dùng giá trị này khi chốt phiếu.
      operationId: dinhMucGiangVienGetGioNckhThucTe
      parameters:
        - name: idNv
          in: path
          required: true
          schema:
            type: integer
          description: id_nhan_vien
        - name: idNam
          in: path
          required: true
          schema:
            type: integer
          description: Năm đánh giá
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                  Message:
                    type: string
                  Data:
                    type: object
                    properties:
                      IdNhanVien:
                        type: integer
                      IdNam:
                        type: integer
                      GioNckhThucTe:
                        type: number
                        format: decimal
                        description: Giờ NCKH thực tế (gio_thuc_hien + so_gio_them_nckh)
        "400":
          description: Không tìm thấy nhân viên
        "403":
          description: Không có quyền
  /api/phieu/{id}/tong-hop-tu-quy:
    post:
      tags:
        - PhieuQuy
      summary: Tong hop diem co ban cuoi nam tu cac phieu quy (roll-up)
      description: >
        Ghi diem CO BAN cua phieu NAM = TRUNG BINH tong_diem_co_ban cua cac phieu QUY
        da chot (trang thai 5), roi cong diem vuot troi (dong nhom B cua chinh phieu
        nam) ra tong tich luy.

        CHI ap dung cho phieu NAM cua vien chuc / NLD trong nam da bat
        nam_danh_gia.ap_dung_phieu_quy (phieu do co NguonDiemCoBan = 2).

        MAU SO LA SO QUY THUC SU DA CHOT, khong phai 4 — nguoi vao lam giua nam / nghi
        thai san khong bi phat vi nhung quy khong ton tai.

        0 QUY DA CHOT -> 409 KHONG_CO_QUY_DA_CHOT va KHONG ghi gi. Khong ngam coi la
        0 diem, khong ngam chia cho 4.
        1-3 QUY -> van thanh cong, CanhBao = true de FE hien "chi tong hop tu N quy".

        PHAI chay TRUOC khi Truong khoa chot ho so: sp_phieu_khoa_duyet_ho_so chan bang
        CHUA_TONG_HOP_QUY neu chua co quy nao chot.
        Idempotent: goi lai duoc khi phieu nam con o trang thai 1 hoac 2.
      operationId: phieuNamTongHopTuQuy
      parameters:
        - name: id
          in: path
          required: true
          description: Id cua phieu NAM (quy = 0)
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuNamTongHopQuyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuNamTongHopQuyResponse"
        "403":
          description: FORBIDDEN_DON_VI
        "404":
          description: NOT_FOUND
        "409":
          description: >
            KHONG_CO_QUY_DA_CHOT, KHONG_PHAI_PHIEU_NAM, SAI_LOAI_DOI_TUONG,
            NGUON_DIEM_KHONG_PHAI_QUY, INVALID_STATE, CONCURRENCY_CONFLICT
