          type: boolean
        Message:
          type: string
        Item:
          $ref: "#/components/schemas/NgoaiLeDinhMucDto"
          nullable: true
        Items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/NgoaiLeDinhMucDto"
    # ── Session 5b schemas: DinhMucApDung ────────────────────────────────────────
    DinhMucApDungDto:
      type: object
      properties:
        IdNhanVien:
          type: integer
        IdNam:
          type: integer
        IdChucDanh:
          type: integer
          nullable: true
        TenChucDanh:
          type: string
          nullable: true
        GioGiangBase:
          type: number
          format: decimal
          description: Giờ giảng gốc (HC) theo chức danh + năm
        GioNckhBase:
          type: number
          format: decimal
          description: Giờ NCKH gốc theo chức danh + năm
        GioPvcdBase:
          type: number
          format: decimal
          description: Giờ PVCĐ gốc theo chức danh + năm
        GioGiangApDung:
          type: number
          format: decimal
          description: "Giờ giảng sau ngoại lệ: max(0, base − SoGioGiam − base × ΣHeSoGiam)"
        GioNckhApDung:
          type: number
          format: decimal
          description: "Giờ NCKH sau ngoại lệ: max(0, base × MAX(HeSoNckh) − base × ΣHeSoGiamNckh)"
        GioPvcdApDung:
          type: number
          format: decimal
          description: "Giờ PVCĐ sau ngoại lệ: max(0, base − base × ΣHeSoGiamPvcd)"
        HeSoNckhApDung:
          type: number
          format: decimal
          description: Hệ số nhân cuối (MAX từ các ngoại lệ; mặc định 1.0)
        MienNckh:
          type: boolean
          description: true = tập sự, điều kiện NCKH bị bỏ qua khi xếp loại
        LyDoDieuChinh:
          type: string
          nullable: true
