    ToTrinhKhoaDto:
      type: object
      description: Goi KPI cua mot don vi trong mot nam (UNIQUE theo id_nam + id_don_vi)
      properties:
        IdToTrinh:
          type: integer
        IdNam:
          type: integer
        IdDonVi:
          type: integer
        MaDonVi:
          type: string
          nullable: true
        TenDonVi:
          type: string
          nullable: true
        TrangThai:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: >-
            1 DANG_TONG_HOP, 2 DA_DONG_GOI, 3 DA_TRINH, 4 HT_DA_DUYET, 5 HT_TRA_VE.
            LUONG DUYET TACH DOI — trang thai 4 nay co HAI NGUON GOC khac han nhau, phan
            biet qua IdNguoiDuyet:
            * IdNguoiDuyet co gia tri => Hieu truong duyet THAT (goi da di qua 2 -> 3 -> 4).
            * IdNguoiDuyet = null    => GOI TU DONG HOAN TAT: don vi khong co ho so lanh
              dao nao nen dong goi xong la chot luon, chua qua tay HT lan nao (goi di
              thang 1 -> 4, lich su hanh_dong = 6).
            Goi tu dong hoan tat van mo lai duoc khi co ho so moi duoc chot; goi HT duyet
            that thi bi khoa cung.
            FE hien "Nguoi duyet: ..." PHAI handle null (hien "—" hoac "Tu dong").
        TrangThaiText:
          type: string
          nullable: true
          readOnly: true
        SoGiangVien:
          type: integer
          nullable: true
