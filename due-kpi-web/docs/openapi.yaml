        Danh sach phieu danh gia don vi (khoa/phong). Pham vi don vi do SP enforce
        theo chuc vu cua nguoi goi (TKK/TKP/TK/TKL/TP/HT/ADMIN).


        Kiem nhiem: "don vi cua nguoi goi" = MOI don vi ma ho thuc su giu mot trong
        cac chuc vu tren (+ cay don vi cap duoi), khong chi don vi trong JWT. Chuc vu
        giu o don vi nay KHONG keo sang don vi khac - xem muc phan quyen o dau tai
        lieu. HT/ADMIN van thay toan bo.


        Truong don vi (TK/TKL/TP) DUOC GIAO cham tieu chi qua tieu_chi_don_vi_cham
        thay them cac phieu co tieu chi do, tu trang_thai >= 2 (khong thay phieu nhap).
      operationId: phieuDonViGetPaged
