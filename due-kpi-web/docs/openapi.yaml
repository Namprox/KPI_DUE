    get:
      tags:
        - Nckh
      summary: Danh sach gio NCKH (moi giang vien 1 dong / nam)
      description: >-
        Doc bang phu nckh_gio_nckh, LEFT JOIN nhan_vien qua EMAIL (LOWER+TRIM).
        Nguoi dung NCKH chua khop nhan vien nao van duoc liet ke voi IdNhanVien = null.
