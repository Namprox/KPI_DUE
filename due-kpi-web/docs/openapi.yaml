      description: >-
        Keo toan bo du lieu gio NCKH tu {NckhApiUrl}/api/kpisciencescoring va GHI DE
        TOAN BANG nckh_gio_nckh trong 1 transaction. KHONG CO THAM SO: API nguon khong
