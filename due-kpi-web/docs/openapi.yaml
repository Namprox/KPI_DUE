          type: number
          format: double
          nullable: true
          description: "Null = nguoi duyet chua xet dong nay."
        GioDuyet:
          type: number
          format: double
          nullable: true
          description: "0 khi dong bi tra ve."
        TrangThaiDong:
          type: integer
          description: >-
            State machine THAT SU cua module:
            1 CHO DUYET (giang vien sua / go duoc, nguoi duyet phai xet) |
            2 DA CHOT (khoa voi giang vien; nguoi duyet van mo lai duoc) |
            3 TRA VE (kem ly do o NhanXetDuyet; giang vien sua thi tu quay ve 1).
            LUU Y: gia tri 3 truoc day mang nghia "Tu choi", nay doc la "Tra ve" -
            cung cho GioDuyet = 0, khac o cho giang vien sua duoc.
        MoTa:
          type: string
          nullable: true
          description: "Giang vien ghi ten hoc vien / lop / hoc phan."
        NhanXetDuyet:
          type: string
          nullable: true
          description: >-
            Ly do nguoi duyet tra ve dong nay. Bi xoa khi giang vien sua dong.
