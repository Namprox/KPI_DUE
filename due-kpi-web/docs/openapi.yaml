  /api/phieu/khoa/pending:
    get:
      tags:
        - PhieuDanhGia
      summary: List phieu awaiting Khoa evaluation
      description: >
        Hàng đợi chờ trưởng đơn vị chấm (ma_chuc_vu TK/TKL/TP), lấy theo phân quyền
        **tieu_chi_don_vi_cham**: chỉ trả phiếu (trang_thai=2) mà đơn vị của người
        đăng nhập có ≥1 tiêu chí được giao chấm — hoặc do tiêu chí đã phân quyền cho
        đơn vị này, hoặc tiêu chí chưa phân quyền và đơn vị này là chủ quản của phiếu.
        Mỗi phiếu kèm tiến độ SoTieuChiDuocGiao / SoTieuChiDaCham.
        KHÔNG có bước "Khoa duyệt" thủ công: ngay khi tiêu chí chấm tay cuối cùng
        trên phiếu (mọi đơn vị) có điểm, phiếu **tự chuyển** sang trang_thai=3 để HT
        duyệt. Response của PUT /api/chitiet/{idChiTiet}/diem-khoa trả về
        TrangThaiPhieu để FE biết phiếu vừa rời hàng đợi.
      operationId: phieuDanhGiaGetKhoaPending
      parameters:
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          description: "ngay_gui (mac dinh) hoac ngay_tao."
          schema:
            type: string
            enum: [ngay_gui, ngay_tao]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
