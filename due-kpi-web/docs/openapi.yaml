    # ── Session 5a schemas: NgoaiLeDinhMuc ──────────────────────────────────────
    NgoaiLeDinhMucCreateRequest:
      type: object
      required:
        - IdNhanVien
        - IdNam
        - LoaiNgoaiLe
      properties:
        IdNhanVien:
          type: integer
        IdNam:
          type: integer
          description: "Năm đánh giá (VD: 2025)"
        LoaiNgoaiLe:
          type: integer
          minimum: 1
          maximum: 8
          description: >
            1: Tập sự / thử việc (MienNckh bắt buộc = true).
            2: Nghỉ BHXH / nghỉ LĐ.
            3: Cử đi đào tạo TS tập trung.
            4: GV nữ nuôi con 7-12 tháng (default SoGioGiamGiang = 40 giờ chuẩn).
            5: GV nữ nuôi con 13-36 tháng (default HeSoGiamGiang = 0.10).
            6: Quân nhân dự bị / tự vệ huấn luyện (dùng SoGioThemNckh).
            7: Hệ số NCKH nữ (default HeSoNckh = 1.20).
            8: Khác (LyDo bắt buộc).
        HeSoGiamGiang:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          maximum: 1
          description: Tỷ lệ giảm giờ giảng (0.00–1.00)
        SoGioGiamGiang:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          description: Số giờ HC giảm tuyệt đối (cùng đơn vị với dinh_muc_giang_vien)
        HeSoNckh:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          description: Hệ số nhân áp lên giờ NCKH (multiplier, VD 1.20). Lấy MAX khi nhiều ngoại lệ.
        HeSoGiamNckh:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          maximum: 1
          description: Tỷ lệ giảm giờ NCKH (0.00–1.00)
        SoGioThemNckh:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          description: Số giờ NCKH cộng thêm vào thực tế (loại 6)
        HeSoGiamPvcd:
          type: number
          format: decimal
          nullable: true
          minimum: 0
          maximum: 1
          description: Tỷ lệ giảm giờ PVCĐ (0.00–1.00)
        MienNckh:
          type: boolean
          description: true = tập sự, bỏ qua điều kiện đủ NCKH khi xếp loại (Session 7)
        TuNgay:
          type: string
          format: date
          nullable: true
          description: Ngày bắt đầu hiệu lực (YYYY-MM-DD)
        DenNgay:
          type: string
          format: date
          nullable: true
          description: Ngày kết thúc hiệu lực. NULL = không giới hạn.
        LyDo:
          type: string
          nullable: true
          maxLength: 500
          description: Bắt buộc khi loai_ngoai_le = 8 (Khác)
        MinhChungUrl:
          type: string
          nullable: true
          maxLength: 500
    NgoaiLeDinhMucUpdateRequest:
      type: object
      description: Chỉ cho phép cập nhật LyDo, MinhChungUrl, DenNgay, TrangThai
      properties:
        LyDo:
          type: string
          nullable: true
          maxLength: 500
        MinhChungUrl:
          type: string
          nullable: true
          maxLength: 500
        DenNgay:
