      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change password
      description: >-
        Doi mat khau cua nguoi dung dang dang nhap. id_nhan_vien lay tu access
        token (khong nhan tu body). Khi thanh cong, refresh token hien tai bi thu
        hoi nen client phai dang nhap lai.
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password (admin)
      description: >-
        Truong (id_chuc_vu 1,7,8) dat lai mat khau cho mot nhan vien khac.
        Khong can mat khau cu; id_nhan_vien dich nhan tu body. Khi thanh cong,
        refresh token hien tai cua nhan vien do bi thu hoi nen ho phai dang nhap lai.
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
