    NhomViPhamDto:
      type: object
      description: >
        Giang vien (LoaiDoiTuong = 1): 6 nhom, khong ap tran theo nhom.
        Vien chuc/NLD (LoaiDoiTuong = 2): 3 nhom — "Hoan thanh cong viec..." (tran 70),
        "Tuan thu gio giac, tac phong, noi quy" (tran 30) va
        "Chinh tri, tu tuong" (KHONG ap tran).
      properties:
        IdNhomVp:
          type: integer
        TenNhom:
          type: string
        MaNhom:
          type: string
          nullable: true
          description: >
            Ma nghiep vu on dinh cua nhom, TRUNG DUNG ma CongThucTongHop cua tieu chi
            cham tu dong tuong ung: VPVC_HOAN_THANH_CV (tran 70), VPVC_NOI_QUY (tran 30),
            VPVC_CHINH_TRI (khong tran). null = nhom chua gan cong thuc — toan bo 6 nhom
            giang vien deu null, va tieu chi mang ma do se duoc cham TRON DIEM vi khong
            khop vi pham nao.
        LoaiDoiTuong:
          type: integer
          enum: [1, 2]
          description: 1 = giang vien, 2 = vien chuc/NLD
        TranDiemTru:
          type: number
          format: double
          nullable: true
          description: >
            Diem tru toi da cua nhom nay tren mot ca nhan trong mot nam.
            null = khong ap tran theo nhom (cac nhom giang vien chi chiu tran 15 tong ca nhan).
        ThuTuHienThi:
          type: integer
        TrangThai:
          type: boolean
