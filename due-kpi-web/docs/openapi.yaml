    NhanVienChucVuDto:
      type: object
      description: >-
        Một quan hệ (nhân viên × đơn vị × chức vụ × khoảng thời gian).
        Một người có thể có nhiều dòng hiệu lực ở các đơn vị khác nhau (kiêm nhiệm).
      properties:
        IdNvChucVu:
          type: integer
          description: PK của bản ghi quan hệ
        IdNhanVien:
          type: integer
        IdDonVi:
          type: integer
          description: Đơn vị của quan hệ này
        MaDonVi:
          type: string
          description: Mã đơn vị (join từ bảng don_vi)
        TenDonVi:
          type: string
          description: Tên đơn vị (join từ bảng don_vi)
        IdChucVu:
          type: integer
          nullable: true
          description: NULL = chỉ là thành viên đơn vị, không giữ chức vụ
        TenChucVu:
          type: string
          nullable: true
          description: Tên chức vụ (join từ bảng chuc_vu). NULL khi IdChucVu NULL.
        LaChinh:
          type: boolean
          description: >-
            true = đơn vị chính (nguồn của claim id_don_vi trong JWT).
            Mỗi nhân viên có tối đa 1 dòng LaChinh đang hiệu lực.
        TyLeDinhMucGiang:
          type: number
          format: decimal
          nullable: true
          description: Tỷ lệ giờ giảng còn phải hoàn thành (0.00–1.00). NULL = không áp dụng giảm trừ.
        TuNgay:
          type: string
          format: date
          description: Ngày bắt đầu nhiệm kỳ
        DenNgay:
          type: string
          format: date
          nullable: true
          description: Ngày kết thúc nhiệm kỳ. NULL = đang giữ.
        GhiChu:
          type: string
          nullable: true
        NgayTao:
          type: string
          format: date-time
    NhanVienChucVuCreateRequest:
      type: object
      required:
        - IdNhanVien
        - IdDonVi
        - TuNgay
      properties:
        IdNhanVien:
          type: integer
        IdDonVi:
          type: integer
          description: Đơn vị của quan hệ — bắt buộc (validate ở BLL)
        IdChucVu:
          type: integer
          nullable: true
          description: NULL = chỉ là thành viên đơn vị, không giữ chức vụ
        TuNgay:
          type: string
          format: date
          description: Ngày bắt đầu nhiệm kỳ (YYYY-MM-DD)
        DenNgay:
          type: string
          format: date
          nullable: true
          description: Ngày kết thúc nhiệm kỳ. Phải ≥ TuNgay.
        GhiChu:
          type: string
          nullable: true
          maxLength: 500
        LaChinh:
          type: boolean
          default: false
          description: >-
            true = đặt dòng này làm đơn vị chính (hạ cờ dòng chính cũ).
            **Chỉ ADMIN**; phải để DenNgay NULL. Khác → 403.
    NhanVienChucVuUpdateRequest:
      type: object
      description: >-
        DenNgay/GhiChu là ghi đè trực tiếp. IdDonVi/LaChinh để NULL = giữ nguyên.
      properties:
        DenNgay:
          type: string
          format: date
          nullable: true
          description: Ngày kết thúc nhiệm kỳ. Phải ≥ TuNgay của bản ghi gốc.
        GhiChu:
          type: string
          nullable: true
          maxLength: 500
        IdDonVi:
          type: integer
          nullable: true
          description: NULL = giữ nguyên đơn vị. **Chỉ ADMIN** mới được đổi → 403.
        LaChinh:
          type: boolean
          nullable: true
          description: >-
            NULL = giữ nguyên cờ đơn vị chính. **Chỉ ADMIN** mới được đổi → 403.
            Không được hạ cờ dòng chính cuối cùng của nhân viên đang hoạt động → 409.
    NhanVienChucVuResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Item:
          $ref: "#/components/schemas/NhanVienChucVuDto"
        Items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/NhanVienChucVuDto"
