  /api/hoc-vu/import-sinh-vien:
    post:
      tags:
        - HocVu
      summary: Import danh sach sinh vien (File 1) cho 1 nam danh gia
      description: >
        multipart/form-data: file Excel sheet "Sheet1" + field 'idNam' (vd 2026).
        Cot tim THEO TEN header (khong phan biet hoa thuong / dau / gach duoi): MaKhoa,
        TenKhoa, namNhaphoc, maKhoahoc, LOP, MA_SINH_VIEN, hovaten, ThoiHoc,
        SO_HIEU_VAN_BANG_TOT_NGHIEP_CT1, NamTotNghiepNganh1. O rong hoac chu "NULL" = khong co gia tri.
        KHONG luu Khoa 201, 344 va lop bat dau bang CTS (ExcludedRows).
        1 MSSV = 1 ban ghi dung chung moi nam, MERGE theo MSSV: co roi -> cap nhat,
        chua co -> them; SV khong con trong file va lan cap nhat gan nhat la CHINH nam nay -> xoa;
        SV nam cu khong co trong file -> giu nguyen; ban ghi da duoc nam MOI HON cap nhat
        -> khong ghi de (SkippedNewerRows). File khong con dong hop le -> khong thay doi gi.
        Tu anh xa MaKhoa -> Khoa khi TenKhoa trung DUY NHAT ten 1 Khoa (chi them, khong ghi de).
        Quyen: ADMIN hoac TP cua P_DTBDCL.
      operationId: hocVuImportSinhVien
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - idNam
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xls / .xlsx), kiem duoi file + chu ky nhu cac endpoint import khac.
                idNam:
                  type: integer
                  example: 2026
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "400":
          description: >-
            Thieu file/idNam, sai dinh dang, khong tim thay sheet / dong tieu de / cot bat buoc,
            khong co dong hop le, hoac loi ghi CSDL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "403":
          description: Khong phai ADMIN / TP P_DTBDCL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "404":
          description: Nam danh gia khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "415":
          description: Khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
  /api/hoc-vu/import-canh-bao:
    post:
      tags:
        - HocVu
      summary: Import danh sach sinh vien bi canh bao hoc vu (File 2) cho 1 nam danh gia
      description: >
        multipart/form-data: file Excel sheet "Canh bao" (co dau) + field 'idNam'.
        Cot: MSV (bat buoc), Ho, Ten, Ghi chu CB, so QD, so TB. So lan canh bao tach tu
        "Ghi chu CB" (vd "CB lan 2" -> 2). Luu THEO NAM: upload lai = xoa canh bao cua nam
        do roi chen lai; cac nam khac giu nguyen. CHI LUU SV co trong danh sach sinh vien:
        SV khoa tren (khong can xet), Khoa 201 / 344, lop CTS bi BO QUA (UnmatchedStudents /
        UnmatchedRows) -> phai import danh sach sinh vien TRUOC; khong SV nao khop -> 400,
        du lieu cu giu nguyen. Import lai danh sach SV co them SV thi import lai file nay.
        Quyen: ADMIN hoac TP cua P_DTBDCL.
      operationId: hocVuImportCanhBao
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - idNam
              properties:
                file:
                  type: string
                  format: binary
                idNam:
                  type: integer
                  example: 2026
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "400":
          description: Thieu file/idNam, sai dinh dang, sai cau truc file, khong co dong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "403":
          description: Khong phai ADMIN / TP P_DTBDCL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "404":
          description: Nam danh gia khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
        "415":
          description: Khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuImportResponse"
  /api/hoc-vu/ty-le-khoa:
    get:
      tags:
        - HocVu
      summary: Ty le tot nghiep dung han + ty le canh bao hoc vu cua moi Khoa trong 1 nam
      description: >
        Khoa hoc suy ra tu idNam: tot nghiep dung han = SV nhap hoc nam idNam - 4;
        canh bao = SV nhap hoc tu idNam - 3 den idNam.
        TyLeTotNghiepDungHan = so co so hieu van bang (va khong thoi hoc) * 100 / (tong - thoi hoc).
        TyLeCanhBaoHocVu = so SV (distinct) bi canh bao trong nam (khong thoi hoc) * 100 / (tong - thoi hoc).
        Ty le null = mau so 0 (chua co du lieu / Khoa chua anh xa), khac 0%.
        Tinh tren du lieu SV MOI NHAT nen xem lai nam cu co the khac luc chot.
        Quyen xem: ADMIN / TP@P_DTBDCL thay moi Khoa (XemTatCa = true, co TongQuan doi soat
        toan truong); TK / TKL / TKK chi thay Khoa ma minh giu chuc vu (TongQuan = null);
        nguoi khac nhan 403.
      operationId: hocVuGetTyLeKhoa
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyLeHocVuResponse"
        "400":
          description: Thieu / sai idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyLeHocVuResponse"
        "403":
          description: Khong phai ADMIN / TP@P_DTBDCL / TK / TKL / TKK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyLeHocVuResponse"
  /api/hoc-vu/sinh-vien:
    get:
      tags:
        - HocVu
      summary: Danh sach sinh vien dung sau ty le hoc vu cua Khoa (de doi chieu)
      description: >
        loai=tot-nghiep: SV nhap hoc nam idNam - 4; loai=canh-bao: SV nhap hoc idNam - 3 .. idNam.
        TrangThai tung SV cung dinh nghia voi cong thuc ty le:
        1 = vao tu so (tot-nghiep: co so hieu van bang; canh-bao: bi canh bao trong nam);
        2 = trong mau so nhung khong vao tu so; 3 = thoi hoc (loai khoi ca tu va mau).
        SoTrangThai1/2/3 dem truoc loc trangThai - khong keyword thi khop dung so lieu cua
        ty-le-khoa (ty le = SoTrangThai1 / (SoTrangThai1 + SoTrangThai2)).
        Quyen nhu ty-le-khoa; idDonVi bo trong = moi Khoa duoc xem, idDonVi ngoai quyen -> 403.
      operationId: hocVuGetSinhVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
            example: 2026
        - name: loai
          in: query
          required: true
          schema:
            type: string
            enum: [tot-nghiep, canh-bao]
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2, 3]
        - name: keyword
          in: query
          required: false
          description: Tim theo MSSV hoac ho ten
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuSinhVienListResponse"
        "400":
          description: Thieu / sai idNam, loai, trangThai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuSinhVienListResponse"
        "403":
          description: Khong co quyen xem, hoac idDonVi khong thuoc Khoa duoc xem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HocVuSinhVienListResponse"
