              schema:
                $ref: "#/components/schemas/LichSuChamDiemResponse"
  /api/chitiet/{idChiTiet}/lich-su-cham-diem:
    get:
      tags:
        - BaoCao
      summary: Audit trail of score changes scoped to a single chi_tiet
      description: |
        Same shape as the phieu-scoped variant but filtered to one chi_tiet, ordered by
        ngay_thuc_hien. Useful when the UI is already focused on a single criterion.
      operationId: chiTietGetLichSuChamDiem
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuChamDiemResponse"
  /api/bao-cao/tong-quan:
    get:
      tags:
        - BaoCao
      summary: Overview report - phieu counts by trang_thai and xep_loai
      description: |
        Counts phieu by trang_thai (1..5) and, for trang_thai=5 only, also by xep_loai.
        Khoa users are scoped to their don_vi tree; Truong sees all.
      operationId: baoCaoTongQuan
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoTongQuanResponse"
  /api/bao-cao/diem-trung-binh:
    get:
      tags:
        - BaoCao
      summary: Avg / min / max of tong_diem_tich_luy grouped by one-level-deep child don_vi
      description: |
        Only includes phieu with trang_thai=5 (HOAN_TAT). Buckets are the direct children of the
        requested idDonVi. If idDonVi is omitted, Truong defaults to root (children = Khoa);
        Khoa defaults to their own don_vi (children = Bo mon). Grandchild phieu (Bo mon under
        a Khoa) roll up under their parent Khoa bucket.
      operationId: baoCaoDiemTrungBinh
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoDiemTrungBinhResponse"
  /api/bao-cao/chua-hoan-tat:
    get:
      tags:
        - BaoCao
      summary: List phieu where trang_thai != 5, with days elapsed since ngay_tao
      description: |
        Useful for chasing late submissions. Ordered by days-elapsed DESC so oldest stale
        phieu come first. Don_vi scoping matches GET /api/phieu.
      operationId: baoCaoChuaHoanTat
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaoCaoChuaHoanTatResponse"
