          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
    post:
      tags:
        - PhieuDanhGia
      summary: Create phieu danh gia
      description: >
        Tao 1 phieu KPI cho 1 nguoi trong 1 nam TAI 1 DON VI.
        Nguoi kiem nhiem 2 don vi (vd vua la GV cua Khoa vua la Truong phong) tao
        DUOC 2 phieu trong cung mot nam bang cach goi 2 lan voi IdDonVi khac nhau —
        khoa duy nhat cua phieu la (IdNam, IdNhanVien, IdDonVi). Moi phieu roi vao
        to trinh + han ngach xuat sac 20% cua dung don vi cua no.
        Bo trong IdDonVi = phieu cua don vi chinh (hanh vi cu).
        Diem tu dong (NCKH, phan hoi SV, vi pham giang day, nhiem vu Khoa) khoa theo
        (nguoi, nam) chu khong theo don vi, nen trong mot nam chi MOT phieu cua nguoi
        do duoc cham tu dong — xem POST /api/phieu/{id}/tong-hop-tu-dong.
      operationId: phieuDanhGiaCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuDanhGiaCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
