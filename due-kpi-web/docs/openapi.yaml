          type: boolean
          nullable: true
        ThuTuHienThi:
          type: integer
          nullable: true
          description: >-
            Vi tri hien thi trong pham vi MOT nhom tieu chi (IdNhom), luon la day
            lien tuc 1..N (N = so tieu chi dang co cua nhom do). Bo trong / 0 / lon
            hon N+1 => them vao cuoi (N+1). Truyen 1..N => chen vao vi tri do, cac
            tieu chi tu vi tri do tro di tu dong day xuong 1 bac.
        TrangThai:
          type: boolean
          nullable: true
        LoaiDoiTuong:
          type: integer
          nullable: true
          description: "1=GV, 2=Vien chuc/NLD, 3=Khoa, 4=Phong. Bo trong => mac dinh 1 (GV)."
    TieuChiDanhGiaUpdateRequest:
      type: object
      required:
        - TenTieuChi
      properties:
        TenTieuChi:
          type: string
        IdNhom:
          type: integer
        MoTa:
          type: string
        DiemToiDa:
          type: number
        LoaiThangDiem:
          type: integer
        CongThucTinhDiem:
          type: string
        BatBuocMinhChung:
          type: boolean
          nullable: true
        ThuTuHienThi:
          type: integer
          nullable: true
          description: >-
            Doi cho trong pham vi MOT nhom tieu chi, giu day lien tuc 1..N. Bo trong
            => giu nguyen vi tri hien tai. 0 hoac lon hon N => keo ve cuoi. Truyen
            1..N => chuyen den vi tri do, cac tieu chi nam giua don 1 bac. Doi kem
            IdNhom => don gap o nhom cu va chen vao nhom moi.
        TrangThai:
          type: boolean
          nullable: true
        LoaiDoiTuong:
          type: integer
          nullable: true
          description: "1=GV, 2=Vien chuc/NLD, 3=Khoa, 4=Phong. Bo trong => mac dinh 1 (GV)."
