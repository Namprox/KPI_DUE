    NhiemVuCongDongCreateRequest:
      type: object
      required:
        - TenNhiemVu
        - IdNhomNv
        - IdVaiTro
      properties:
        TenNhiemVu:
          type: string
          maxLength: 500
        IdNhomNv:
          type: integer
          description: Must reference an active danh_muc_nhom_nhiem_vu row
        IdVaiTro:
          type: integer
          description: |
            Must be present in the resolved vai tro set for the phieu's (don_vi, nam).
            Resolution priority: (don_vi, nam) > (don_vi, NULL) > (NULL, nam) > (NULL, NULL).
            The diem_quy_doi of the resolved row is snapshotted into nhiem_vu_cong_dong.diem_snapshot.
        MoTa:
          type: string
          nullable: true
    NhiemVuCongDongUpdateRequest:
      type: object
      required:
        - TenNhiemVu
        - IdNhomNv
        - IdVaiTro
      properties:
        TenNhiemVu:
          type: string
          maxLength: 500
        IdNhomNv:
          type: integer
        IdVaiTro:
          type: integer
          description: Changing IdVaiTro recomputes the snapshot and re-checks the 20-point cap.
        MoTa:
          type: string
          nullable: true
    NhiemVuCongDongResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Item:
          $ref: "#/components/schemas/NhiemVuCongDongDto"
        Items:
          type: array
          items:
            $ref: "#/components/schemas/NhiemVuCongDongDto"
        TongDiemSnapshot:
          type: number
          nullable: true
          description: Sum of diem_snapshot for all active tasks. Present only on GET list.
        SoNhiemVu:
          type: integer
          nullable: true
          description: Count of active tasks. Present only on GET list.
        ConLai:
          type: number
          nullable: true
          description: Remaining Group-III quota (= 20 - TongDiemSnapshot). Present only on GET list.
    PvcdCapExceededResponse:
      type: object
      description: Returned with HTTP 422 when a create/update would exceed the 20-point Group-III cap.
      properties:
        error:
          type: string
          example: PVCD_CAP_EXCEEDED
        currentTotal:
          type: number
          description: Current sum of diem_snapshot for non-deleted tasks on this chi_tiet (before the attempted write).
        attemptedAdd:
          type: number
          description: The diem_snapshot value that was about to be added or applied.
        remaining:
          type: number
          description: Points still available (= 20 - currentTotal).
  securitySchemes:
    bearerAuth:
