  /api/chitiet/{idChiTiet}/diem-khoa:
    put:
      tags:
        - ChiTietDanhGia
      summary: Khoa danh gia chi tiet
      description: >
        Chấm điểm cấp Khoa cho 1 tiêu chí. Quyền theo ma_chuc_vu:
        nếu tiêu chí có phân quyền riêng (tieu_chi_don_vi_cham) thì CHỈ trưởng
        đơn vị được giao (TK/TKL/TP) chấm; nếu không có phân quyền thì mặc định
        trưởng đơn vị chủ quản (TK/TKL/TP). Vết người chấm lưu ở id_nguoi_dg_khoa.
      operationId: chiTietDanhGiaDiemKhoa
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
