          type: number
          format: double
          description: "SUM GioKeKhai cua cac dong con song."
        TongGioDuyet:
          type: number
          format: double
          description: "SUM GioDuyet, CHI cong cac dong TrangThaiDong = 2 (da chot)."
        NgayNop:
          type: string
          format: date-time
          nullable: true
          description: >-
            VET TICH cua luong "nop ca ban ke" da go - luon null voi du lieu moi.
            Giu lai de khong pha du lieu cu.
        IdNguoiDuyet:
          type: integer
          nullable: true
          description: "Nguoi xet GAN NHAT, chi de hien thi."
        TenNguoiDuyet:
          type: string
          nullable: true
        NgayDuyet:
          type: string
          format: date-time
          nullable: true
          description: "Thoi diem xet GAN NHAT, chi de hien thi."
        NhanXetDuyet:
          type: string
          nullable: true
          description: >-
            VET TICH cua luong cu. Ly do tra ve nay nam o TUNG DONG
            (ChiTietKeKhaiDto.NhanXetDuyet).
        NgayTao:
          type: string
          format: date-time
          nullable: true
        NgayCapNhat:
          type: string
          format: date-time
          nullable: true
        RowVersion:
          type: string
          format: byte
          nullable: true
          description: >-
            VET TICH: khong con endpoint nao nhan RowVersion (4 SP dung no da bi go).
            Null khi ban ke chua ton tai.
        ChoPhepSua:
          type: boolean
          description: >-
            QUYEN THUAN cua nguoi goi (chinh chu). Dieu kien theo tung dong nam o
            ChiTietKeKhaiDto.ChoPhepSua - dung co nay de an/hien nut "Them dong".
        ChoPhepDuyet:
          type: boolean
        CanSua:
          type: boolean
          description: "Quyen thuan tuy (chinh chu)."
        CanDuyet:
          type: boolean
        SoDong:
          type: integer
        SoDongChoDuyet:
          type: integer
          description: "So dong con TrangThaiDong = 1 - viec nguoi duyet con phai xet."
        ChiTiet:
          type: array
          items:
            $ref: "#/components/schemas/ChiTietKeKhaiDto"

    ChiTietKeKhaiDto:
      type: object
      description: >-
        Mot dong ke khai. HeSo / TenCongViec / DonViTinh la SNAPSHOT tai thoi diem
        nhap - Admin sua danh muc ve sau khong lam doi so lieu da luu.
      properties:
        IdChiTiet:
          type: integer
        IdKeKhai:
          type: integer
        IdCongViec:
          type: integer
        MaCongViec:
          type: string
          nullable: true
        GhiChuQuyDoi:
          type: string
          nullable: true
          description: "Doc tu danh muc HIEN TAI (chi de hien thi van ban QD)."
        TenCongViec:
          type: string
          description: "Snapshot."
        DonViTinh:
          type: string
