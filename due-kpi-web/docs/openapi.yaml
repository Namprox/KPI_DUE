      operationId: phanHoiSinhVienGetAll
      parameters:
        - name: namHoc
          in: query
          required: false
          schema:
            type: integer
          description: 2 chu so (vd 26)
        - name: kyHoc
          in: query
          required: false
          schema:
            type: integer
          description: 3 chu so, vd 261/262/263 (nam_hoc*10 + ky)
        - name: maCanBo
          in: query
          required: false
          schema:
            type: string
        - name: maHocPhan
          in: query
          required: false
          schema:
            type: string
          description: Ma hoc phan (vd LAW3059)
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Toi da 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiSinhVienResponse"
        "400":
          description: namHoc hoac kyHoc khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiSinhVienResponse"
  /api/phanhoisinhvien/import:
    post:
      tags:
        - PhanHoiSinhVien
      summary: Import phan hoi sinh vien tu file Excel (luu dong THO)
      description: >
        multipart/form-data: file Excel (9 cot: MSSV | ma_hoc_phan | ma_can_bo |
        ho_lot | ten | cau_hoi | danh_gia | nganh | hoc_ky) + field 'namHoc' (vd 26)
        + field 'maDonVi'. Doc file streaming va INSERT cac dong THO qua TVP; ghi de
        toan bo du lieu tho cu cung (nam_hoc, don_vi). Diem trung binh tinh sau.
      operationId: phanHoiSinhVienImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - namHoc
                - maDonVi
              properties:
                file:
                  type: string
                  format: binary
                namHoc:
                  type: integer
                maDonVi:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiSinhVienImportResponse"
        "400":
          description: Thieu file/tham so, file khong doc duoc, hoac khong co dong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiSinhVienImportResponse"
        "415":
          description: Khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiSinhVienImportResponse"
