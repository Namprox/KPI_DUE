  /api/phieu-don-vi/{id}/chot:
    post:
      tags:
        - PhieuDonVi
      summary: Chot phieu don vi (4 -> 5 HOAN_TAT)
      description: >-
        HT chot ket qua. SP tu tinh lai 3 tong diem de chong tamper, ghi
        diem_chinh_thuc cho tung dong roi snapshot lich su.

        XepLoai tuy chon — bo trong thi BLL tinh theo tong diem tich luy, bang
        HAI thang khac nhau tuy loai mau cua phieu:
          - Khoa (mau loai 3): XepLoaiCalculator.TinhXepLoaiDonVi — 95 / 80 / 60.
          - Phong / Trung tam (mau loai 4): TinhXepLoaiPhongTrungTam —
            < 50 muc 1; 50..60 muc 2; > 60 muc 3. Ham nay TOI DA tra muc 3 vi
            muc 4 con phu thuoc han ngach top 20% toan truong (chua tinh tu
            dong) — HT phai gui XepLoai = 4 bang tay.

        RIENG mau loai 4, gui XepLoai bang tay van bi SP kiem lai bang tong no
        tu tinh: muc >= 2 can tong >= 50, muc >= 3 can tong > 60, muc 4 can
        tong > 80. Khong dat -> 409 DIEM_KHONG_DU. Phieu Khoa khong bi rang
        buoc diem o buoc nay.
      operationId: phieuDonViChot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuDonViChotRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaDonViResponse"
        "409":
          description: >-
            Conflict — phieu khong o trang thai 4; RowVersion da thay doi
            (CONCURRENCY_CONFLICT); hoac tong diem khong du cho muc XepLoai da
            chon o phieu Phong/Trung tam (DIEM_KHONG_DU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaDonViResponse"
