          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
  /api/vi-pham/tong-hop-giang-vien:
    get:
      tags:
        - ViPhamGiangDay
      summary: Tong hop diem tru cua tung giang vien (tran 15 diem/ca nhan)
      description: >
        Chi liet ke giang vien THUOC KHOA. DiemTruCaNhan = MIN(tong diem tru trong nam, 15).
        IdDonVi tra ve la KHOA chu quan de khop voi api/vi-pham/diem-tru-khoa.
        Vien chuc / NLD dung endpoint rieng api/vi-pham/tong-hop-nhan-vien (tran theo
        tung nhom, khong phai tran 15 tong ca nhan).
      operationId: viPhamTongHopGiangVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Loc theo Khoa
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopGiangVienResponse"
        "400":
          description: Thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopGiangVienResponse"
        "401":
          description: Thieu hoac sai token
  /api/vi-pham/tong-hop-nhan-vien:
    get:
      tags:
        - ViPhamGiangDay
      summary: Tong hop diem tru cua vien chuc / NLD theo TUNG NHOM (tran 70 / 30 / khong tran)
      description: >
        Chi liet ke VIEN CHUC / NLD (loai vi pham co LoaiDoiTuong = 2). Tra ve MOT DONG
        cho moi cap (nhan vien x nhom vi pham) — KHONG gop thanh mot con so, vi moi nhom
        se nap vao mot tieu chi rieng biet cua phieu.


        DiemTruSauTran = MIN(TongDiemTruTho, TranDiemTru) voi TranDiemTru lay tu nhom:
        "Hoan thanh cong viec" = 70, "Tuan thu gio giac / noi quy" = 30,
        "Chinh tri, tu tuong" = null.


        TranDiemTru = null nghia la nhom KHONG ap tran — DiemTruSauTran bang dung
        TongDiemTruTho, cong don khong bi cat.


        KHAC voi api/vi-pham/tong-hop-giang-vien: ben giang vien ap tran 15 diem tren
        TONG ca nhan va tra ve 1 dong / giang vien.


        IdDonVi tra ve la DON VI CHU QUAN (Khoa/Phong cap 2). Nguoi kiem nhiem nhieu
        don vi se co mot bo dong cho MOI don vi chu quan, moi bo mang tong diem tru
        day du cua ho — giong hanh vi cua api/vi-pham/tong-hop-giang-vien voi GV kiem
        nhiem nhieu Khoa.


        Scope doc: HT/ADMIN xem tat ca; TK/TKL/TP xem nhan vien thuoc don vi minh
        (+ don vi con) va nhung vi pham do don vi minh ghi nhan; nguoi dung khac chi
        xem cua chinh minh.
      operationId: viPhamTongHopNhanVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Loc theo don vi chu quan (Khoa/Phong)
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopNhanVienResponse"
        "400":
          description: Thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamTongHopNhanVienResponse"
        "401":
          description: Thieu hoac sai token
  /api/vi-pham/diem-tru-khoa:
    get:
      tags:
        - ViPhamGiangDay
      summary: Diem tru KPI tap the cua tung Khoa
      description: >
        DiemTruTapThe = MIN( 7.5 * T / (0.2 * 15 * N) , 7.5 ), N = 0 -> 0.
        T = tong diem tru cua cac ca nhan (moi ca nhan da ap tran 15),
        N = tong so giang vien dang hoat dong cua Khoa.
        HT/ADMIN/TK/TKL/TP xem moi Khoa; nguoi dung khac chi xem Khoa cua minh.
      operationId: viPhamDiemTruKhoa
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: Loc 1 Khoa cu the
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamDiemTruKhoaResponse"
        "400":
          description: Thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamDiemTruKhoaResponse"
        "401":
          description: Thieu hoac sai token
  /api/nhom-vi-pham:
    get:
      tags:
        - LoaiViPham
