          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = VI_PHAM_NOT_FOUND / MINH_CHUNG_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
