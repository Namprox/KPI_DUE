  /api/ke-khai-thanh-tich/cua-toi:
    get:
      tags:
        - KeKhaiThanhTich
      summary: Ban ke khai thanh tich vuot troi cua mot nam
      description: >
        VONG DOI NAM O TUNG DONG, khong o ban ke - KHONG co buoc "nop".
        TrangThai cua ban ke chi la NHAN dan xuat tu cac dong: 4 con dong bi tra ve,
        2 con dong cho duyet, 3 moi dong da chot, 1 chua co dong nao.
        LAZY-CREATE: chua ke gi thi tra header RONG voi IdKeKhai = 0 - KHONG tao ban ke
        trong DB. Ban ke chi sinh ra khi PUT chi-tiet luu dong dau tien.
        Server tra san ChoPhepSua / ChoPhepDuyet o header, va ChoPhepSua / ChoPhepXet o
        TUNG DONG, nen FE khong phai tu suy tu trang thai.
        TongHopTheoLoai LUON co du 4 dong, mang TranDiem, DiemDuocTinh va canh bao
        VUOT_TRAN / KHEN_THUONG_TRUNG_NOI_DUNG.
      operationId: keKhaiThanhTichCuaToi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          description: "Xem ban ke cua nguoi khac (can quyen duyet). Bo trong = cua chinh minh."
          schema:
            type: integer
      responses:
        "200":
          description: OK - header + ChiTiet[] + minh chung da gom san + TongHopTheoLoai[]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichItemResponse"
        "400":
          description: INVALID - thieu hoac sai nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN - khong co quyen xem ban ke nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia hoac nhan vien
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/chi-tiet:
    put:
      tags:
        - KeKhaiThanhTich
      summary: Luu TOAN BO cac dong cua ban ke (mot form, mot lan luu)
      description: >
        Dong dang co trong DB ma khong xuat hien trong danh sach se bi go (soft delete) -
        NHUNG chi voi dong con sua duoc; dong DA CHOT khong bi go va gui len de sua se bi
        tu choi voi DONG_DA_CHOT.
        Day cung la noi TAO ban ke neu chua co (lazy-create).
        Client KHONG gui diem - server tinh DiemKeKhai = SoLuong * DiemQuyDoi cua muc,
        va ep SoLuong ve 1 voi muc co ChoPhepSoLuong = false.
        Dong dang bi TRA VE ma bi sua se TU quay ve cho duyet, xoa sach ket qua xet cu -
        chi khi dong that su doi, luu lai y nguyen thi giu nguyen ly do tra ve.
        MINH CHUNG BAT BUOC bi chan NGAY O DAY: dong thuoc muc co YeuCauMinhChung = true
        ma chua co file nao (da gan tu truoc HOAC gan trong chinh request nay qua
        ChiTiet[].IdMinhChung) -> ca request bi tu choi voi THIEU_MINH_CHUNG, kem
        DongCoVanDe[] co ThuTu de tro dung dong trong form.
        KHONG chan khi vuot tran hay trung noi dung khen thuong: van luu, phan vuot chi
        khong duoc tinh - xem TongHopTheoLoai[].CanhBao.
      operationId: keKhaiThanhTichLuuChiTiet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LuuChiTietKeKhaiThanhTichRequest"
      responses:
        "200":
          description: OK - tra ve ban ke sau khi luu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichItemResponse"
        "400":
          description: "INVALID / MUC_KHONG_HOP_LE - dong sai quy, thieu ten, so luong <= 0, muc da ngung su dung"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN - chi chinh chu duoc sua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "409":
          description: DONG_DA_CHOT - co dong da duoc chot, khong sua duoc nua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "422":
          description: THIEU_MINH_CHUNG - xem DongCoVanDe[] (moi dong co ThuTu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/chi-tiet/{idChiTiet}/minh-chung:
    post:
      tags:
        - KeKhaiThanhTich
      summary: Tai mot file PDF minh chung len cho MOT dong ke khai (multipart)
      description: >
        Chi nhan PDF, kiem hai lop (duoi file + chu ky '%PDF-').
        File luu ngoai webroot tai App_Data/uploads/ke-khai-thanh-tich, ten ngau nhien.
        Chi chinh chu, va chi khi DONG con sua duoc (gate theo DONG, khong theo trang
        thai ban ke): dong da chot -> DONG_DA_CHOT.
        DUNG CHO DONG DA CO. Dong CHUA TON TAI thi dung POST minh-chung-tam.
      operationId: keKhaiThanhTichUploadMinhChung
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tenHienThi:
                  type: string
                  description: "Bo trong = lay ten file goc (bo duoi)."
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "400":
          description: INVALID - khong phai PDF, tep rong, vuot gioi han dung luong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN - chi chinh chu duoc them minh chung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND - khong tim thay dong ke khai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "409":
          description: DONG_DA_CHOT - dong da duoc chot, khong them minh chung duoc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "415":
          description: INVALID - khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

  /api/ke-khai-thanh-tich/minh-chung-tam:
    post:
      tags:
        - KeKhaiThanhTich
      summary: Tai file PDF minh chung len KHO TAM, chua gan vao dong nao (multipart)
      description: >
        DUNG CHO DONG CHUA TON TAI. Minh chung la BAT BUOC voi muc co
        YeuCauMinhChung = true va bi chan ngay o buoc LUU, nhung dong chua ton tai thi
        chua co idChiTiet de gan file vao - day la duong pha vong khoa do.
        Luong: POST endpoint nay -> lay IdMinhChungTt trong response -> gui kem trong
        ChiTiet[i].IdMinhChung khi PUT chi-tiet. Server gan file vao dong vua tao
        trong cung transaction.
        File tam khong bao gio duoc gan se bi don sau 7 ngay.
        Cung mot bo kiem tra nhu upload theo dong (PDF hai lop, gioi han dung luong).
      operationId: keKhaiThanhTichUploadMinhChungTam
      parameters:
        - name: idNam
          in: query
          required: true
          description: "Chu so huu cua file tam la cap (nguoi tai len, idNam)."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tenHienThi:
                  type: string
                  description: "Bo trong = lay ten file goc (bo duoi)."
      responses:
        "201":
          description: Created - Item la MinhChungThanhTichDto voi IdChiTiet = null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "400":
          description: INVALID - khong phai PDF, tep rong, vuot gioi han, thieu idNam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "403":
          description: FORBIDDEN - khong co quyen tai minh chung len
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "404":
          description: NOT_FOUND - khong tim thay nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"
        "415":
          description: INVALID - khong phai multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiThanhTichResponse"

