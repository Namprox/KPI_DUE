  /api/nckh/dong-bo:
    post:
      tags:
        - Nckh
      summary: Dong bo du lieu NCKH tu API ngoai (theo nam)
      description: >-
        Keo du lieu KPI giang vien tu {NckhApiUrl}/api/kpilecturerdata (API tra TOAN BO
        lich su trong 1 lan goi) va luu vao DB KPI THEO NAM id_nam: upsert nckh_ho_so
        (khong xoa), refresh 4 bang chi tiet (bai bao / de tai / sach / ke khai khac)
        CHI TRONG PHAM VI nam id_nam, va ghi de snapshot tong hop + phan loai theo id_nam
        (phuc vu cham TC 18/19/20, 32-37, 40-42).
        Phan vung theo nam: bai bao & sach theo ngay_xuat_ban, ke khai khac theo ngay_ap_dung
        nam trong [ngay_bat_dau, ngay_ket_thuc] cua nam_danh_gia; de tai theo GIAO khoang
        thoi gian. Ban ghi thieu ngay (tru de tai) khong thuoc nam nao nen khong duoc nap.
        Du lieu cac nam khac GIU NGUYEN -> moi nam can cham phai duoc dong bo it nhat 1 lan.
        Anh xa ve nhan vien KPI qua EMAIL (LOWER+TRIM nhan_vien.email = nckh_ho_so.email).
        Neu API tra ve rong -> KHONG xoa du lieu cu (tranh mat du lieu khi API loi).
      operationId: nckhDongBo
      parameters:
        - name: id_nam
          in: query
          required: true
