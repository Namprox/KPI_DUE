    post:
      tags:
        - PhieuQuy
      summary: Truong phong duyet va CHOT DIEM phieu quy (2 -> 5)
      description: >
        Ca buoc duyet trong MOT lan goi, mot transaction: ap diem TP cham (neu co) ->
        ghi diem_chinh_thuc = COALESCE(diem_khoa, diem_tu_danh_gia, 0) -> khoa dong ->
        tinh tong diem -> dua phieu ve trang thai 5.

        XEP LOAI KHONG DUOC GHI — phieu quy khong co xep loai (chk_pdg_quy_khong_xep_loai).

        Quyen: TP / TK / TKL (+ ADMIN) TAI DUNG don vi cua phieu. TK/TKL nam trong danh
        sach vi vien chuc van phong Khoa co cap tren la Truong khoa chu khong phai
        Truong phong.

        Diem AM duoc phep: tieu chi vien chuc co the chi tru diem. Khoang hop le giong het
        POST /api/chitiet/{idChiTiet}/tu-danh-gia.

        Body.Diem bo trong = chap nhan nguyen diem nhan vien tu cham.
      operationId: phieuQuyTpDuyet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuQuyTpDuyetRequest"
      responses:
