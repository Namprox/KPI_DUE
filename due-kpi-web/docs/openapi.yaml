      description: >
        Xoa mem ban ghi (da_xoa = 1) roi xoa tep tren dia neu la LoaiMinhChung = 1.
        Rang buoc giong POST: ADMIN hoac TKK/TKP tai dung don vi cua phieu, va phieu
        phai o trang_thai = 1. Don tep la best-effort - tep xoa that bai khong lam
        hong request vi ban ghi da duoc danh dau da_xoa.
      operationId: minhChungDonViDelete
      parameters:
        - name: idMinhChung
