    TongHopKpiDto:
      type: object
      properties:
        SoPhieuThanhVien:
          type: integer
        SoXuatSac:
          type: integer
        SoHoanThanh:
          type: integer
        DiemTrungBinh:
          type: number
        TongDiemTruCaNhan:
          type: number
          description: >-
            T - tong diem tru cua cac GV thuoc Khoa trong nam (moi GV da ap tran
            15). Mau so cua ma cong thuc DIEM_TRU_TAP_THE.
        SoGiangVien:
          type: integer
          description: N - so giang vien dang hoat dong cua Khoa.
        SoGiangVienViPham:
          type: integer
          description: So giang vien co it nhat mot vi pham trong nam.
        MauSo:
          type: number
          description: 0.2 * 15 * SoGiangVien. Bang 0 thi DiemTruTapThe = 0.
        DiemTruTapThe:
          type: number
          description: >-
            MIN(7.5 * TongDiemTruCaNhan / MauSo, 7.5). Cung nguon so voi
            GET /api/vi-pham/diem-tru-khoa. Don vi khong phai Khoa: 0.
        DiemTbPhanHoiSv:
          type: number
          description: >-
            Diem TB phan hoi sinh vien trung binh TOAN KHOA (thang Likert 1-5):
            trung binh cac diem TB da chot cua TUNG giang vien thuoc Khoa, moi GV
            dem dung 1 lan. Co so cham ma cong thuc PHSV_DIEM_TB_KHOA:
            >= 3 -> 2.50 diem; tu 2 den duoi 3 -> 1.50 diem; duoi 2 -> 0 diem.
            Bang 0 khi chua chot du lieu (xem SoGvCoPhanHoi) hoac don vi khong
            phai Khoa.
        SoGvCoPhanHoi:
          type: integer
          description: >-
            So giang vien cua Khoa co diem TB phan hoi SV da chot trong nam.
            Bang 0 nghia la CHUA CHOT diem TB (hoac don vi khong phai Khoa) - dung
            gia tri nay de phan biet "0 diem vi diem thap" voi "0 diem vi thieu
            du lieu".
        SoLuotPhanHoi:
          type: integer
          description: >-
            Tong so luot tra loi khao sat gop vao DiemTbPhanHoiSv (moi sinh vien
            gop toi 12 dong / hoc phan) - KHONG phai so sinh vien.
        TyLeHoanThanhNckh:
          type: number
          description: >-
            Ty le (%) giang vien cua Khoa HOAN THANH NHIEM VU NCKH =
            SoGvHoanThanhNckh * 100 / SoGvThuocDienNckh. Co so cham ma cong thuc
            NCKH_TY_LE_HOAN_THANH_KHOA: tren 75 -> 20 diem; tren 65 den 75 -> 15
            diem; tren 50 den 65 -> 10 diem; tu 50 tro xuong -> 0 diem.
            Bang 0 khi chua dong bo gio NCKH (xem SoGvThuocDienNckh) hoac don vi
            khong phai Khoa.
        SoGvThuocDienNckh:
          type: integer
          description: >-
            MAU SO: so giang vien cua Khoa thuoc dien tinh = toan bo GV cua Khoa
            TRU SoGvMienNckh. Bang 0 nghia la CHUA DONG BO gio NCKH (hoac don vi
            khong phai Khoa) - luc do TyLeHoanThanhNckh ve 0 va tieu chi cham 0.
            FE dua vao day de phan biet "0 vi ty le thap" voi "0 vi thieu du lieu".
        SoGvHoanThanhNckh:
          type: integer
          description: >-
            TU SO: so giang vien DAT dinh muc gio NCKH (gio quy doi >= dinh muc) -
            dung dieu kien GV duoc DIEM TOI DA cua tieu chi ca nhan NCKH_GIO_TY_LE.
            GV khong co dong gio NCKH hoac thieu so lieu tinh la CHUA hoan thanh.
        SoGvMienNckh:
          type: integer
          description: >-
            So giang vien duoc MIEN NCKH (gio_nckh_dinh_muc <= 0 - du lieu that da
            khai bao), bi LOAI khoi mau so nen khong keo ty le cua Khoa xuong.
        SoBaiBaoWosScopus:
          type: integer
          description: >-
            TU SO cua ma cong thuc NCKH_BAI_BAO_TB_KHOA: so BAI BAO tap chi / ky yeu
            thuoc WoS-Scopus (danh muc SCIE / SSCI / AHCI / SCOPUS / ESCI, xuat ban
            trong nam danh gia) cua giang vien thuoc Khoa. Dem DISTINCT theo bai nen
            mot bai co NHIEU dong tac gia cung Khoa chi tinh MOT lan - day la so BAI
            THAT SU cua Khoa, khac cach cham ca nhan (moi dong tac gia deu duoc ghi
            nhan). Bang 0 khi chua goi POST /api/nckh/dong-bo cho nam do.
        SoBaiBaoTrenGv:
          type: number
          description: >-
            So bai bao WoS-Scopus TRUNG BINH tren 1 giang vien =
            SoBaiBaoWosScopus / SoGiangVien. Co so cham ma cong thuc
            NCKH_BAI_BAO_TB_KHOA: Diem = MIN(SoBaiBaoTrenGv, 1) * DiemToiDa, tuc TB
            1 bai/GV la tron diem tieu chi, tren nua van kep tran DiemToiDa. MAU SO
            la SoGiangVien o tren (cung vi tu dem voi DIEM_TRU_TAP_THE) nen khong tra
            ve lan hai. Bang 0 khi SoGiangVien = 0 (don vi khong phai Khoa) hoac chua
            dong bo bai bao - luc do tieu chi cham 0.
        SoBaiBaoQ1Q2:
          type: integer
          description: >-
            TU SO cua ma cong thuc NCKH_BAI_BAO_Q1Q2_TB_KHOA: phan bai co XepHangQ la
            Q1 hoac Q2 trong SoBaiBaoWosScopus o tren, nen LUON co
            SoBaiBaoQ1Q2 <= SoBaiBaoWosScopus. Lay tu CUNG ham voi hai field tren
            (fn_so_bai_bao_wos_scopus_khoa) nen dung chung vi tu WoS-Scopus, chung
            khung nam va chung mau so. Cung dem DISTINCT theo bai - mot bai Q1/Q2 co
            NHIEU dong tac gia cung Khoa chi tinh MOT lan; chi can MOT dong tac gia
            ghi Q1/Q2 la ca bai tinh la Q1/Q2. Bang 0 khi chua goi
            POST /api/nckh/dong-bo cho nam do.
        SoBaiQ1Q2TrenGv:
          type: number
          description: >-
            So bai bao Q1/Q2 TRUNG BINH tren 1 giang vien =
            SoBaiBaoQ1Q2 / SoGiangVien. Co so cham ma cong thuc
            NCKH_BAI_BAO_Q1Q2_TB_KHOA: Diem = MIN(SoBaiQ1Q2TrenGv, 1) * DiemToiDa,
            tuc TB 1 bai Q1/Q2 tren 1 GV la tron diem tieu chi, tren nua van kep tran.
            He so BAM DiemToiDa nen voi DiemToiDa = 50 thi TB 0.3 bai/GV ra dung 15
            diem. MAU SO la SoGiangVien o tren nen khong tra ve lan ba. LUU Y: bai
            Q1/Q2 duoc tinh o CA NCKH_BAI_BAO_TB_KHOA lan ma nay - day la CHU Y. Bang
            0 khi SoGiangVien = 0 (don vi khong phai Khoa) hoac chua dong bo bai bao -
            luc do tieu chi cham 0.
        TyLeTotNghiepDungHan:
          type: number
          description: >-
            Ty le (%) SV tot nghiep dung han cua Khoa = SoTotNghiepDungHan * 100 /
            (SoSvKhoaTotNghiep - SoThoiHocKhoaTotNghiep). Co so cham
            HV_TOT_NGHIEP_TREN_50_KHOA (> 50) va HV_TOT_NGHIEP_TREN_70_KHOA (> 70):
            dat -> du DiemToiDa, khong dat -> 0. Cung con so voi
            GET /api/hoc-vu/ty-le-khoa. Bang 0 khi mau so = 0 (chua import / MaKhoa
            chua anh xa) - luc do tieu chi cham 0.
        SoSvKhoaTotNghiep:
          type: integer
          description: So SV khoa xet tot nghiep (nam_nhap_hoc = idNam - 4), ke ca SV thoi hoc.
        SoThoiHocKhoaTotNghiep:
          type: integer
          description: So SV thoi hoc cua khoa xet tot nghiep - bi loai khoi ca tu lan mau.
        SoTotNghiepDungHan:
          type: integer
          description: Tu so - SV khoa xet tot nghiep, khong thoi hoc, co so hieu van bang.
        TyLeCanhBaoHocVu:
          type: number
          description: >-
            Ty le (%) SV bi canh bao hoc vu cua Khoa = SoSvBiCanhBao * 100 /
            (SoSvKhoaCanhBao - SoThoiHocKhoaCanhBao). Co so cham
            HV_CANH_BAO_DUOI_20_KHOA (< 20) va HV_CANH_BAO_DUOI_10_KHOA (< 10):
            dat -> du DiemToiDa, khong dat -> 0. LUU Y: bang 0 VA mau so = 0 la
            THIEU du lieu (tieu chi cham 0), KHONG phai 0% canh bao.
        SoSvKhoaCanhBao:
          type: integer
          description: So SV cac khoa xet canh bao (nam_nhap_hoc tu idNam - 3 den idNam), ke ca SV thoi hoc.
        SoThoiHocKhoaCanhBao:
          type: integer
          description: So SV thoi hoc cua cac khoa xet canh bao - bi loai khoi ca tu lan mau.
        SoSvBiCanhBao:
          type: integer
          description: Tu so - SV khong thoi hoc co it nhat 1 canh bao hoc vu trong idNam (dem 1 lan / SV).
