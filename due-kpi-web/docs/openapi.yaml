          items:
            $ref: "#/components/schemas/MauDanhGiaDiemTuDongItemDto"
    MauDanhGiaDiemTuDongItemDto:
      type: object
      properties:
        IdNhanVien:
          type: integer
        MaNhanVien:
          type: string
        HoTen:
          type: string
        Email:
          type: string
        MaNguoiDungNckh:
          type: integer
          nullable: true
          description: null = giảng viên chưa liên kết hệ thống NCKH qua email (điểm các mã hợp lệ = 0)
        IdTieuChi:
          type: integer
        TenTieuChi:
          type: string
        DiemToiDa:
          type: number
        CongThucTongHop:
          type: string
          description: >
            Mã công thức. Cá nhân: NCKH_BAI_Q1Q2, NCKH_BAI_WOS_SCOPUS,
            NCKH_CHU_BIEN_CHUYEN_KHAO, NCKH_THANH_VIEN_CHUYEN_KHAO,
            NCKH_CHU_BIEN_GIAO_TRINH, NCKH_THANH_VIEN_GIAO_TRINH,
            NCKH_CHU_BIEN_THAM_KHAO, NCKH_THANH_VIEN_THAM_KHAO,
            NCKH_CHU_NHIEM_NN, NCKH_CHU_NHIEM_BO_TINH, NCKH_DE_TAI_CO_SO,
            PHSV_DIEM_TB_GTE_3, VPGD_TUAN_THU, NVK_PHAN_CONG_KHOA,
            NCKH_GIO_TY_LE, NCKH_BBQT_DIEM_KPI,
            TTVT_SANG_KIEN, TTVT_KHEN_THUONG, TTVT_DAO_TAO, TTVT_PHONG_TRAO,
            VPVC_HOAN_THANH_CV, VPVC_NOI_QUY, VPVC_CHINH_TRI.

            Riêng NCKH_BBQT_DIEM_KPI: điểm KHÔNG do phía KPI tính — phía NCKH đã tính
            sẵn ở nckh_kpi_bai_bao_quoc_te.diem_kpi_cuoi (FinalKpiScore), phía KPI chỉ
            lấy nguyên con số đó, sàn ở 0 và chặn trần ở DiemToiDa.
        ApDungQuy:
          type: boolean
          description: >
            true = mã công thức này CÓ đọc bộ lọc quý (TTVT_* / VPVC_*), nên DiemTuDong
            là con số của riêng quý đã hỏi.
            false = mã khóa theo năm: DiemTuDong LUÔN là số trọn năm dù request có
            truyền quy hay không — FE nên gắn nhãn "trọn năm" cho những dòng này khi
            đang lọc theo quý, nếu không người xem sẽ tưởng đã được lọc.
        DiemTuDong:
          type: number
          nullable: true
          description: >
            diem_toi_da nếu đạt, 0 nếu không đạt, null nếu mã công thức chưa được hỗ trợ.

            Riêng VPGD_TUAN_THU (tuân thủ quy định giảng dạy) là điểm TRỪ dần, không
            phải đạt/không đạt: điểm = diem_toi_da (15) − tổng diem_tru của các vi phạm
            trong năm, sàn ở 0 (không có đường nào ép về 0);
            giảng viên KHÔNG có vi phạm nào được trọn điểm.

            Riêng NCKH_GIO_TY_LE (hoàn thành định mức giờ NCKH) là BẬC THANG theo tỷ lệ
            gio_nckh_quy_doi / gio_nckh_dinh_muc: ≥ 100% → diem_toi_da (40);
            > 75% và < 100% → diem_toi_da × 0.75 (30); > 50% và ≤ 75% → diem_toi_da × 0.50 (20);
            ≤ 50% → 0. Không có dòng trong nckh_gio_nckh của năm đó, hoặc định mức ≤ 0,
            hoặc giờ quy đổi null → 0.

            Riêng NCKH_BBQT_DIEM_KPI (KPI bài báo quốc tế) KHÔNG dùng bậc thang và cũng
            không phải đạt/không đạt: điểm = nckh_kpi_bai_bao_quoc_te.diem_kpi_cuoi lấy
            NGUYÊN VĂN từ phía NCKH, chỉ sàn ở 0 và chặn trần ở DiemToiDa. Phía KPI
            TUYỆT ĐỐI không tính lại từ Articles / TongDiemTacGia (quy đổi là nghiệp vụ
            bên NCKH). Không có dòng của năm đó, hoặc diem_kpi_cuoi null → 0.

            Riêng 3 mã VPVC_* (vi phạm của viên chức / NLĐ, theo từng nhóm) cũng là điểm
            TRỪ dần như VPGD_TUAN_THU, nhưng chỉ cộng các vi phạm THUỘC ĐÚNG MỘT NHÓM:
            VPVC_HOAN_THANH_CV = nhóm "Hoàn thành công việc" (trần trừ 70),
            VPVC_NOI_QUY = nhóm "Tuân thủ giờ giấc, tác phong, nội quy" (trần trừ 30),
            VPVC_CHINH_TRI = nhóm "Chính trị, tư tưởng" (KHÔNG áp trần).
            điểm = DiemToiDa − min(tổng diem_tru của nhóm trong năm, tran_diem_tru của nhóm),
            sàn ở 0. Con số trừ này khớp tuyệt đối với DiemTruSauTran của
            GET api/vi-pham/tong-hop-nhan-vien. Nhân viên KHÔNG có vi phạm nào thuộc nhóm
            đó được trọn điểm. Nhóm ↔ mã công thức nối nhau qua nhom_vi_pham.ma_nhom
            (seed trùng đúng mã công thức); nhóm chưa gán ma_nhom → không khớp vi phạm nào
            → trọn điểm.
        IdThangDiemChon:
          type: integer
          nullable: true
          description: >
            Mức thang điểm (thang_diem.id_thang_diem) mà engine SẼ gán khi chấm thật —
            preview dùng đúng quy tắc của sp_phieu_cham_tu_dong_apply nên không bao giờ lệch.
            Chỉ ánh xạ cho tiêu chí RỜI RẠC (loai_thang_diem = 1) và khớp CHÍNH XÁC
            gia_tri_diem = DiemTuDong.
            null khi tiêu chí không rời rạc (VPGD_TUAN_THU và 3 mã VPVC_* là loại liên
            tục) hoặc điểm không trùng mức nào. Ánh xạ KHÔNG làm thay đổi điểm số.
        DieuKienDiem:
          type: string
          nullable: true
          description: Nhãn hiển thị của mức trên (thang_diem.dieu_kien_diem), vd "Có bài Q1/Q2". null khi IdThangDiemChon null.
        ThangDiem:
          type: array
          description: >
            TOÀN BỘ các mức thang điểm của tiêu chí này, sắp theo ThuTuHienThi.
            Luôn khác null — mảng rỗng nghĩa là tiêu chí chưa khai thang điểm
            (ví dụ các tiêu chí NCKH loại Có/Không).
            Mức đang được chọn có DaChon = true và IdThangDiem trùng IdThangDiemChon;
            khi IdThangDiemChon null thì mọi phần tử đều có DaChon = false.
            FE dùng mảng này để vẽ cả thang và tô sáng mức đạt được, không cần gọi
            thêm GET /api/thangdiem?tieuChiId=.
          items:
            $ref: "#/components/schemas/MauDanhGiaThangDiemMucDto"
        MinhChung:
          type: array
          description: >
            Các bản ghi nguồn đã tạo ra điểm của tiêu chí này (với VPGD_TUAN_THU là các
            vi phạm đã TRỪ điểm). Luôn khác null.
            Rỗng khi không đạt HOẶC khi gọi không kèm idNhanVien
            (với VPGD_TUAN_THU, rỗng nghĩa là không có vi phạm = trọn điểm).
          items:
            $ref: "#/components/schemas/MauDanhGiaMinhChungDto"
        DuLieuGioNckh:
          allOf:
            - $ref: "#/components/schemas/NckhGioNckhItem"
          nullable: true
          description: >
            CHỈ xuất hiện khi CongThucTongHop = NCKH_GIO_TY_LE — dòng nckh_gio_nckh
            ĐÃ SINH RA DiemTuDong, để FE hiển thị được cách tính thay vì một con số
            trần trụi (TyLeHoanThanh = gio_nckh_quy_doi / gio_nckh_dinh_muc × 100 là
            con số quyết định bậc điểm — xem mô tả DiemTuDong ở trên).
            Cùng shape với item của GET /api/nckh/gio-nckh nên FE dùng chung 1 bộ parser.
            Server chọn dòng bằng đúng mệnh đề của fn_nckh_diem_tu_dong (khớp
            nhan_vien.email = nckh_gio_nckh.email LOWER+TRIM, g.id_nam = năm của mẫu,
            TOP 1 ORDER BY ma_nguoi_dung_nckh) nên luôn là dòng đã tạo ra điểm.
            VẮNG MẶT (NullValueHandling.Ignore) khi tiêu chí dùng mã công thức khác,
            hoặc không tìm thấy dòng khớp — trường hợp sau xem LyDoDiemTuDong.
        DuLieuBaiBaoQuocTe:
          allOf:
            - $ref: "#/components/schemas/NckhBaiBaoQuocTeItem"
          nullable: true
          description: >
            CHỈ xuất hiện khi CongThucTongHop = NCKH_BBQT_DIEM_KPI — dòng
            nckh_kpi_bai_bao_quoc_te ĐÃ SINH RA DiemTuDong, để FE đối chiếu con số điểm
            với dữ liệu gốc phía NCKH (DiemKpiCuoi chính là điểm, kèm TongDiemTacGia,
            TongBaiWosScopus, CoQ1Q2, SoBaiBao và mảng BaiBao chi tiết).
            Server chọn dòng bằng đúng mệnh đề của fn_nckh_diem_tu_dong (khớp
            nhan_vien.email = nckh_kpi_bai_bao_quoc_te.email LOWER+TRIM, b.id_nam = năm
            của mẫu, TOP 1 ORDER BY ma_nguoi_dung_nckh) nên luôn là dòng đã tạo ra điểm.
            Bản thân trường này KHÔNG phụ thuộc idNhanVien, nhưng trường con BaiBao thì
            CÓ — xem mô tả trong NckhBaiBaoQuocTeItem.
            VẮNG MẶT (NullValueHandling.Ignore) khi tiêu chí dùng mã công thức khác,
            hoặc không tìm thấy dòng khớp — trường hợp sau xem LyDoDiemTuDong.
        LyDoDiemTuDong:
          type: string
          nullable: true
          description: >
            CHỈ xuất hiện khi CongThucTongHop = NCKH_GIO_TY_LE hoặc NCKH_BBQT_DIEM_KPI,
            VÀ điểm bằng 0 vì DỮ LIỆU NGUỒN chứ không phải vì giảng viên không đạt — hai
            trường hợp này đều ra 0 nhưng cách xử lý khác hẳn nhau.

            Lý do với NCKH_GIO_TY_LE: nhân viên chưa có email (không đối chiếu được),
            không tìm thấy dòng giờ NCKH của năm mẫu khớp email (chưa đồng bộ hoặc lệch
            năm), định mức ≤ 0 / trống, chưa có giờ quy đổi.

            Lý do với NCKH_BBQT_DIEM_KPI: nhân viên chưa có email, không tìm thấy dòng
            KPI bài báo quốc tế của năm mẫu khớp email, chưa có diem_kpi_cuoi.
            Lưu ý DiemKpiCuoi = 0 là KẾT QUẢ THẬT (có dòng nhưng chưa đạt điểm nào) nên
            KHÔNG sinh lý do.

            VẮNG MẶT khi đủ dữ liệu để tính — khi đó FE tự diễn giải từ
            DuLieuGioNckh.TyLeHoanThanh / DuLieuBaiBaoQuocTe.DiemKpiCuoi.
    MauDanhGiaThangDiemMucDto:
      type: object
      description: >
        1 mức trong thang điểm của tiêu chí. Danh mục mức là thuộc tính của TIÊU CHÍ,
        nhưng DaChon là cờ RIÊNG của từng dòng (giảng viên × tiêu chí) vì mức được chọn
        phụ thuộc điểm của chính giảng viên đó.
      properties:
        IdThangDiem:
          type: integer
        GiaTriDiem:
          type: number
        DieuKienDiem:
          type: string
          nullable: true
          description: Mô tả điều kiện đạt mức, vd "Điểm đánh giá phản hồi của sinh viên >= 3".
        ThuTuHienThi:
          type: integer
        DaChon:
          type: boolean
          description: true = mức này khớp với DiemTuDong của dòng hiện tại (IdThangDiem = IdThangDiemChon).
    MauDanhGiaMinhChungDto:
      type: object
      description: 1 dòng minh chứng gọn, đủ để xem qua ngay trên lưới điểm tự động
      properties:
        LoaiNguon:
          type: integer
          description: >
            1: Bài báo, 2: Sách, 3: Đề tài, 4: Phản hồi sinh viên,
            5: Vi phạm giảng dạy (minh chứng TRỪ điểm của tiêu chí VPGD_TUAN_THU),
            6: Nhiệm vụ Khoa phân công (NVK_PHAN_CONG_KHOA),
            7: Thành tích vượt trội (4 mã TTVT_*),
            8: Việc chưa tuân thủ của viên chức/NLĐ — minh chứng TRỪ điểm của 3 mã
            VPVC_*, chỉ liệt kê vi phạm THUỘC ĐÚNG NHÓM của mã công thức đang xét.
            Lưu ý với 5 và 8: danh sách rỗng KHÔNG có nghĩa là không đạt — không có
            vi phạm nào tức là trọn điểm. Riêng 8, tổng các dòng có thể LỚN HƠN phần
            điểm thực sự bị trừ khi tổng vượt trần trừ của nhóm (70 / 30).
          enum: [1, 2, 3, 4, 5, 6, 7, 8]
        TenLoaiNguon:
          type: string
          example: Bài báo
        MaNguon:
          type: integer
          nullable: true
          description: >
            Mã bản ghi bên hệ thống nguồn
            (ma_bai_bao_nguon / ma_sach_nguon / ma_de_tai_nguon / id_diem_tb / id_vi_pham)
        TieuDe:
          type: string
        MoTa:
          type: string
          description: Mô tả gộp 1 dòng
          example: SCIE - Q2 - Psychology & Marketing
        Ngay:
          type: string
          format: date-time
          nullable: true
          description: >
            Ngày xuất bản (bài báo/sách), ngày bắt đầu (đề tài), ngày chốt (phản hồi SV)
            hoặc ngày vi phạm (vi phạm giảng dạy)
