        (du lieu hien co ca cac nam 2021-2026).
        Moi dong luu snapshot: ho ten, email, don vi, hoc vi (DegreeName), hoc ham (AcademicRank), chuc danh nghe nghiep (JobTitle), diem dat duoc (AchievedScore), ky bao cao
        (Period), gio chuan (StandardHours), ty le giam (ReductionPercentage), dinh muc
        gio NCKH (RequiredHours), gio NCKH quy doi (ConvertedHours).
        Neu API tra ve rong -> KHONG xoa du lieu cu (tranh mat du lieu khi API loi).
        Du lieu nay chi phuc vu DOI CHIEU khi danh gia - KHONG tu dong ghi vao gio_thuc_hien_gv.
      operationId: nckhGioNckhDongBo
