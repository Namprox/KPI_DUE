  /api/gio-giang-import:
    get:
      tags:
        - GioGiangImport
      summary: Get all (loc theo ky hoc)
      description: >-
        Danh sach ban ghi gio giang import. Truyen query kyHoc (261/262/263)
        de loc theo ky hoc; bo trong = tat ca cac ky.
      operationId: gioGiangImportGetAll
      parameters:
        - name: kyHoc
          in: query
          required: false
          description: "Ky hoc: 261 = nam hoc 2025-2026 ky 1; 262 = ky 2; 263 = ky he. Bo trong = tat ca."
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
    post:
      tags:
        - GioGiangImport
      summary: Create (tao tay 1 ban ghi)
      description: Nguoi import (id_nguoi_import) lay tu token, khong nhan tu body.
      operationId: gioGiangImportCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GioGiangImportCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "400":
          description: Bad Request (ho ten trong, ky hoc khong hop le, ...)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
  /api/gio-giang-import/export:
    get:
      tags:
        - GioGiangImport
      summary: Export gio giang ra file Excel
      description: >-
        Xuat danh sach gio giang import ra file .xlsx (mot sheet, co dong tieu de).
        Truyen query kyHoc (261/262/263) de loc theo ky hoc; bo trong = tat ca cac ky.
        Tra ve file dinh kem; neu kyHoc khong hop le tra JSON loi (GioGiangImportResponse).
      operationId: gioGiangImportExport
      parameters:
        - name: kyHoc
          in: query
          required: false
          description: "Ky hoc: 261 = nam hoc 2025-2026 ky 1; 262 = ky 2; 263 = ky he. Bo trong = tat ca."
          schema:
            type: integer
      responses:
        "200":
          description: OK — file Excel dinh kem (gio-giang[-{kyHoc}].xlsx).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request (ky hoc khong hop le)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
  /api/gio-giang-import/import:
    post:
      tags:
        - GioGiangImport
      summary: Import gio giang tu file Excel
      description: >-
        Upload file Excel "Tong hop gio giang" va field kyHoc (261/262/263).
        Server tu dong dinh dong tieu de, ghep Ho lot + Ten, doc cac cot gio,
        gan ky_hoc va nguoi import (tu token). Chay all-or-nothing: 1 dong loi
        thi rollback toan bo.
      operationId: gioGiangImportImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xls / .xlsx) theo mau "Tong hop gio giang".
                kyHoc:
                  type: integer
                  description: "Ky hoc: 261/262/263 (2 so dau = nam hoc, so cuoi = ky)."
              required:
                - file
                - kyHoc
      responses:
        "200":
          description: OK — tra ImportedCount = so dong da luu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "400":
          description: Bad Request (thieu file/kyHoc, khong doc duoc Excel, du lieu khong hop le)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "409":
          description: Conflict — import that bai o mot dong (da rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "415":
          description: Unsupported Media Type (khong phai multipart/form-data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
  /api/gio-giang-import/{id}:
    get:
      tags:
        - GioGiangImport
      summary: Get by id
      operationId: gioGiangImportGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
    put:
      tags:
        - GioGiangImport
      summary: Update (khong doi nguoi import)
      operationId: gioGiangImportUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GioGiangImportUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
    delete:
      tags:
        - GioGiangImport
      summary: Xóa cứng ban ghi (bang phu, khong co FK phu thuoc)
      operationId: gioGiangImportDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GioGiangImportResponse"
components:
  parameters:
    LoaiDoiTuongFilter:
      name: loaiDoiTuong
      in: query
      required: false
      description: "Loc theo loai doi tuong: 1=Giang vien, 2=Vien chuc/NLD, 3=Khoa, 4=Phong/hanh chinh. Bo trong = tat ca."
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 4
  schemas:
    LichSuTrangThaiPhieuDto:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        IdPhieu:
          type: integer
        LanDanhGia:
          type: integer
        TrangThaiTruoc:
          type: integer
          nullable: true
          description: NULL only on the initial creation row
        TrangThaiSau:
          type: integer
          enum: [1, 2, 3, 4, 5]
        HanhDong:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 Submit, 2 Approve & forward, 3 Return, 4 Chot, 5 Mo lai
        CapThucHien:
          type: integer
          nullable: true
          enum: [1, 2, 3]
          description: 1 GV, 2 Khoa, 3 Truong; NULL when system-initiated
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        LyDo:
          type: string
          nullable: true
        NhanXet:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    LichSuTrangThaiResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/LichSuTrangThaiPhieuDto"
    LichSuChamDiemDto:
      type: object
      properties:
        IdLichSu:
          type: integer
          format: int64
        IdChiTiet:
          type: integer
        IdPhieu:
          type: integer
        LanDanhGia:
          type: integer
        Cap:
          type: integer
          enum: [1, 2, 3]
          description: 1 Tu DG, 2 Khoa, 3 Truong
        HanhDong:
          type: integer
          enum: [1, 2, 3]
          description: 1 Cham, 2 Sua, 3 Chot
        Diem:
          type: number
          nullable: true
        NhanXet:
          type: string
          nullable: true
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    LichSuChamDiemGroupDto:
      type: object
      description: One bucket = (LanDanhGia, IdChiTiet, Cap). Entries are the rows in chronological order.
      properties:
        LanDanhGia:
          type: integer
        IdChiTiet:
          type: integer
        Cap:
          type: integer
        Entries:
          type: array
          items:
            $ref: "#/components/schemas/LichSuChamDiemDto"
    LichSuChamDiemResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/LichSuChamDiemGroupDto"
    DemTrangThaiDto:
      type: object
      properties:
        TrangThai:
          type: integer
        SoLuong:
          type: integer
    DemXepLoaiDto:
      type: object
      properties:
        XepLoai:
          type: string
        SoLuong:
          type: integer
    BaoCaoTongQuanDto:
      type: object
      properties:
        IdNam:
          type: integer
        IdDonVi:
          type: integer
          nullable: true
        TongSoPhieu:
          type: integer
        DemTheoTrangThai:
          type: array
          items:
            $ref: "#/components/schemas/DemTrangThaiDto"
        DemTheoXepLoai:
          type: array
