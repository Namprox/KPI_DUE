        1 dòng KPI bài báo quốc tế theo năm (bảng nckh_kpi_bai_bao_quoc_te), đã ghép với
        nhân viên KPI qua email — bảng nguồn KHÔNG có cột id_nhan_vien và KHÔNG có FK
        sang nckh_ho_so nên ánh xạ bằng email ngay lúc đọc (cùng quy ước với
        NckhGioNckhItem).
        Điểm ở đây do PHÍA NCKH tính sẵn (DiemKpiCuoi) — phía KPI không tính lại.
      properties:
        MaNguoiDungNckh:
          type: integer
        IdNhanVien:
          type: integer
          nullable: true
        MaNhanVien:
          type: string
          nullable: true
        HoTen:
          type: string
          nullable: true
        Email:
          type: string
          nullable: true
        IdNam:
          type: integer
          description: = tham số 'year' của lần gọi API đồng bộ (payload NCKH không có trường năm).
        TongBaiWosScopus:
          type: integer
          nullable: true
          description: Tổng số bài báo thuộc danh mục WoS / Scopus trong năm.
