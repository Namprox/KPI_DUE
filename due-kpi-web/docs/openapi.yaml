          type: string
          nullable: true
        IdNguoiXepLoai:
          type: integer
          nullable: true
        NgayXepLoai:
          type: string
          format: date-time
          nullable: true
        DuDieuKienXuatSac:
          type: boolean
          nullable: true
          description: >-
            loai_doi_tuong = 1 AND xep_loai_khoa = 3 AND muc_nckhcn_qd838 = 2. Chi nhung
            nguoi nay moi tranh han ngach 20%.
        RowVersion:
          type: string
          format: byte
          nullable: true
    LichSuToTrinhDto:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        IdToTrinh:
          type: integer
        LanTrinh:
          type: integer
        TrangThaiTruoc:
          type: integer
          nullable: true
        TrangThaiSau:
          type: integer
        HanhDong:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 Dong goi, 2 Trinh HT, 3 HT duyet, 4 HT tra ve, 5 Mo lai goi
        HanhDongText:
          type: string
          nullable: true
          readOnly: true
        SoHoSoTraVe:
          type: integer
          nullable: true
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        LyDo:
          type: string
          nullable: true
        NhanXet:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    ToTrinhKhoaDongHangDto:
      type: object
      description: Chi tiet the be tac DONG_HANG o ranh gioi han ngach 20%
      properties:
        HanNgachXuatSac:
          type: integer
        SoGiangVien:
          type: integer
        SoSuatConLai:
          type: integer
          description: So suat con lai sau khi tru nhung nguoi diem CAO HON diem ranh gioi
        SoNguoiDongHang:
          type: integer
          description: So nguoi cung diem ranh gioi dang tranh so suat con lai
        SoNguoiDaUuTien:
          type: integer
          description: >-
            Trong so do, bao nhieu nguoi da duoc TK danh dau uu tien. Dong goi chi di tiep
            khi so nay BANG DUNG SoSuatConLai.
        DiemRanhGioi:
          type: number
    ToTrinhKhoaResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        ErrorCode:
          type: string
          nullable: true
          description: >-
            CHUA_DU_HO_SO / DONG_HANG / TO_TRINH_DA_TRINH / INVALID_STATE / FORBIDDEN /
            NOT_FOUND / TY_LE_KHONG_HOP_LE / DANH_SACH_RONG / HO_SO_KHONG_HOP_LE /
            KHONG_CO_HO_SO / TRAN_LAN_TRINH
        Item:
          $ref: "#/components/schemas/ToTrinhKhoaDto"
        Items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToTrinhKhoaDto"
        HoSo:
          type: array
          nullable: true
          description: >-
            Nghia thay doi theo ket qua - dong-goi thanh cong: toan bo ho so trong goi;
            CHUA_DU_HO_SO: ho so chua duoc TK chot; DONG_HANG: nhung nguoi dong diem;
            ht-tra-lai: ho so vua bi tra ve.
          items:
            $ref: "#/components/schemas/ToTrinhKhoaPhieuDto"
        DongHang:
          $ref: "#/components/schemas/ToTrinhKhoaDongHangDto"
        TongSoDong:
          type: integer
          nullable: true
    ToTrinhKhoaDongGoiRequest:
      type: object
      required:
        - RowVersion
      properties:
        TyLeXuatSac:
          type: number
          nullable: true
          example: 0.2
          description: >-
            NULL = giu ty le dang luu tren goi (mac dinh 0.2000). Khoang hop le (0, 1].
            Chi truyen khi nam do co quy dinh ty le khac.
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaTrinhRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
          maxLength: 1000
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaHtDuyetRequest:
      type: object
      required:
        - RowVersion
      properties:
        NhanXet:
          type: string
          nullable: true
          maxLength: 2000
        RowVersion:
          type: string
          format: byte
    ToTrinhKhoaHtTraLaiRequest:
      type: object
      required:
        - LyDo
        - RowVersion
      properties:
        IdPhieuList:
          type: array
          description: >-
            BAT BUOC co it nhat 1 phan tu. Moi id phai thuoc dung goi nay va dang o trang
            thai 4. Cac ho so KHONG duoc chon giu nguyen trang thai 4.
          items:
            type: integer
        LyDo:
          type: string
          maxLength: 1000
        RowVersion:
          type: string
          format: byte
  securitySchemes:
    bearerAuth:
      type: http
