            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NckhSachListResponse"
  /api/nckh/ke-khai-khac:
    get:
      tags:
        - Nckh
      summary: Danh sach ke khai khac NCKH (Noi dung NCKH, toan thoi gian)
      description: >-
        Danh sach cac ke khai khac (huong dan SV NCKH, chuyen giao cong nghe, so huu tri tue,
        dien gia hoi thao...). Loc theo giang vien (tuy chon) + keyword (ten_noi_dung). Phan trang.
      operationId: nckhGetKeKhaiKhacList
      parameters:
        - name: id_nhan_vien
          in: query
          required: false
          schema:
            type: integer
        - name: keyword
          in: query
          required: false
          description: Tim theo ten_noi_dung (ContentName) - LIKE.
          schema:
            type: string
        - name: id_nam
          in: query
          required: false
          description: >-
            Loc theo nam danh gia (vd 2026): chi lay ke khai co ngay_ap_dung nam trong khoang
            [ngay_bat_dau, ngay_ket_thuc] cua nam_danh_gia. Ke khai thieu ngay_ap_dung bi loai khi loc theo nam.
            Bo trong = tich luy toan thoi gian.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NckhKeKhaiKhacListResponse"
  /api/cau-hinh/nhiem-vu-khoa:
    get:
      tags:
        - NhiemVuKhoa
      summary: Cau hinh module nhiem vu theo phan cong cua Khoa
      description: >
        Tra tran diem cua nhom nhiem vu (20 theo quy che), bo 3 vai tro kem muc diem
        dang hieu luc, 7 nhom cong tac co dinh va gioi han upload.
        Doc tu CUNG NGUON voi luc cham diem (fn_nhiem_vu_khoa_tran_diem va
        danh_muc_vai_tro_pvcd) nen khong the lech voi ket qua tinh toan.
        Truyen idDonVi/idNam de lay muc diem rieng cua Khoa/nam do (neu Khoa co cau
        hinh rieng); bo trong = bo mac dinh toan truong.
        Co LechCauHinh = true khi diem_toi_da cua tieu chi KPI khac tran cua module.
      operationId: cauHinhNhiemVuKhoa
      parameters:
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
        - name: idNam
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CauHinhNhiemVuKhoaResponse"
        "401":
          description: Thieu hoac sai token

  /api/nhiem-vu-khoa/ky:
    get:
      tags:
        - NhiemVuKhoa
      summary: Ky nhiem vu cua (nam x Khoa) + tong quan + 7 nhom
      description: |
        Ky chi co 2 trang thai: 1 dang mo (Khoa sua tu do, GV phan hoi tu do),
        2 da chot (khoa ghi toan bo). Trang thai duyet gan vao KY chu khong gan vao
        tung ban ghi phan cong.
        Ky duoc TAO LUOI: endpoint nay tu tao neu chua co, Khoa khong phai bam "mo ky".
        HanPhanHoi het han KHONG khoa gi - chi la nhan hien thi ("khong len tieng =
        dong y"); chi TrangThai = 2 moi khoa ghi.
      operationId: nhiemVuKhoaGetKy
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - Item = ky, Nhom = 7 nhom cong tac kem so nhiem vu da nhap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "400":
          description: Don vi khong phai la Khoa (KHONG_PHAI_KHOA) hoac tham so sai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
    put:
      tags:
        - NhiemVuKhoa
      summary: Dat han phan hoi / ghi chu, hoac mo lai ky da chot
      description: |
        MoLai = true dua ky tu 2 ve 1, bat buoc co LyDo, va chi TK/TKL/TP/ADMIN duoc
        thuc hien (TLGVK khong duoc). Ky da chot thi thao tac duy nhat hop le la mo lai.
        XoaHan = true uu tien hon HanPhanHoi (go han ve khong gioi han).
      operationId: nhiemVuKhoaSetKy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KyNhiemVuKhoaSetRequest"
      responses:
        "200":
          description: OK - ky sau khi cap nhat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "400":
          description: Thieu LyDo khi mo lai, hoac tham so sai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "403":
          description: Khong co quyen (mo lai doi TK/TKL/TP/ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT - phai mo lai truoc khi sua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/cua-toi:
    get:
      tags:
        - NhiemVuKhoa
      summary: Bang diem nhiem vu cua chinh giang vien dang dang nhap
      description: >
        Khong gate vai tro - id lay tu token, ai cung xem duoc cua minh.
        Tra header (trang thai ky, han phan hoi, TongDiemThucTe + TongDiemQuyDoi),
        danh sach nhiem vu duoc gan kem vai tro / diem / minh chung cap nhiem vu,
        va cac phan hoi da gui cua chinh GV.
        Khoa chua mo ky thi van tra header voi Items rong.
      operationId: nhiemVuKhoaCuaToi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaCuaToiResponse"
        "400":
          description: Id nam khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/giang-vien:
    get:
      tags:
        - NhiemVuKhoa
      summary: Giang vien cua Khoa kem san tong diem hien tai
      description: >
        Dung cho o chon nguoi khi phan cong - FE thay ngay ai sap cham tran ma khong
        phai goi them API cho tung nguoi. Mot truy van duy nhat (LEFT JOIN bang tong
        hop), khong N+1.
        Moi dong tra CA HAI con so: TongDiemThucTe va TongDiemQuyDoi = MIN(thuc te, tran).
      operationId: nhiemVuKhoaGiangVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
        - name: tuKhoa
          in: query
          required: false
          description: Loc theo ho ten hoac ma nhan vien
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiangVienDiemResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/tong-hop:
    get:
      tags:
        - NhiemVuKhoa
      summary: Bang tong hop toan Khoa (man hinh chot + nguon cho Excel)
      description: >
        Gom CA giang vien chua duoc phan cong nhiem vu nao, de Khoa thay cho trong.
        SoNhiemVuTheoNhom la map id_nhom_nv -> so luong (server tra dang long, C# pivot).
        VuotTran chi la canh bao hien thi, khong chan luu va khong chan chot.
      operationId: nhiemVuKhoaTongHop
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaTongHopResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/kiem-tra-chot:
    get:
      tags:
        - NhiemVuKhoa
      summary: Kiem tra dieu kien truoc khi chot ky
      description: |
        Tra danh sach chi tiet tung van de con ton. LoaiVanDe:
          1 CHAN - nhiem vu co phan cong nhung thieu chu tri
          2 CHAN - nhiem vu chua phan cong cho ai
          3 CHAN - phan hoi chua xu ly
          4 CANH BAO - giang vien vuot tran diem (chi hien thi, KHONG chan chot)
          5 CANH BAO - lech cau hinh: diem_toi_da cua tieu chi KPI khac tran cua module
        CoTheChot = true khi khong con van de loai 1/2/3 VA nguoi goi co quyen chot.
      operationId: nhiemVuKhoaKiemTraChot
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KiemTraChotResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Ky nhiem vu chua duoc mo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/chot:
    post:
      tags:
        - NhiemVuKhoa
      summary: Chot ky nhiem vu cua Khoa
      description: >
        Chi TK/TKL/TP trong pham vi don vi hoac ADMIN (TLGVK KHONG duoc chot).
        SP tu tinh lai dieu kien chan, khong tin ket qua man hinh kiem-tra-chot ma
        client vua xem (du lieu co the doi giua hai lan goi).
        Sau khi chot, ky khoa ghi toan bo: sua nhiem vu / gui phan hoi / them minh
        chung deu tra 409 KY_DA_CHOT.
      operationId: nhiemVuKhoaChot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhiemVuKhoaChotRequest"
      responses:
        "200":
          description: OK - ky sau khi chot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "403":
          description: FORBIDDEN - khong phai truong don vi / Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Ky nhiem vu chua duoc mo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT - ky da duoc chot truoc do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "422":
          description: CHOT_KHONG_HOP_LE - con van de chan (xem kiem-tra-chot)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/export:
    get:
      tags:
        - NhiemVuKhoa
      summary: Xuat bang tong hop toan Khoa ra Excel de ky
      description: >
        File .xlsx mot sheet, cot dong theo 7 nhom cong tac. Bao cao dung cot
        "Tong diem quy doi" = MIN(thuc te, tran); cot "Tong diem thuc te" van hien
        de nguoi ky thay ai bi cat bao nhieu.
        Ten file: NhiemVuKhoa_{maDonVi}_{idNam}.xlsx
      operationId: nhiemVuKhoaExport
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - file Excel dinh kem
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          description: Khong co quyen xem Khoa nay (tra JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/lich-su:
    get:
      tags:
        - NhiemVuKhoa
      summary: Nhat ky toan ky (ai sua vai tro / diem, luc nao)
      description: |
        HanhDong: 1 Tao nhiem vu, 2 Sua nhiem vu, 3 Xoa nhiem vu, 4 Them phan cong,
        5 Doi vai tro/diem, 6 Go phan cong, 7 Chot ky, 8 Mo lai ky, 9 Xu ly phan hoi.
        Dong hanh dong 5 mang day du VaiTroTruoc/VaiTroSau va DiemTruoc/DiemSau.
      operationId: nhiemVuKhoaLichSuKy
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuNhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/phan-hoi:
    post:
      tags:
        - NhiemVuKhoa
      summary: Giang vien gui phan hoi (co the kem file PDF trong cung request)
      description: |
        multipart/form-data - CO Y khong dung JSON de "mot endpoint gui phan hoi co kem
        file" dung nghia (.NET 4.0 khong co duong nao khac de vua nhan truong text vua
        nhan file trong cung mot request). FE luon dung FormData ke ca khi khong co file.
        loaiPhanHoi = 1 (sai vai tro) BAT BUOC co idNhiemVuKhoa tro toi mot nhiem vu
        cua chinh ky do; loaiPhanHoi = 2 (thieu nhiem vu) chi co idNhomNv goi y.
        Giang vien CHI tao duoc phan hoi, KHONG tu tao duoc nhiem vu.
        File la TUY CHON va duoc dinh kem SAU khi phan hoi da luu, nen loi upload
        khong lam mat noi dung phan hoi vua gui.
      operationId: nhiemVuKhoaTaoPhanHoi
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                idNam:
                  type: integer
                loaiPhanHoi:
                  type: integer
                  description: "1 = sai vai tro, 2 = thieu nhiem vu"
                idNhiemVuKhoa:
                  type: integer
                  description: "Bat buoc khi loaiPhanHoi = 1"
                idNhomNv:
                  type: integer
                  description: "Goi y nhom khi loaiPhanHoi = 2"
                noiDung:
                  type: string
                tenHienThi:
                  type: string
                  description: "Ten hien thi cua file dinh kem"
                file:
                  type: string
                  format: binary
                  description: "PDF, tuy chon"
              required:
                - idNam
                - loaiPhanHoi
                - noiDung
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiNhiemVuKhoaResponse"
        "400":
          description: Thieu truong bat buoc / loaiPhanHoi sai / file khong phai PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khoa chua mo ky cua nam nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "415":
          description: Yeu cau phai la multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
    get:
      tags:
        - NhiemVuKhoa
      summary: Danh sach phan hoi cua ky (phia Khoa)
      operationId: nhiemVuKhoaGetPhanHoi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: "1 = cho xu ly, 2 = da xu ly. Bo trong = tat ca."
          schema:
            type: integer
      responses:
        "200":
          description: OK - moi dong kem san minh chung cap phan hoi (khong N+1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiNhiemVuKhoaListResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/phan-hoi/{idPhanHoi}/xu-ly:
    post:
      tags:
        - NhiemVuKhoa
      summary: Khoa danh dau phan hoi da xu ly (hoac mo lai)
      description: >
        Phan hoi con o trang thai "cho xu ly" la MOT TRONG BA dieu kien CHAN chot ky.
        MoLai = true tra phan hoi ve trang thai cho xu ly.
      operationId: nhiemVuKhoaXuLyPhanHoi
      parameters:
        - name: idPhanHoi
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhanHoiXuLyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhanHoiNhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xu ly phan hoi cua Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay phan hoi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/phan-hoi/{idPhanHoi}/minh-chung:
    post:
      tags:
        - NhiemVuKhoa
      summary: Bo sung minh chung cho mot phan hoi (cap 2)
      description: >
        Chu nhan phan hoi tu bo sung file bat cu luc nao khi ky con mo; nguoi nhap
        cua Khoa cung them duoc. Chi nhan PDF, kiem 2 lop (duoi file + chu ky '%PDF-').
      operationId: nhiemVuKhoaUploadMinhChungPhanHoi
      parameters:
        - name: idPhanHoi
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tenHienThi:
                  type: string
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungNhiemVuKhoaResponse"
        "400":
          description: Khong phai PDF hop le / vuot gioi han dung luong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "403":
          description: Khong phai chu nhan phan hoi va khong co quyen nhap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "415":
          description: Yeu cau phai la multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/{id}/lich-su:
    get:
      tags:
        - NhiemVuKhoa
      summary: Nhat ky cua mot nhiem vu
      operationId: nhiemVuKhoaLichSu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuNhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay ky hoac nhiem vu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/{id}/minh-chung:
    post:
      tags:
        - NhiemVuKhoa
      summary: Tai len minh chung CAP NHIEM VU (cap 1, dung chung cho ca nhom)
      description: >
