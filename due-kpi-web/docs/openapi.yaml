components:
  schemas:
    LichSuTrangThaiPhieuDto:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        IdPhieu:
          type: integer
        LanDanhGia:
          type: integer
        TrangThaiTruoc:
          type: integer
          nullable: true
          description: NULL only on the initial creation row
        TrangThaiSau:
          type: integer
          enum: [1, 2, 3, 4, 5]
        HanhDong:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 Submit, 2 Approve & forward, 3 Return, 4 Chot, 5 Mo lai
        CapThucHien:
          type: integer
          nullable: true
          enum: [1, 2, 3]
          description: 1 GV, 2 Khoa, 3 Truong; NULL when system-initiated
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        LyDo:
          type: string
          nullable: true
        NhanXet:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    LichSuTrangThaiResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/LichSuTrangThaiPhieuDto"
    LichSuChamDiemDto:
      type: object
      properties:
        IdLichSu:
          type: integer
          format: int64
        IdChiTiet:
          type: integer
        IdPhieu:
          type: integer
        LanDanhGia:
          type: integer
        Cap:
          type: integer
          enum: [1, 2, 3]
          description: 1 Tu DG, 2 Khoa, 3 Truong
        HanhDong:
          type: integer
          enum: [1, 2, 3]
          description: 1 Cham, 2 Sua, 3 Chot
        Diem:
          type: number
          nullable: true
        NhanXet:
          type: string
          nullable: true
        IdNguoiThucHien:
          type: integer
        TenNguoiThucHien:
          type: string
          nullable: true
        NgayThucHien:
          type: string
          format: date-time
    LichSuChamDiemGroupDto:
      type: object
      description: One bucket = (LanDanhGia, IdChiTiet, Cap). Entries are the rows in chronological order.
      properties:
        LanDanhGia:
          type: integer
        IdChiTiet:
          type: integer
        Cap:
          type: integer
        Entries:
          type: array
          items:
            $ref: "#/components/schemas/LichSuChamDiemDto"
    LichSuChamDiemResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/LichSuChamDiemGroupDto"
    DemTrangThaiDto:
      type: object
      properties:
        TrangThai:
          type: integer
        SoLuong:
          type: integer
    DemXepLoaiDto:
      type: object
      properties:
        XepLoai:
          type: string
        SoLuong:
          type: integer
    BaoCaoTongQuanDto:
      type: object
      properties:
        IdNam:
          type: integer
        IdDonVi:
          type: integer
          nullable: true
        TongSoPhieu:
          type: integer
        DemTheoTrangThai:
          type: array
          items:
            $ref: "#/components/schemas/DemTrangThaiDto"
        DemTheoXepLoai:
          type: array
          items:
            $ref: "#/components/schemas/DemXepLoaiDto"
    BaoCaoTongQuanResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Item:
          $ref: "#/components/schemas/BaoCaoTongQuanDto"
    BaoCaoDiemTrungBinhDto:
      type: object
      properties:
        IdDonVi:
          type: integer
        MaDonVi:
          type: string
          nullable: true
        TenDonVi:
          type: string
          nullable: true
        SoPhieu:
          type: integer
        DiemTrungBinh:
          type: number
          nullable: true
        DiemThapNhat:
          type: number
          nullable: true
        DiemCaoNhat:
          type: number
          nullable: true
    BaoCaoDiemTrungBinhResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/BaoCaoDiemTrungBinhDto"
    BaoCaoChuaHoanTatDto:
      type: object
      properties:
        IdPhieu:
          type: integer
        IdNam:
          type: integer
        IdNhanVien:
          type: integer
        MaNhanVien:
          type: string
          nullable: true
        HoTen:
          type: string
          nullable: true
        IdDonVi:
          type: integer
        TenDonVi:
          type: string
          nullable: true
        TrangThai:
          type: integer
          enum: [1, 2, 3, 4]
        LanDanhGia:
          type: integer
        NgayTao:
          type: string
          format: date-time
          nullable: true
        NgayGui:
          type: string
          format: date-time
          nullable: true
        SoNgayTroi:
          type: integer
          description: DATEDIFF(DAY, ngay_tao, NOW())
    BaoCaoChuaHoanTatResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
        Items:
          type: array
          items:
            $ref: "#/components/schemas/BaoCaoChuaHoanTatDto"
