        Tra them 2 truong dan xuat: DatDinhMuc (GioNckhQuyDoi >= GioNckhDinhMuc) va
        TyLeHoanThanh (%). Sap xep: nam moi nhat truoc, trong cung nam thi chua dat
        dinh muc len truoc, roi den ho ten.
      operationId: nckhGetGioNckhList
      parameters:
        - name: id_nam
          in: query
          required: false
          description: "Nam cua dong du lieu (= truong Year phia NCKH, vd: 2025). Bo trong = lay tat ca cac nam."
          schema:
            type: integer
        - name: id_nhan_vien
          in: query
          required: false
          description: Loc 1 giang vien cu the (nhan_vien.id_nhan_vien). Bo trong = tat ca.
          schema:
            type: integer
        - name: keyword
          in: query
          required: false
          description: Tim theo ho_ten / ma_nhan_vien (LIKE).
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
