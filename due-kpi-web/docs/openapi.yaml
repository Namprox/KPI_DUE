  /api/tham-dinh/pending:
    get:
      tags:
        - ThamDinh
      summary: Hang doi tham dinh theo DONG
      description: |
        Khac han GET /api/phieu/khoa/pending (hang doi theo PHIEU): don vi vao day thay
        DUNG NHUNG DONG minh phai xu ly, khong phai ca ho so cua nguoi khac. Mot phieu
        co the xuat hien NHIEU LAN (nhieu tieu chi thuoc cung don vi) hoac khong lan
        nao (dong cua phieu do da chot het).

        Chi lay dong o trang_thai_dong = 2 CHO_THAM_DINH, phieu o trang thai 2, va bo
        qua tieu chi cham tu dong.

        Pham vi don vi - giong het quy tac cham: tieu chi CO dong trong
        tieu_chi_don_vi_cham -> chi don vi duoc giao thay; tieu chi CHUA phan quyen ->
        don vi chu quan cua nguoi duoc danh gia thay; ADMIN thay toan bo.

        Kiem nhiem: "don vi cua nguoi dang nhap" = MOI don vi ma ho thuc su giu chuc vu
        TK/TKL/TP (+ cay don vi cap duoi), khong chi don vi trong JWT. Don vi ma ho chi
        la thanh vien (giang day, khong giu chuc vu) KHONG vao hang doi nay. Xem muc
        phan quyen o dau tai lieu.

        THU TU: dong tung bi Truong khoa tra ve tham dinh lai (NguonTraVe = 3) LUON len
        dau - do la viec dang chan ca ho so o giai doan 3.
      operationId: thamDinhGetPending
      parameters:
        - name: idNam
          in: query
          schema:
            type: integer
        - name: idNhanVien
          in: query
          schema:
            type: integer
        - name: idTieuChi
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sortBy
          in: query
          description: "moi_nhat = nop sau len truoc; cu_nhat (mac dinh) = FIFO"
          schema:
            type: string
            enum: [moi_nhat, cu_nhat]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThamDinhPendingResponse"
        "403":
          description: Chi don vi tham dinh (TK/TKL/TP) hoac ADMIN moi xem duoc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThamDinhPendingResponse"
  /api/to-trinh-khoa:
    get:
      tags:
        - ToTrinhKhoa
      summary: Danh sach goi KPI Khoa
      description: |
        GIAI DOAN 4. Moi (id_nam, id_don_vi) co dung MOT goi (UNIQUE).

        Pham vi: HT/ADMIN xem tat ca; nguoi thuoc mot don vi xem duoc HEADER goi cua
        don vi do (endpoint nay CO Y khong loc theo chuc vu - de doc chi tiet goi thi
        GET /api/to-trinh-khoa/{id} moi doi TK/TKL/TP).

        Kiem nhiem: "don vi cua toi" la MOI don vi trong pham vi cua nguoi dung (+ cay
        don vi cap duoi), khong chi don vi trong JWT - xem muc phan quyen o dau tai lieu.

        Kem tien do SoHoSo / SoHoSoDaChot - hai con so nay tinh theo (id_nam, id_don_vi)
        chu KHONG theo id_to_trinh: ho so chua chot thi id_to_trinh con NULL, dem theo
        id_to_trinh se luon bao "da du 100%".
      operationId: toTrinhKhoaGetPaged
      parameters:
        - name: idNam
          in: query
          schema:
            type: integer
        - name: idDonVi
          in: query
          schema:
            type: integer
        - name: trangThai
          in: query
          description: "1 DANG_TONG_HOP, 2 DA_DONG_GOI, 3 DA_TRINH, 4 HT_DA_DUYET, 5 HT_TRA_VE"
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/to-trinh-khoa/{id}:
    get:
      tags:
        - ToTrinhKhoa
      summary: Chi tiet mot goi KPI Khoa (header + danh sach ho so + lich su)
      description: |
        HoSo[] lay theo (id_nam, id_don_vi) chu khong theo id_to_trinh, de HIEN CA ho so
        CHUA chot - do chinh la danh sach Truong khoa phai xu ly truoc khi dong goi duoc.

        Moi ho so kem co DuDieuKienXuatSac - xet theo LOAI DOI TUONG cua chinh nguoi do:
        loai_doi_tuong = 1 can (xep_loai_khoa = 3 AND muc_nckhcn_qd838 = 2);
        loai_doi_tuong = 2 chi can xep_loai_khoa = 3 (vien chuc khong co QD 838).
        LUU Y: du dieu kien KHONG bao dam co suat - he thong cat Top theo han ngach TRUOC
        roi moi loc dieu kien, nen nguoi du dieu kien ma nam ngoai Top van khong len muc 4.

        Moi ho so cung kem NhomXepHang (snapshot lan dong goi gan nhat, NULL neu chua tung
        dong goi) va NhomHienTai (tinh live - dung cai nay cho man hinh xem truoc).

        Nhom[] la han ngach theo tung nhom, moi dong co CA ve snapshot lan ve hien tai;
        so sanh hai ve de biet snapshot da cu chua. Rong = goi legacy truoc dot tach 3 nhom.

        SoGiangVienHienTai / SoNguoiMuc3HienTai la so lieu HIEN TAI cua don vi; doi chieu
        voi ban snapshot de biet han ngach cu con dung khong.
      operationId: toTrinhKhoaGetDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Khong co quyen xem goi KPI cua don vi nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "404":
          description: Khong tim thay to trinh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/to-trinh-khoa/{id}/dong-goi:
    post:
      tags:
        - ToTrinhKhoa
      summary: Dong goi to trinh - tinh han ngach 20%, nang muc Xuat sac, HOAN TAT ho so thuong
      description: |
        GIAI DOAN 4. DAY LA NOI DUY NHAT ghi phieu_danh_gia.xep_loai = 4.

        LUONG DUYET TACH DOI — BUOC NAY NAY LA MOC HOAN TAT CUA HO SO THUONG.
        KPI cua nhan vien / giang vien chi can Truong khoa (TK/TKL) hoac Truong phong (TP)
        duyet la xong. Nhung xep_loai cuoi cung (ke ca muc 4) chi tinh duoc khi 100% ho so
        cua don vi da chot, vi han ngach 20% xep hang tren TOAN DON VI — nen moc HOAN TAT cua
        ho so thuong la buoc dong goi nay, KHONG phai buoc TK bam "Chot ho so" (3 -> 4).
        FE KHONG duoc hien "Da hoan tat" ngay sau khi chot ho so.

        THUAT TOAN:
        1. Doi 100% ho so cua (nam, don vi) o trang thai 4 HOAC 5. Con ho so o 1/2/3 -> 409
           CHUA_DU_HO_SO kem danh sach ai con thieu trong HoSo[].
           (Truoc day chi chap nhan trang thai 4. Nay phai chap nhan ca 5 vi ho so thuong
           da HOAN TAT o lan dong goi truoc — giu dieu kien cu thi moi lan dong goi LAI deu
           bao CHUA_DU_HO_SO vinh vien. FE tu dem tien do thi cung phai dem ca 4 va 5,
           hoac dung Item.SoHoSoDaChot do backend tra.)
        2. PHAN HOACH BA NHOM LOAI TRU NHAU trong tung don vi:
           * nhom 1 Giang vien thuong  - loai_doi_tuong = 1, chuc vu NOT IN
                                         {TK,TKL,PTK,PTKL,TP,PTP}
           * nhom 2 Vien chuc / NLD    - loai_doi_tuong = 2, chuc vu NOT IN bo 6 ma
           * nhom 3 Can bo quan ly     - chuc vu IN bo 6 ma (bat ke loai_doi_tuong)
           Moi nguoi tranh DUNG MOT han ngach. Han ngach nhom 3 tinh RIENG trong tung
           don vi, KHONG gop toan truong. Nhom khong co ai thi khong sinh dong nao.
        3. BA MAU SO KHAC NHAU - bat doi xung CO CHU Y, FE dung tu suy mau so:
           * nhom 1 -> SoMauSo = so nguoi da chot muc 3
           * nhom 2 -> SoMauSo = TONG dau nguoi trong nhom
           * nhom 3 -> SoMauSo = TONG so quan ly cua don vi
           HanNgach = MAX(1, FLOOR(SoMauSo x TyLeXuatSac)); SoMauSo = 0 thi bang 0.
           "Toi thieu mot suat" la ngoai le nghiep vu da xac nhan: nhom 1-4 nguoi se vuot
           ty le 20% tren thuc te (nhom 3 nguoi => 1 suat = 33%).
           Doc mang Nhom[] trong response de lay so lieu tung nhom.
        4. XAC DINH TOP TRUOC, XET DIEU KIEN SAU - KHONG LAP SUAT.
           Xep hang tren TOAN BO quan the cua nhom theo (tong diem DESC, uu tien DESC,
           id ASC), cat Top dung bang han ngach, ROI MOI loc dieu kien muc 4.
           Nguoi trong Top ma thieu dieu kien thi GIU MUC 3 va suat do BO TRONG - KHONG
           don xuong nguoi ke tiep.
           Vi du: han ngach 2, hang 1 khong dat QD 838 muc 2, hang 2 dat, hang 3 dat
           => CHI hang 2 len muc 4. Hang 3 khong nhan suat cua hang 1.
           => SoDat DUOC PHEP nho hon HanNgach. FE phai hien duoc ca hai con so.
           Dieu kien muc 4 xet theo LOAI DOI TUONG cua chinh nguoi do:
           * loai_doi_tuong = 1 -> xep_loai_khoa = 3 AND muc_nckhcn_qd838 = 2
           * loai_doi_tuong = 2 -> xep_loai_khoa = 3 (vien chuc khong co QD 838)
        5. Dong hang o ranh gioi Top, CHI CHAN KHI KET QUA THUC SU DOI:
           * so nguoi dong hang DU DIEU KIEN <= so suat con lai -> khong chan (moi nguoi
             du dieu kien chac chan co suat, ket qua duy nhat)
           * da danh dau uu tien dung bang so suat con lai -> khong chan
           * nguoc lai -> 409 DONG_HANG. He thong CO Y khong tu tie-break.
           Dong hang co the no o TOI DA 3 NHOM CUNG LUC: SP xet het roi bao loi MOT LAN.
           Khoi DongHang mo ta nhom co so hieu NHO NHAT; doc mang DongHangNhom de biet
           het. HoSo[] la nguoi dong hang cua TAT CA nhom bi chan, kem co du_dieu_kien.
        6. Ghi xep_loai = 4 cho nguoi trung suat, = xep_loai_khoa cho nhung nguoi con
           lai; HangTrongKhoa la thu hang TRONG NHOM (tren toan bo quan the nhom, khong
           phai chi trong nhom du dieu kien) va KHONG CON NULL voi vien chuc;
           NhomXepHang = snapshot nhom; gan id_to_trinh cho moi phieu trong goi.
        7. MOI — day ho so THUONG (CanHtDuyet = false) tu 4 -> 5 HOAN TAT: ghi id_nguoi_chot,
           ngay_chot_ket_qua, snapshot diem vao lich_su_cham_diem (cap 4 Truong khoa) va
           mot dong lich_su_trang_thai_phieu (hanh_dong 4 Chot, cap_thuc_hien 4).
           KHONG ghi id_nguoi_dg_truong / ngay_truong_duyet — Hieu truong khong tham gia.
           Ho so LANH DAO (CanHtDuyet = true) O LAI trang thai 4.
        8. MOI — trang thai goi cuoi cung re nhanh theo so ho so lanh dao con lai:
           * con > 0  -> goi = 2 (DA_DONG_GOI), lich su hanh_dong = 1. FE hien nut
                        "Trinh Hieu truong".
           * con = 0  -> goi = 4 (HT_DA_DUYET) TU DONG HOAN TAT, id_nguoi_duyet de NULL,
                        lich su hanh_dong = 6. Don vi khong co ho so lanh dao nao nen
                        khong con gi de trinh. FE PHAI AN nut "Trinh Hieu truong".
           Doc SoHoSoChoHt trong response de re nhanh, dung doan tu Item.TrangThai.

        RESPONSE bo sung SoHoSoHoanTat + SoHoSoChoHt + mang Nhom[] (han ngach tung nhom);
        Message da duoc backend soan san, da bao gom tom tat tung nhom va so suat bo trong
        (vd "Dong goi to trinh thanh cong. 28 ho so da hoan tat, 3 ho so lanh dao cho
        Hieu truong duyet. Han ngach theo nhom: Giang vien 1/2 suat (mau so 10); Vien chuc
        / NLD 1/1 suat (mau so 8). Con 1 suat bo trong do nguoi trong Top chua du dieu kien
        — suat khong don xuong nguoi ke tiep.") — nen hien thang thay vi FE tu ghep chuoi.
        HoSo[] bo sung CanHtDuyet + NhomXepHang.

        CHAY LAI DUOC nhieu lan: goi o trang thai 2 (da dong goi), 5 (HT tra ve), hoac 4
        TU DONG HOAN TAT (id_nguoi_duyet IS NULL) deu dong goi lai duoc, ket qua ghi de.
        Goi da trinh HT (3) hoac da duoc HT duyet THAT (4 + id_nguoi_duyet IS NOT NULL)
        thi chan — thong diep loi khac nhau cho hai truong hop trang thai 4.

        CANH BAO NGHIEP VU: dong goi LAI co the HA xep loai cua ho so DA HOAN TAT. Them ho
        so moi vao don vi lam mau so han ngach doi => buoc 6 ghi de xep_loai cho TOAN BO
        phieu cua don vi, ke ca phieu dang o trang thai 5; mot nguoi dang Xuat sac co the
        rot ve Hoan thanh tot. Day la he qua toan hoc khong tranh duoc cua viec cho ho so
        xong som o cap TK trong khi han ngach van tinh tren toan don vi — KHONG phai loi.
        Bien do con rong hon vi hai ly do: luat bo-lap-suat co the LAM GIAM so nguoi dat
        muc 4 ngay ca khi thanh phan nhom khong doi; va mot nguoi DOI NHOM (vd duoc bo
        nhiem PTK) lam doi mau so cua HAI nhom cung luc.
        SP ghi mot dong lich_su_trang_thai_phieu (truoc = sau = 5, hanh_dong = 4) neu ro
        muc cu -> muc moi kem ten nhom va mau so, cho moi phieu bi doi. FE nen hien dialog
        xac nhan khi goi da tung dong goi truoc do (Item.NgayDongGoi != null).

        TyLeXuatSac HIEN KHOA CUNG O 0.2000: de trong = 0.2000, gia tri khac tra 400
        TY_LE_KHONG_HOP_LE. Tham so va cot DB van giu (khong hardcode) vi quy dinh co the
        doi theo nam va to trinh cu phai tra cuu lai duoc ty le da dung.
      operationId: toTrinhKhoaDongGoi
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToTrinhKhoaDongGoiRequest"
      responses:
        "200":
          description: OK - HoSo[] la toan bo ho so trong goi kem xep_loai / hang cuoi cung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "400":
          description: Ty le xuat sac khac 0.2000 (TY_LE_KHONG_HOP_LE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Chi truong don vi cua goi moi duoc dong goi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "409":
          description: >-
            Conflict - con ho so chua chot (CHUA_DU_HO_SO, kem HoSo[]), dong hang o ranh
            gioi Top (DONG_HANG, kem DongHang + DongHangNhom[] + HoSo[]), goi da trinh HT
            (INVALID_STATE), don vi khong co ho so (KHONG_CO_HO_SO), hoac concurrency
            conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/to-trinh-khoa/{id}/trinh:
    post:
      tags:
        - ToTrinhKhoa
      summary: Truong khoa trinh goi HO SO LANH DAO len Hieu truong (goi 2 -> 3)
      description: |
        GIAI DOAN 4. lan_trinh += 1. Sau buoc nay goi bi KHOA: khong sua xep loai, khong
        chi dinh uu tien, khong tra dong ve tham dinh duoc nua cho toi khi HT duyet hoac
        tra ve.

        LUONG DUYET TACH DOI: goi luc nay CHI con ho so LANH DAO (CanHtDuyet = true) o
        trang thai 4 — ho so thuong da HOAN TAT (trang thai 5) tu buoc dong goi.

        Fail-closed MOI: goi khong con ho so nao o trang thai 4 -> 409
        KHONG_CO_HO_SO_LANH_DAO. Ve ly thuyet dong goi da chuyen thang goi sang trang
        thai 4 trong truong hop nay nen FE xu ly dung (an nut "Trinh Hieu truong" khi
        SoHoSoChoHt = 0) thi khong gap loi nay — van phai bat de khong roi vao handler
        loi chung.
      operationId: toTrinhKhoaTrinh
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToTrinhKhoaTrinhRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Chi truong don vi cua goi moi duoc trinh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "409":
          description: >-
            Conflict - goi khong o trang thai 2 (INVALID_STATE), dat gioi han so lan
            trinh (TRAN_LAN_TRINH), goi khong con ho so nao thuoc dien Hieu truong duyet
            (KHONG_CO_HO_SO_LANH_DAO — MOI), hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/to-trinh-khoa/{id}/ht-duyet:
    post:
      tags:
        - ToTrinhKhoa
      summary: Hieu truong duyet goi - HO SO LANH DAO 4 -> 5 HOAN_TAT (goi 3 -> 4)
      description: |
        GIAI DOAN 4. Day la buoc THAY THE POST /api/phieu/{id}/chot cu (chot le tung
        phieu): mot lenh duyet dua cac ho so con lai trong goi vao HOAN_TAT.

        LUONG DUYET TACH DOI — CONTRACT KHONG DOI nhung Y NGHIA HEP LAI. SP loc
        p.trang_thai = 4, ma sau khi dong goi thi tap do CHINH XAC la ho so LANH DAO
        (TK/TKL/PTK/PTKL/TP/PTP). Ho so thuong da o trang thai 5 tu buoc dong goi va
        KHONG bi anh huong boi lenh nay.

        FE sua label: day KHONG con la "duyet toan bo KPI cua Khoa" ma la "duyet ho so
        LANH DAO cua Khoa". Man hinh xac nhan neu hien "se hoan tat N ho so" thi N la so
        ho so lanh dao, khong phai toan Khoa.

        Chi HT (ma_chuc_vu = HT) hoac ADMIN. Truong khoa KHONG tu duyet goi cua minh.

        diem_chinh_thuc KHONG duoc ghi o day - no da duoc ghi tu luc TUNG DONG chot o
        giai doan 2. Server van snapshot vao lich_su_cham_diem de co moc "diem chinh
        thuc tai thoi diem HOAN_TAT" (con so dung de tra luong/thuong).
      operationId: toTrinhKhoaHtDuyet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToTrinhKhoaHtDuyetRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Chi Hieu truong moi duoc duyet goi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "409":
          description: Conflict - goi khong o trang thai 3 (INVALID_STATE) hoac concurrency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
  /api/to-trinh-khoa/{id}/ht-tra-lai:
    post:
      tags:
        - ToTrinhKhoa
      summary: Hieu truong tra ve MOT DANH SACH ho so (goi 3 -> 5, ho so duoc chon 4 -> 3)
      description: |
        GIAI DOAN 4. Cac phieu duoc chon: 4 -> 3 (ve tay Truong khoa), xoa xep_loai +
        hang_trong_khoa (ket qua dong goi khong con hieu luc voi ho so nay), ghi
        ly_do_ht_tra_ve. xep_loai_khoa GIU NGUYEN de TK thay minh da chon gi ma sua.

        Cac phieu KHAC trong goi GIU NGUYEN trang thai 4 - do la ca diem cua thiet ke:
        HT khong phai tra ve ca Khoa chi vi 1 ho so co van de.

        id_to_trinh cua phieu bi tra ve GIU NGUYEN: ho so van thuoc goi nay, chi la phai
        lam lai. Truong khoa chot lai (3 -> 4) roi dong goi lai (5 -> 2) roi trinh lai.

        IdPhieuList bat buoc co it nhat 1 phan tu; moi id phai thuoc dung goi nay va
        dang o trang thai 4.

        LUONG DUYET TACH DOI — CONTRACT KHONG DOI nhung PHAM VI HEP LAI. Chi ho so o
        trang thai 4 tra ve duoc, ma do chinh la ho so LANH DAO. Ho so thuong da HOAN TAT
        (trang thai 5) tu buoc dong goi nen truyen id cua chung se nhan HO_SO_KHONG_HOP_LE.
        Dung nghiep vu: ho so thuong da dong, muon dong vao phai dung
        POST /api/phieu/{id}/mo-lai.

        => FE: o man hinh HT chon ho so de tra ve, CHI cho tick nhung dong co
        TrangThai = 4; dong trang thai 5 hien read-only.
      operationId: toTrinhKhoaHtTraLai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToTrinhKhoaHtTraLaiRequest"
      responses:
        "200":
          description: OK - HoSo[] la danh sach ho so vua bi tra ve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "400":
          description: Danh sach rong (DANH_SACH_RONG) hoac thieu ly do (THIEU_LY_DO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "403":
          description: Chi Hieu truong moi duoc tra ve goi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"
        "409":
          description: >-
            Conflict - goi khong o trang thai 3 (INVALID_STATE), danh sach chua ho so
            khong thuoc goi hoac khong o trang thai 4 (HO_SO_KHONG_HOP_LE, kem HoSo[]),
            hoac concurrency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToTrinhKhoaResponse"

  # ===========================================================================
  # KE KHAI GIO QUY DOI THEO PHU LUC II
  # "Quy doi cac hoat dong chuyen mon ra gio chuan giang day".
  # Giang vien TU KE KHAI so luong tung dau viec; TK/TKL/TP duyet hoac tu choi
  # TUNG DONG va duoc sua so luong truoc khi chot.
  #
  # Cong thuc: gio = ROUND(SoLuong * HeSoQuyDoi / SoLuongMau, 2).
  # He so LUON do server lay tu danh muc - client KHONG bao gio gui so gio len.
  # ===========================================================================
  /api/cong-viec-quy-doi:
    get:
      tags:
        - CongViecQuyDoi
      summary: Cay danh muc dau viec quy doi (PHU LUC II)
      description: >
        Moi nguoi dang nhap deu doc duoc (giang vien can danh sach de ke khai).
        Cay toi da 4 cap, do sau KHONG deu: la co the nam o cap 2
        ("Huong dan de an mon hoc" = 2,0/sinh vien), cap 3 hoac cap 4
        ("Chu tich" trong mot hoi dong). CHI nut co LaLa = true moi ke khai duoc.
        Seed chuan cua PHU LUC II: 74 dong, trong do 52 dau viec ke khai duoc.
      operationId: congViecQuyDoiGetTree
      parameters:
        - name: chiLa
          in: query
          required: false
          description: "1 = chi tra cac dau viec ke khai duoc (LaLa = true). Dung cho o chon khi giang vien nhap."
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: "1 = chi dang hoat dong, 0 = chi da ngung. Bo trong = tat ca."
          schema:
            type: integer
      responses:
        "200":
          description: OK - danh sach phang da sap xep theo cay, kem DuongDanTen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CongViecQuyDoiListResponse"
    post:
      tags:
        - CongViecQuyDoi
      summary: Them mot dau viec vao danh muc (chi ADMIN)
      description: >
        Danh muc la van ban quy dinh cua Truong nen CHI ADMIN duoc sua - khong de
        tung Khoa tu doi he so. Cap KHONG nhan tu client: server suy ra tu cha
        (goc = 1), toi da 4 cap.
        Neu LaLa = true thi HeSoQuyDoi BAT BUOC va phai >= 0; neu LaLa = false thi
        server tu don HeSoQuyDoi ve null cho khop CHECK chk_dmcvqd_la.
      operationId: congViecQuyDoiCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CongViecQuyDoiCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CongViecQuyDoiItemResponse"
        "400":
          description: VALIDATION - thieu ma/ten, SoLuongMau < 1, hoac la thieu he so
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN_CHUC_VU - khong phai ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND - khong tim thay cong viec cha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: DUPLICATE_MA - ma cong viec da ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/cong-viec-quy-doi/{id}:
    put:
      tags:
        - CongViecQuyDoi
      summary: Sua mot dau viec (chi ADMIN)
      description: >
        KHONG doi duoc cha / cap - doi cha la doi ca cay con nen bat tao moi cho ro rang.
        Sua HeSoQuyDoi KHONG hoi to: moi dong ke khai giu snapshot he so rieng, nen ban
        ke da luu giu nguyen so lieu cu.
        Chan bien mot dau viec DANG duoc ke khai thanh nut gom (LaLa false) -> DANG_SU_DUNG.
      operationId: congViecQuyDoiUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CongViecQuyDoiUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CongViecQuyDoiItemResponse"
        "400":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN_CHUC_VU - khong phai ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: DUPLICATE_MA hoac DANG_SU_DUNG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
    delete:
      tags:
        - CongViecQuyDoi
      summary: Ngung su dung mot dau viec - SOFT (chi ADMIN)
      description: >
        Dat trang_thai = 0, KHONG xoa vat ly. Ban ke da luu giu nguyen so lieu (co
        snapshot rieng); ban ke dang NHAP con tro toi dau viec nay se bi chan o buoc
        luu voi ma CONG_VIEC_KHONG_HOP_LE.
        Chan khi con nut con dang hoat dong - Admin phai ngung tu la len.
      operationId: congViecQuyDoiDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN_CHUC_VU - khong phai ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: CO_CON_HOAT_DONG - con dau viec con dang hoat dong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/cua-toi:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Ban ke khai cua giang vien trong mot nam
      description: >
        VONG DOI NAM O TUNG DONG, khong o ban ke. Khong co buoc "nop": giang vien ke
        toi dau nguoi duyet thay toi do, va ke them duoc BAT KY LUC NAO trong nam.
        TrangThai cua header chi la NHAN dan xuat tu cac dong:
        4 con dong bi tra ve | 2 con dong cho duyet | 3 moi dong da chot | 1 chua co dong.

        LAZY-CREATE: endpoint nay KHONG tao ban ke. Chua co thi tra ve header AO voi
        IdKeKhai = 0, ChiTiet rong, RowVersion null - hinh dang du lieu van y het.
        Ban ke chi sinh ra khi PUT /api/ke-khai-gio-quy-doi/chi-tiet luu dong dau tien.
        FE phai chap nhan IdKeKhai = 0 nghia la "chua co gi", khong phai loi.

        Quyen: server tra san ChoPhepSua / ChoPhepDuyet o header (quyen thuan) va
        ChoPhepSua / ChoPhepXet o TUNG DONG (da xet ca trang thai dong).
      operationId: keKhaiGioQuyDoiCuaToi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idNhanVien
          in: query
          required: false
          description: "Xem ban ke cua nguoi khac (can quyen duyet). Bo trong = cua chinh minh."
          schema:
            type: integer
      responses:
        "200":
          description: >-
            OK - header + ChiTiet[] + minh chung da gom san vao tung dong.
            IdKeKhai = 0 khi giang vien chua luu dong nao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiItemResponse"
        "400":
          description: INVALID - thieu hoac sai nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - khong co quyen xem ban ke nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia hoac giang vien
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/chi-tiet:
    put:
      tags:
        - KeKhaiGioQuyDoi
      summary: Luu TOAN BO cac dong cua ban ke (mot form, mot lan luu)
      description: >
        Gui len TOAN BO danh sach dong; server tu tinh diff them / sua / go.
        Chi CHINH CHU sua duoc, nhung KHONG con phu thuoc trang thai ban ke - dieu
        kien nam o TUNG DONG:

        * Dong CHO DUYET (1) va TRA VE (3): sua / go binh thuong. Dong dang bi tra ve
          ma GV sua thi TU DONG quay ve CHO DUYET, dong thoi xoa SoLuongDuyet /
          GioDuyet / NhanXetDuyet. Chi reset khi dong THAT SU doi (IdCongViec, SoLuong,
          KyHoc hoac MoTa) - luu ca form khong lam mat nhan xet tren dong chua dung toi.
        * Dong DA CHOT (2): KHOA. Gui len de sua -> 409 DONG_DA_CHOT. Vang mat trong
          danh sach thi VAN GIU NGUYEN, khong bi go. Muon sua phai nho nguoi duyet mo
          lai qua POST /{id}/duyet-chi-tiet.

        Nho vay giang vien VAN KE THEM DUOC sau khi da chot het - day la kich ban ma
        thiet ke cu (chot ca ban ke = khoa cung ca nam) lam hong.

        LAZY-CREATE: day la noi DUY NHAT tao header. Chua co ban ke thi request dau
        tien tao luon, khong con loi "ban ke chua duoc mo".
        Danh sach rong = go het dong con sua duoc.
        Client KHONG gui so gio: server lay he so tu danh muc roi tinh
        ROUND(SoLuong * HeSo / SoLuongMau, 2). Snapshot he so chi duoc lam moi khi
        IdCongViec cua dong DOI - giu nguyen dau viec thi giu nguyen he so cu.
      operationId: keKhaiGioQuyDoiLuuChiTiet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LuuChiTietKeKhaiRequest"
      responses:
        "200":
          description: OK - ban ke sau khi luu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiItemResponse"
        "400":
          description: >-
            INVALID (so luong <= 0, ky hoc sai, dong khong thuoc ban ke nay) hoac
            CONG_VIEC_KHONG_HOP_LE (tro toi nut gom / dau viec da ngung su dung)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - chi chinh chu duoc sua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: >-
            DONG_DA_CHOT - co dong gui len dang o TrangThaiDong = 2. Khong dong nao
            duoc ghi (kiem toan bo truoc khi ghi, khong ghi mot phan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/chi-tiet/{idChiTiet}/minh-chung:
    post:
      tags:
        - KeKhaiGioQuyDoi
      summary: Tai len minh chung PDF cho MOT dong ke khai (tuy chon)
      description: >
        Minh chung KHONG bat buoc - day la cach giang vien chung minh so luong da ke.
        Chi nhan PDF, kiem 2 lop (duoi file + chu ky PDF o dau tep). File luu
        ngoai webroot (App_Data/uploads/ke-khai-gio-quy-doi), ten ngau nhien.
        Chi CHINH CHU, va chi khi DONG con sua duoc (TrangThaiDong 1 hoac 3) -
        gate theo dong, KHONG theo trang thai ban ke.
      operationId: keKhaiGioQuyDoiUploadMinhChung
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tenHienThi:
                  type: string
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungKeKhaiGioResponse"
        "400":
          description: INVALID - khong phai PDF hop le / vuot gioi han dung luong / tep trong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - chi chinh chu duoc them minh chung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND - khong tim thay dong ke khai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: DONG_DA_CHOT - dong da duoc chot, khong them minh chung duoc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "415":
          description: Yeu cau phai la multipart/form-data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/minh-chung/{idMinhChung}:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Tai ve file minh chung
      description: >
        Quyen doc = quyen xem ban ke (chinh chu, hoac nguoi duyet trong pham vi don vi).
        Module chi nhan PDF nen inline luon an toan.
        [TokenAuthorize] co fallback doc cookie kpi_access_token nen the a/iframe xac thuc
        duoc ma khong can header Authorization.
      operationId: keKhaiGioQuyDoiTaiMinhChung
      parameters:
        - name: idMinhChung
          in: path
          required: true
          schema:
            type: integer
        - name: inline
          in: query
          required: false
          description: "1 = hien thi trong trinh duyet thay vi tai xuong"
          schema:
            type: integer
      responses:
        "200":
          description: OK - noi dung file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: FORBIDDEN - khong co quyen xem minh chung nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND / FILE_NOT_FOUND - khong tim thay minh chung, hoac file da bien mat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
    delete:
      tags:
        - KeKhaiGioQuyDoi
      summary: Go minh chung (soft) + don file vat ly
      description: >-
        Chi CHINH CHU, va chi khi DONG con sua duoc (TrangThaiDong 1 hoac 3) -
        gate theo dong, KHONG theo trang thai ban ke.
      operationId: keKhaiGioQuyDoiXoaMinhChung
      parameters:
        - name: idMinhChung
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "409":
          description: DONG_DA_CHOT - dong da duoc chot, khong go minh chung duoc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  # GO BO: POST /api/ke-khai-gio-quy-doi/nop, /huy-nop, /{id}/chot, /{id}/tra-lai.
  # Vong doi da chuyen xuong TUNG DONG nen khong con buoc nop / chot ca ban ke.
  # Thay bang POST /api/ke-khai-gio-quy-doi/{id}/duyet-chi-tiet.

  /api/ke-khai-gio-quy-doi/cho-duyet:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Danh sach ban ke con DONG cho xet, trong pham vi duyet
      description: >
        Chi ADMIN / HT / TK / TKL / TP. Pham vi cua truong don vi = don vi minh +
        don vi con; ADMIN va HT thay toan truong.

        KHONG loc theo trang thai header nua (truoc day mac dinh trangThai = 2 "da nop").
        Mac dinh chiConChoDuyet = 1: lay moi ban ke CON DONG CHO DUYET, ke ca ban ke
        giang vien vua go xong mot dong - khong phai cho buoc nop.
        Ban ke RONG (SoDong = 0) luon bi loai.
        Sap xep theo DONG cho duyet CU NHAT truoc (NgayNop khong con duoc ghi).
        Phan trang bang ROW_NUMBER (SQL Server 2008 khong co OFFSET/FETCH).
      operationId: keKhaiGioQuyDoiChoDuyet
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          description: "Loc them theo don vi (va don vi con). Bo trong = ca pham vi cua nguoi goi."
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
          description: >-
            Loc them theo NHAN dan xuat cua header. Bo trong (mac dinh) = moi trang thai.
            1 Chua co dong | 2 Con dong cho duyet | 3 Moi dong da chot | 4 Con dong bi tra ve.
          schema:
            type: integer
        - name: tuKhoa
          in: query
          required: false
          description: "Tim theo ho ten hoac ma nhan vien"
          schema:
            type: string
        - name: chiConChoDuyet
          in: query
          required: false
          description: >-
            1 (mac dinh) = chi ban ke con dong cho xet - day la hang doi viec cua nguoi duyet.
            0 = lay ca nhung ban ke da xet het, de xem lai hoac mo lai dong da chot.
          schema:
            type: integer
            default: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: "Toi da 200"
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiChoDuyetResponse"
        "400":
          description: INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - khong co quyen duyet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/tong-hop:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Tong gio quy doi DA CHOT / giang vien / nam
      description: >
        CONG THEO TUNG DONG DA CHOT (TrangThaiDong = 2), KHONG doi ca ban ke o trang
        thai nao. Tach san theo hai muc cap 1 cua PHU LUC II: GioSauDaiHoc va GioDaiHoc.

        DOI HANH VI: truoc day endpoint nay con doi ban ke phai o trang thai 3, nen mot
        ban ke da co dong duoc duyet nhung chua chot ca ban thi bi tinh 0 gio. Nay giang
        vien con dong cho xet van duoc cong phan da chot. Sau khi chay migration, so
        tong hop cua don vi co the TANG so voi truoc - do la so dung.

        BUOC CONG VOI GIO GIANG DAY DA CO: GET /api/gio-giang-tkb/tong-hop doc chinh
        nhung dong nay (cung dieu kien TrangThaiDong = 2) va cong them gio theo thoi
        khoa bieu ra TONG GIO GIANG trong nam. Ca hai module deu CO Y khong ghi vao
        gio_thuc_hien_gv va khong sua sp_phieu_tong_hop_tu_dong.
      operationId: keKhaiGioQuyDoiTongHop
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiTongHopResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND - khong co nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/{id}/duyet-chi-tiet:
    post:
      tags:
        - KeKhaiGioQuyDoi
      summary: Chot / tra ve / mo lai TUNG DONG, kem quyen sua so luong
      description: >
        Day la endpoint xet duy nhat cua module - thay cho ca /chot va /tra-lai cu.
        KHONG con dieu kien ve trang thai ban ke: giang vien ke toi dau xet toi do.

        * QuyetDinh = 2 (CHOT): dong khoa voi giang vien, GioDuyet tinh lai tu SNAPSHOT
          cua dong (KHONG doc lai danh muc) theo SoLuongDuyet.
        * QuyetDinh = 3 (TRA VE): BAT BUOC co NhanXet lam ly do, thieu thi 400
          THIEU_LY_DO va khong dong nao bi doi. GioDuyet = 0 nhung VAN GIU lai SoLuong
          va SoLuongDuyet de doi chieu. Giang vien sua dong do thi no tu quay ve cho duyet.
        * MO LAI dong da chot: goi chinh endpoint nay tren dong dang o TrangThaiDong = 2
          (chot nham thi sua duoc, khong phai dong vao DB). Moi lan mo lai deu ghi nhat
          ky HanhDong = 10.

        SoLuongDuyet bo trong = giu nguyen so giang vien da ke.
        TongGioDuyet chi cong cac dong TrangThaiDong = 2; TrangThai header duoc tinh lai
        sau moi lan xet.
      operationId: keKhaiGioQuyDoiDuyetChiTiet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuyetChiTietKeKhaiRequest"
      responses:
        "200":
          description: OK - ban ke sau khi cap nhat ket qua duyet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiItemResponse"
        "400":
          description: >-
            INVALID (danh sach rong, QuyetDinh khac 2/3, so luong am, dong khong thuoc
            ban ke) hoac THIEU_LY_DO (QuyetDinh = 3 ma NhanXet rong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - khong co quyen duyet ban ke nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/{id}/lich-su:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Nhat ky cua mot ban ke
      description: "Quyen doc = quyen xem ban ke. Sap xep moi nhat truoc."
      operationId: keKhaiGioQuyDoiLichSu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuKeKhaiGioResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"

  /api/ke-khai-gio-quy-doi/{id}:
    get:
      tags:
        - KeKhaiGioQuyDoi
      summary: Xem mot ban ke theo id (man hinh duyet cua TK/TKL)
      description: >
        Quyen xem: chinh chu, hoac nguoi duyet trong pham vi don vi (TK/TKL/TP), hoac HT/ADMIN.
        Tra ve cung mot hinh dang du lieu voi moi endpoint khac cua module
        (header + ChiTiet[] + minh chung gom san theo dong).
      operationId: keKhaiGioQuyDoiGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiItemResponse"
        "400":
          description: INVALID - id khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "403":
          description: FORBIDDEN - khong co quyen xem ban ke nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeKhaiGioQuyDoiResponse"


  /api/danh-muc-thanh-tich:
    get:
      tags:
        - DanhMucThanhTich
      summary: Cay danh muc thanh tich vuot troi (Nhom II - vien chuc/NLD)
      description: >
        Cay 2 cap: nut goc = tieu chi (4 nut, mang TranDiem 30/15/10/10),
        nut la = muc quy doi (13 muc, mang DiemQuyDoi).
        Chi nut co LaLa = true moi ke khai duoc.
        TranDiemNhom keo tu nut goc xuong tung la nen FE khong phai doi chieu len cha.
      operationId: danhMucThanhTichGetTree
      parameters:
        - name: loai
          in: query
          required: false
          description: "1=Sang kien, 2=Khen thuong, 3=Dao tao-boi duong, 4=Phong trao. Bo trong = tat ca."
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: chiLa
          in: query
          required: false
          description: "1 = chi tra cac muc ke khai duoc (dung cho o chon khi nhap)."
          schema:
            type: integer
        - name: trangThai
          in: query
          required: false
