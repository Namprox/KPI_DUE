    PhieuDanhGiaCreateRequest:
      type: object
      required:
        - IdNam
        - IdNhanVien
        - IdMau
      properties:
        IdNam:
          type: integer
        IdNhanVien:
          type: integer
        IdMau:
          type: integer
        IdDonVi:
          type: integer
          nullable: true
          description: >-
            Don vi cua phieu (kiem nhiem da don vi). Bo trong / null = don vi CHINH
            cua nhan vien — day la hanh vi truoc khi co field nay, client cu khong
            phai sua gi.
            Co gia tri = tao phieu tai mot don vi khac ma nguoi do dang tham gia;
            don vi do PHAI co dong hieu luc trong nhan_vien_chuc_vu cua chinh nguoi
            duoc tao phieu, neu khong API tra 409 "Nhan vien khong thuoc don vi nay
            trong nam danh gia".
            Moi (nam, nguoi, don vi) chi 1 phieu — goi lai voi cung bo ba tra 409
            "Phieu danh gia da ton tai".
            LoaiDoiTuong cua phieu SUY RA TU DON VI NAY chu khong tu chuc danh:
            don vi Khoa (ma_don_vi bat dau bang "K_") + nguoi co chuc danh nghe
            nghiep => 1 (mau Giang vien); moi truong hop con lai (Phong, Trung tam,
            hoac Khoa nhung nguoi khong co chuc danh) => 2 (mau Vien chuc / NLD).
            IdMau truyen len phai cung LoaiDoiTuong voi ket qua do.
            HE QUA: phieu o Phong mang LoaiDoiTuong = 2 nen dinh luat "vien chuc toi
            da muc 2 (Hoan thanh nhiem vu)" — mot Truong phong kiem GV Khoa khong the
            dat Xuat sac tren phieu Phong, nhung van dat duoc tren phieu Khoa.
