      description: >
        Hàng đợi chờ Trường duyệt. Cấp Trường xem (ma_chuc_vu HT/ADMIN) — Admin
        xem được nhưng chỉ HT mới duyệt/chốt.
      operationId: phieuDanhGiaGetTruongPending
