  /api/phieu-don-vi/{id}/tong-hop-kpi:
    post:
      tags:
        - PhieuDonVi
      summary: Tong hop KPI thanh vien vao phieu don vi
      description: >-
        Tong hop diem KPI cac thanh vien thuoc don vi vao cac dong chi tiet co
        LoaiNguonDiem = 2 (tu dong). Response co them khoi TongHop.
        Ma cong thuc: DIEM_TB_THANH_VIEN, TY_LE_XUAT_SAC, TY_LE_HOAN_THANH,
        DIEM_TRU_TAP_THE, PHSV_DIEM_TB_KHOA, NCKH_TY_LE_HOAN_THANH_KHOA,
        NCKH_BAI_BAO_TB_KHOA, NCKH_BAI_BAO_Q1Q2_TB_KHOA,
        HV_TOT_NGHIEP_TREN_50_KHOA, HV_CANH_BAO_DUOI_20_KHOA,
        HV_TOT_NGHIEP_TREN_70_KHOA va HV_CANH_BAO_DUOI_10_KHOA.
        Bon ma HV_* (tinh tu du lieu hoc vu sinh vien, cung chay ke ca khi chua
        co phieu thanh vien nao chot) cham DAT / KHONG DAT: dat -> du DiemToiDa,
        khong dat -> 0. Dieu kien dat (so sanh CHAT): TyLeTotNghiepDungHan > 50 /
        > 70; TyLeCanhBaoHocVu < 20 / < 10. Chua import hoc vu hoac MaKhoa chua
        anh xa (mau so = 0) thi cham 0 - phai import qua
        POST /api/hoc-vu/import-sinh-vien va /api/hoc-vu/import-canh-bao truoc.
        Rieng DIEM_TRU_TAP_THE (tinh tu so vi pham cua Khoa: MAX(0, DiemToiDa -
        DiemTruTapThe)), PHSV_DIEM_TB_KHOA (tinh tu diem TB phan hoi sinh vien),
        NCKH_TY_LE_HOAN_THANH_KHOA (tinh tu gio NCKH da dong bo),
        NCKH_BAI_BAO_TB_KHOA va NCKH_BAI_BAO_Q1Q2_TB_KHOA (tinh tu bai bao NCKH da
        dong bo) VAN chay ke ca khi
        chua co phieu thanh vien nao duoc chot, trong khi ba ma con lai luc do ra 0.
        PHSV_DIEM_TB_KHOA cham theo bac thang tren DiemTbPhanHoiSv (thang Likert
        1-5): >= 3 duoc 2.50 diem; tu 2 den duoi 3 duoc 1.50 diem; duoi 2 duoc 0.
        Chua chot diem TB phan hoi SV (SoGvCoPhanHoi = 0) thi cham 0 - phai goi
        POST /api/diem-tb-phan-hoi-sv/chot truoc.
        NCKH_TY_LE_HOAN_THANH_KHOA cham theo bac thang tren TyLeHoanThanhNckh (%):
        tren 75 duoc 20 diem; tren 65 den 75 duoc 15 diem; tren 50 den 65 duoc 10
        diem; tu 50 tro xuong duoc 0 (dung 50% roi vao bac 0). Moc diem la hang so
        tuyet doi, van kep tran DiemToiDa. Chua dong bo gio NCKH
        (SoGvThuocDienNckh = 0) thi cham 0 - phai goi POST /api/nckh/gio-nckh/dong-bo
        truoc.
        NCKH_BAI_BAO_TB_KHOA cham TUYEN TINH tren SoBaiBaoTrenGv (so bai bao tap chi /
        ky yeu WoS-Scopus TB tren 1 giang vien): Diem = MIN(SoBaiBaoTrenGv, 1) *
        DiemToiDa - dat TB 1 bai/GV la tron diem tieu chi, tren nua van kep tran.
        KHAC hai ma tren, he so BAM DiemToiDa chu khong phai hang so, nen doi trong so
        tieu chi chi can sua DiemToiDa. Tu so dem DISTINCT theo bai nen mot bai co
        NHIEU dong tac gia cung Khoa chi tinh MOT lan; mau so la SoGiangVien. Chua
        dong bo bai bao (SoBaiBaoWosScopus = 0) hoac don vi khong phai Khoa
        (SoGiangVien = 0) thi cham 0 - phai goi POST /api/nckh/dong-bo truoc.
        NCKH_BAI_BAO_Q1Q2_TB_KHOA cham CUNG KHUON NCKH_BAI_BAO_TB_KHOA, chi khac TU SO:
        chi dem bai co XepHangQ la Q1 hoac Q2. Diem = MIN(SoBaiQ1Q2TrenGv, 1) *
        DiemToiDa, voi SoBaiQ1Q2TrenGv = SoBaiBaoQ1Q2 / SoGiangVien. He so cung BAM
        DiemToiDa: dat TB 1 bai Q1/Q2 tren 1 GV la tron diem tieu chi, nen voi
        DiemToiDa = 50 thi TB 0.3 bai/GV ra dung 15 diem. Dung CHUNG mau so SoGiangVien
        voi hai ma tren (lay tu cung mot ham) nen SoBaiBaoQ1Q2 <= SoBaiBaoWosScopus.
        LUU Y: bai Q1/Q2 duoc tinh o CA NCKH_BAI_BAO_TB_KHOA lan ma nay - day la CHU Y,
        tieu chi Q1/Q2 la phan thuong THEM cho chat luong, khong phai loi dem trung.
        Ma cong thuc la khong nhan dien: giu nguyen diem cu.
      operationId: phieuDonViTongHopKpi
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: baoGomDonViCon
          in: query
          required: false
          description: Co gom phieu cua cac don vi con hay khong.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK - response gom khoi TongHop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaDonViResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaDonViResponse"
