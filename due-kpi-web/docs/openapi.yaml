    ViPhamGiangDayCreateRequest:
      type: object
      description: >
        IdNguoiGhiNhan / IdDonViGhiNhan KHONG nhan tu body — server lay tu JWT.
        Minh chung KHONG nam trong body: sau khi tao xong, POST file PDF len
        api/viphamgiangday/{idViPham}/minh-chung (multipart/form-data).
      required:
        - IdNhanVien
        - IdNam
        - IdLoaiViPham
      properties:
        IdNhanVien:
          type: integer
          description: >
            Phai thuoc dung tap cua loai vi pham: LoaiDoiTuong = 1 -> giang vien thuoc
            Khoa (ma_don_vi LIKE 'K_%'); LoaiDoiTuong = 2 -> vien chuc / NLD.
        IdNam:
          type: integer
        IdLoaiViPham:
          type: integer
          description: Noi dung vi pham theo danh muc loai_vi_pham
        MoTa:
          type: string
          nullable: true
          description: De trong = lay noi dung cua loai vi pham
        DiemTru:
          type: number
          format: double
          nullable: true
          description: >
            null = lay DiemTruMacDinh cua loai vi pham. Bi rang buoc boi CheDoDiemTru:
            che do 1 (co dinh) BO QUA gia tri nay va luon ghi DiemTruMacDinh;
            che do 2 (toi thieu) yeu cau >= DiemTruMacDinh, neu khong -> 400
            DIEM_TRU_DUOI_TOI_THIEU.
        LyDoDieuChinh:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Can cu khi tru CAO HON muc toi thieu (VD "Theo tham muu Phong CSVC",
            "Theo ket qua hop don vi ngay 12/03/2026"). BAT BUOC khi loai vi pham co
            CheDoDiemTru = 2 va DiemTru > DiemTruMacDinh, neu thieu -> 400
            THIEU_LY_DO_DIEU_CHINH. Bi bo qua (ghi null) voi che do 1.
        BiKyLuat:
          type: boolean
          nullable: true
          description: >
            1 = vi phạm này đã bị xử lý kỷ luật. Hiện CHỈ được lưu và trả về,
            chưa ảnh hưởng tới điểm tiêu chí hay xếp loại.
        NgayViPham:
          type: string
          format: date-time
          nullable: true
    ViPhamGiangDayUpdateRequest:
      type: object
      description: >
        Khong sua minh chung qua PUT nay — dung cac endpoint
        api/viphamgiangday/{idViPham}/minh-chung.
      required:
        - IdNhanVien
        - IdNam
        - IdLoaiViPham
      properties:
        IdNhanVien:
          type: integer
        IdNam:
          type: integer
        IdLoaiViPham:
          type: integer
        MoTa:
          type: string
          nullable: true
        DiemTru:
          type: number
          format: double
          nullable: true
          description: >
            Cung rang buoc CheDoDiemTru nhu ViPhamGiangDayCreateRequest.DiemTru.
        LyDoDieuChinh:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Can cu khi tru cao hon muc toi thieu. BAT BUOC khi CheDoDiemTru = 2
            va DiemTru > DiemTruMacDinh; bi bo qua voi che do 1.
        BiKyLuat:
          type: boolean
          nullable: true
          description: >
            1 = vi phạm này đã bị xử lý kỷ luật. Hiện CHỈ được lưu và trả về,
            chưa ảnh hưởng tới điểm tiêu chí hay xếp loại.
        NgayViPham:
          type: string
          format: date-time
          nullable: true
