          application/json:
            schema:
              $ref: "#/components/schemas/DiemTbChotRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiemTbChotResponse"
        "400":
          description: Id nam khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiemTbChotResponse"
        "401":
          description: Khong xac dinh duoc nguoi dang nhap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiemTbChotResponse"
        "403":
          description: Khong co quyen chot (khong phai ADMIN hoac TP cua P_QLCL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiemTbChotResponse"
        "404":
          description: Nam danh gia (idNam) khong ton tai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiemTbChotResponse"
