            GET api/minhchung/{idMinhChung}/tai-ve: MINH_CHUNG_NOT_FOUND,
            FORBIDDEN_CHUC_VU, MINH_CHUNG_KHONG_PHAI_FILE, FILE_NOT_FOUND.
            PUT api/minhchung/{idMinhChung}: MINH_CHUNG_LA_FILE.
            Cac endpoint ghi (POST file / POST link / PUT / DELETE) khi gui RowVersion
            khong con khop: CONCURRENCY_CONFLICT (409).
