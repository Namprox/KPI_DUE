          application/json:
            schema:
              $ref: "#/components/schemas/ViPhamGiangDayUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "400":
          description: >
            Du lieu khong hop le. ErrorCode = VALIDATION,
            DIEM_TRU_DUOI_TOI_THIEU, THIEU_LY_DO_DIEU_CHINH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: >
            ErrorCode = FORBIDDEN_CHUC_VU / FORBIDDEN_DON_VI /
            NOT_GIANG_VIEN_KHOA / NOT_VIEN_CHUC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = VI_PHAM_NOT_FOUND / LOAI_VI_PHAM_NOT_FOUND / NAM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "409":
          description: Xung dot du lieu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
    delete:
      tags:
        - ViPhamGiangDay
      summary: Xoa vi pham (chi don vi da ghi nhan hoac ADMIN)
      operationId: viPhamGiangDayDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: ErrorCode = FORBIDDEN_CHUC_VU / FORBIDDEN_DON_VI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = VI_PHAM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
  /api/viphamgiangday/{idViPham}/minh-chung:
    get:
      tags:
        - ViPhamGiangDay
      summary: Metadata minh chung PDF cua vi pham
      description: >
        Tra ve nguyen ban ghi vi pham; metadata file nam trong truong MinhChung
        (null neu chua tai len). Quyen doc giong GET api/viphamgiangday/{id}.
      operationId: viPhamMinhChungGet
      parameters:
        - name: idViPham
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "401":
          description: Thieu hoac sai token
        "403":
          description: Khong co quyen xem vi pham nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
        "404":
          description: ErrorCode = VI_PHAM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViPhamGiangDayResponse"
    post:
      tags:
        - ViPhamGiangDay
      summary: Tai len / ghi de minh chung PDF (chi don vi da ghi nhan hoac ADMIN)
      description: >
        CHI chap nhan file PDF — kiem tra ca duoi .pdf lan chu ky "%PDF-" cua noi dung.
        Kich thuoc toi da lay tu appSetting maxEvidenceFileSizeKb (mac dinh 10240 KB).
        Moi vi pham giu toi da 1 file: tai len lan sau se GHI DE va xoa file cu.
        Response tra ve ban ghi vi pham da cap nhat (kem MinhChung).
      operationId: viPhamMinhChungUpload
      parameters:
