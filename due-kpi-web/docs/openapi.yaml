  /api/phieu/{id}/chot:
    post:
      tags:
        - PhieuDanhGia
      summary: Finalize a phieu (transition state 4 -> 5 HOAN_TAT)
      description: |
        HT-only (ma_chuc_vu = HT; Admin KHONG duyet). In a single transaction the server:
        - Snapshots the applied dinh muc (after exceptions) and the actual
          gio giang / gio NCKH into the phieu (gio_*_dinh_muc_ap_dung,
          he_so_nckh_ap_dung, gio_*_thuc_te_snapshot, ly_do_dieu_chinh_dinh_muc).
        - Computes xep_loai (1..4) via the fixed QD DHKT rule, NOT raw thresholds:
            1 Khong hoan thanh: tong_diem_tich_luy < 80, OR DuDinhMucGioNckh = false,
              OR KhongViPhamPhapLuat = false.
            2 Hoan thanh: 80 <= tong_diem_tich_luy <= 100 and both conditions met.
            3 Hoan thanh tot: tong_diem_tich_luy > 100, MucNckhcnQd838 = 1 (year >= 2025).
            4 Hoan thanh xuat sac: tong_diem_tich_luy > 100, MucNckhcnQd838 = 2 (year >= 2025).
          For year < 2025 (QD 838 not yet in force) the result is capped at 2 (Hoan thanh)
          regardless of MucNckhcnQd838.
        - DuDinhMucGioNckh / KhongViPhamPhapLuat are the Truong's (council) decision and
          take priority over the server's auto-check (gio NCKH thuc te vs dinh muc, or
          MienNckh for tap su); a discrepancy is appended to ghi_chu_xep_loai.
        - Sets diem_chinh_thuc per chi_tiet (snapshot=2 -> diem_khoa first, else diem_truong
          first), writes lich_su_cham_diem (hanh_dong=3) and lich_su_trang_thai_phieu (4->5,
          hanh_dong=4). The server recomputes the totals it stores (anti-tamper).
        Totals are NOT capped and there is no vi_pham_giang_day override (violations are
        expressed solely via KhongViPhamPhapLuat).
        On success returns the full phieu detail (xep_loai + all snapshot columns).
      operationId: phieuDanhGiaChot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuChotRequest"
      responses:
        "200":
          description: OK - full phieu detail after finalize (xep_loai + snapshot columns populated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: >-
            Bad request - MucNckhcnQd838 missing while year >= 2025-2026,
            or the GV has no chuc danh / no dinh muc configured for the year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: Conflict - phieu not in trang_thai = 4 (TRUONG_DA_DG), or concurrency conflict (phieu was modified by another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
        "422":
          description: Missing scores for one or more chi_tiet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuSubmitValidationResponse"
  /api/phieu/{id}/mo-lai:
    post:
      tags:
        - PhieuDanhGia
      summary: Reopen a finalized phieu (state 5 HOAN_TAT -> 1/2/3)
      description: |
        HT-only (ma_chuc_vu = HT; Admin KHONG duyet). Most destructive operation in the system. In a single transaction:
        1) Snapshots every non-NULL chi_tiet score column (tu DG, Khoa, Truong, chinh thuc)
           into lich_su_cham_diem under the CURRENT lan_danh_gia (hanh_dong = 3) BEFORE clearing.
        2) Clears chi_tiet scores selectively based on trangThaiMoi:
              1 -> clear ALL (tu DG, Khoa, Truong, chinh thuc)
              2 -> clear Khoa + Truong + chinh thuc (keep tu DG)
              3 -> clear Truong + chinh thuc (keep tu DG + Khoa)
        3) Updates phieu: trang_thai = trangThaiMoi, lan_danh_gia +=1, lan_mo_lai +=1,
           sets tracking columns, clears totals/xep_loai/chot info.
        4) Writes lich_su_trang_thai_phieu (hanh_dong = 5 Mo lai, cap_thuc_hien = 3).
      operationId: phieuDanhGiaMoLai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhieuMoLaiRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "400":
          description: Invalid request (missing TrangThaiMoi / LyDo, out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "403":
          description: Caller is not Truong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhieuDanhGiaResponse"
        "409":
          description: Conflict - phieu not in trang_thai = 5 (HOAN_TAT), or concurrency conflict (phieu was modified by another user)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PhieuDanhGiaResponse"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Phieu da bi nguoi khac cap nhat. Vui long tai lai trang."
