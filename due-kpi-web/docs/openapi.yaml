          type: number
          format: double
          nullable: true
          description: >-
            BAT BUOC (validate o BLL, khong dat required tren nullable value type).
            Dong chot ngay tai buoc tham dinh nen khong the chot ma khong co diem.
            Khoang hop le GIONG HET ChiTietDanhGiaTuDanhGiaRequest.Diem (error_code
            DIEM_VUOT_TOI_DA / DIEM_DUOI_SAN): tieu chi Vien chuc/NLD duoc am diem.
        NhanXet:
          type: string
          nullable: true
          maxLength: 1000
          description: BAT BUOC khi Diem khac diem chu phieu tu ke khai (THIEU_LY_DO)
        RowVersion:
          type: string
          format: byte
          nullable: true
          description: >-
            Tuy chon (giu tuong thich nguoc voi FE cu). Khi co, SP kiem tra optimistic
            concurrency tren phieu cha truoc khi ghi.
