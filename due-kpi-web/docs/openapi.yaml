      summary: Upload file evidence for a chi_tiet
      operationId: minhChungUploadFile
      parameters:
        - name: idChiTiet
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary file (pdf, doc, docx, xls, xlsx, png, jpg, jpeg; max 10 MB)
                tenHienThi:
                  type: string
                  description: Optional display name. Defaults to the file's base name.
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "400":
          description: Bad Request (missing file, invalid extension, file too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "404":
          description: chi_tiet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhChungResponse"
        "409":
