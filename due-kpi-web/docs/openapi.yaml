              schema:
                $ref: "#/components/schemas/CauHinhNhiemVuKhoaResponse"
        "401":
          description: Thieu hoac sai token

  /api/nhiem-vu-khoa/ky:
    get:
      tags:
        - NhiemVuKhoa
      summary: Ky nhiem vu cua (nam x Khoa) + tong quan + 7 nhom
      description: |
        Ky chi co 2 trang thai: 1 dang mo (Khoa sua tu do, GV phan hoi tu do),
        2 da chot (khoa ghi toan bo). Trang thai duyet gan vao KY chu khong gan vao
        tung ban ghi phan cong.
        Ky duoc TAO LUOI: endpoint nay tu tao neu chua co, Khoa khong phai bam "mo ky".
        HanPhanHoi het han KHONG khoa gi - chi la nhan hien thi ("khong len tieng =
        dong y"); chi TrangThai = 2 moi khoa ghi.
      operationId: nhiemVuKhoaGetKy
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - Item = ky, Nhom = 7 nhom cong tac kem so nhiem vu da nhap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "400":
          description: Don vi khong phai la Khoa (KHONG_PHAI_KHOA) hoac tham so sai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
    put:
      tags:
        - NhiemVuKhoa
      summary: Dat han phan hoi / ghi chu, hoac mo lai ky da chot
      description: |
        MoLai = true dua ky tu 2 ve 1, bat buoc co LyDo, va chi TK/TKL/TP/ADMIN duoc
        thuc hien (TLGVK khong duoc). Ky da chot thi thao tac duy nhat hop le la mo lai.
        XoaHan = true uu tien hon HanPhanHoi (go han ve khong gioi han).
      operationId: nhiemVuKhoaSetKy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KyNhiemVuKhoaSetRequest"
      responses:
        "200":
          description: OK - ky sau khi cap nhat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "400":
          description: Thieu LyDo khi mo lai, hoac tham so sai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "403":
          description: Khong co quyen (mo lai doi TK/TKL/TP/ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT - phai mo lai truoc khi sua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/cua-toi:
    get:
      tags:
        - NhiemVuKhoa
      summary: Bang diem nhiem vu cua chinh giang vien dang dang nhap
      description: >
        Khong gate vai tro - id lay tu token, ai cung xem duoc cua minh.
        Tra header (trang thai ky, han phan hoi, TongDiemThucTe + TongDiemQuyDoi),
        danh sach nhiem vu duoc gan kem vai tro / diem / minh chung cap nhiem vu,
        va cac phan hoi da gui cua chinh GV.
        Khoa chua mo ky thi van tra header voi Items rong.
      operationId: nhiemVuKhoaCuaToi
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaCuaToiResponse"
        "400":
          description: Id nam khong hop le
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Khong tim thay nam danh gia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/giang-vien:
    get:
      tags:
