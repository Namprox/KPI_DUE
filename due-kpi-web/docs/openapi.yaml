      description: >
        Dung cho o chon nguoi khi phan cong - FE thay ngay ai sap cham tran ma khong
        phai goi them API cho tung nguoi. Mot truy van duy nhat (LEFT JOIN bang tong
        hop), khong N+1.
        Moi dong tra CA HAI con so: TongDiemThucTe va TongDiemQuyDoi = MIN(thuc te, tran).
      operationId: nhiemVuKhoaGiangVien
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
        - name: tuKhoa
          in: query
          required: false
          description: Loc theo ho ten hoac ma nhan vien
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiangVienDiemResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/tong-hop:
    get:
      tags:
        - NhiemVuKhoa
      summary: Bang tong hop toan Khoa (man hinh chot + nguon cho Excel)
      description: >
        Gom CA giang vien chua duoc phan cong nhiem vu nao, de Khoa thay cho trong.
        SoNhiemVuTheoNhom la map id_nhom_nv -> so luong (server tra dang long, C# pivot).
        VuotTran chi la canh bao hien thi, khong chan luu va khong chan chot.
      operationId: nhiemVuKhoaTongHop
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaTongHopResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/kiem-tra-chot:
    get:
      tags:
        - NhiemVuKhoa
      summary: Kiem tra dieu kien truoc khi chot ky
      description: |
        Tra danh sach chi tiet tung van de con ton. LoaiVanDe:
          1 CHAN - nhiem vu co phan cong nhung thieu chu tri
          2 CHAN - nhiem vu chua phan cong cho ai
          3 CHAN - phan hoi chua xu ly
          4 CANH BAO - giang vien vuot tran diem (chi hien thi, KHONG chan chot)
          5 CANH BAO - lech cau hinh: diem_toi_da cua tieu chi KPI khac tran cua module
        CoTheChot = true khi khong con van de loai 1/2/3 VA nguoi goi co quyen chot.
      operationId: nhiemVuKhoaKiemTraChot
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KiemTraChotResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Ky nhiem vu chua duoc mo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/chot:
    post:
      tags:
        - NhiemVuKhoa
      summary: Chot ky nhiem vu cua Khoa
      description: >
        Chi TK/TKL/TP trong pham vi don vi hoac ADMIN (TLGVK KHONG duoc chot).
        SP tu tinh lai dieu kien chan, khong tin ket qua man hinh kiem-tra-chot ma
        client vua xem (du lieu co the doi giua hai lan goi).
        Sau khi chot, ky khoa ghi toan bo: sua nhiem vu / gui phan hoi / them minh
        chung deu tra 409 KY_DA_CHOT.
      operationId: nhiemVuKhoaChot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhiemVuKhoaChotRequest"
      responses:
        "200":
          description: OK - ky sau khi chot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaKyResponse"
        "403":
          description: FORBIDDEN - khong phai truong don vi / Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "404":
          description: Ky nhiem vu chua duoc mo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "409":
          description: KY_DA_CHOT - ky da duoc chot truoc do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"
        "422":
          description: CHOT_KHONG_HOP_LE - con van de chan (xem kiem-tra-chot)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/export:
    get:
      tags:
        - NhiemVuKhoa
      summary: Xuat bang tong hop toan Khoa ra Excel de ky
      description: >
        File .xlsx mot sheet, cot dong theo 7 nhom cong tac. Bao cao dung cot
        "Tong diem quy doi" = MIN(thuc te, tran); cot "Tong diem thuc te" van hien
        de nguoi ky thay ai bi cat bao nhieu.
        Ten file: NhiemVuKhoa_{maDonVi}_{idNam}.xlsx
      operationId: nhiemVuKhoaExport
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - file Excel dinh kem
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          description: Khong co quyen xem Khoa nay (tra JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/lich-su:
    get:
      tags:
        - NhiemVuKhoa
      summary: Nhat ky toan ky (ai sua vai tro / diem, luc nao)
      description: |
        HanhDong: 1 Tao nhiem vu, 2 Sua nhiem vu, 3 Xoa nhiem vu, 4 Them phan cong,
        5 Doi vai tro/diem, 6 Go phan cong, 7 Chot ky, 8 Mo lai ky, 9 Xu ly phan hoi.
        Dong hanh dong 5 mang day du VaiTroTruoc/VaiTroSau va DiemTruoc/DiemSau.
      operationId: nhiemVuKhoaLichSuKy
      parameters:
        - name: idNam
          in: query
          required: true
          schema:
            type: integer
        - name: idDonVi
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LichSuNhiemVuKhoaResponse"
        "403":
          description: Khong co quyen xem Khoa nay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhiemVuKhoaResponse"

  /api/nhiem-vu-khoa/phan-hoi:
    post:
      tags:
        - NhiemVuKhoa
      summary: Giang vien gui phan hoi (co the kem file PDF trong cung request)
      description: |
        multipart/form-data - CO Y khong dung JSON de "mot endpoint gui phan hoi co kem
        file" dung nghia (.NET 4.0 khong co duong nao khac de vua nhan truong text vua
        nhan file trong cung mot request). FE luon dung FormData ke ca khi khong co file.
        loaiPhanHoi = 1 (sai vai tro) BAT BUOC co idNhiemVuKhoa tro toi mot nhiem vu
        cua chinh ky do; loaiPhanHoi = 2 (thieu nhiem vu) chi co idNhomNv goi y.
        Giang vien CHI tao duoc phan hoi, KHONG tu tao duoc nhiem vu.
        File la TUY CHON va duoc dinh kem SAU khi phan hoi da luu, nen loi upload
        khong lam mat noi dung phan hoi vua gui.
      operationId: nhiemVuKhoaTaoPhanHoi
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                idNam:
                  type: integer
                loaiPhanHoi:
                  type: integer
                  description: "1 = sai vai tro, 2 = thieu nhiem vu"
                idNhiemVuKhoa:
                  type: integer
                  description: "Bat buoc khi loaiPhanHoi = 1"
                idNhomNv:
                  type: integer
                  description: "Goi y nhom khi loaiPhanHoi = 2"
                noiDung:
                  type: string
