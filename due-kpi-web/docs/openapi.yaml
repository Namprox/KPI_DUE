      tags:
        - TieuChiDonViCham
      summary: >
        Thay thế toàn bộ danh sách đơn vị được phân quyền chấm của 1 tiêu chí (Admin).
        Tiêu chí có phân quyền: chỉ TRƯỞNG các đơn vị đó (ma_chuc_vu TK/TKL/TP) được chấm
        điểm cấp Khoa của tiêu chí (lưu vết người chấm qua id_nguoi_dg_khoa + lich_su_cham_diem).
        Danh sách rỗng = bỏ phân quyền, quay về mặc định trưởng khoa/phòng đơn vị chủ quản chấm.
