    TieuChiDanhGiaCreateRequest:
      type: object
      required:
        - TenTieuChi
      properties:
        TenTieuChi:
          type: string
        IdNhom:
          type: integer
        MoTa:
          type: string
        DiemToiDa:
          type: number
          minimum: -999.99
          maximum: 999.99
          description: >-
            Khac 0. Duong = diem toi da thong thuong.
            AM = tieu chi CHI TRU diem (khong co diem toi da, con so la muc tru toi
            da) — vd muc III "Chap hanh quy dinh" cua bang KPI Vien chuc/NLD khai
            -100. Gia tri am CHI hop le khi LoaiDoiTuong = 2 (Vien chuc/NLD);
            GV (1) / Khoa (3) / Phong (4) van bat buoc duong.
        LoaiThangDiem:
          type: integer
        CongThucTinhDiem:
          type: string
        BatBuocMinhChung:
          type: boolean
          nullable: true
        ThuTuHienThi:
          type: integer
          nullable: true
          description: >-
            Vi tri hien thi trong pham vi MOT nhom tieu chi (IdNhom), luon la day
            lien tuc 1..N (N = so tieu chi dang co cua nhom do). Bo trong / 0 / lon
            hon N+1 => them vao cuoi (N+1). Truyen 1..N => chen vao vi tri do, cac
            tieu chi tu vi tri do tro di tu dong day xuong 1 bac.
        TrangThai:
          type: boolean
          nullable: true
        LoaiDoiTuong:
          type: integer
          nullable: true
          description: "1=GV, 2=Vien chuc/NLD, 3=Khoa, 4=Phong. Bo trong => mac dinh 1 (GV)."
    TieuChiDanhGiaUpdateRequest:
      type: object
      required:
        - TenTieuChi
      properties:
        TenTieuChi:
          type: string
        IdNhom:
          type: integer
        MoTa:
          type: string
        DiemToiDa:
          type: number
          minimum: -999.99
          maximum: 999.99
          description: >-
            Khac 0. AM = tieu chi CHI TRU diem, chi hop le khi loai doi tuong HIEU
            LUC cua tieu chi = 2 (Vien chuc/NLD). Bo trong LoaiDoiTuong => giu loai
            dang luu, SP suy loai hieu luc roi kiem lai. Xem TieuChiDanhGiaCreateRequest.
        LoaiThangDiem:
          type: integer
        CongThucTinhDiem:
          type: string
        BatBuocMinhChung:
          type: boolean
          nullable: true
        ThuTuHienThi:
          type: integer
          nullable: true
          description: >-
            Doi cho trong pham vi MOT nhom tieu chi, giu day lien tuc 1..N. Bo trong
            => giu nguyen vi tri hien tai. 0 hoac lon hon N => keo ve cuoi. Truyen
            1..N => chuyen den vi tri do, cac tieu chi nam giua don 1 bac. Doi kem
            IdNhom => don gap o nhom cu va chen vao nhom moi.
        TrangThai:
          type: boolean
          nullable: true
        LoaiDoiTuong:
          type: integer
          nullable: true
          description: "1=GV, 2=Vien chuc/NLD, 3=Khoa, 4=Phong. Bo trong => mac dinh 1 (GV)."
    TieuChiDanhGiaDto:
      type: object
      properties:
        IdTieuChi:
          type: integer
        TenTieuChi:
          type: string
        IdNhom:
          type: integer
        TenNhom:
          type: string
        MoTa:
          type: string
        DiemToiDa:
          type: number
        LoaiThangDiem:
          type: integer
        CongThucTinhDiem:
          type: string
        BatBuocMinhChung:
          type: boolean
        ThuTuHienThi:
          type: integer
          nullable: true
        TrangThai:
          type: boolean
        LoaiDoiTuong:
          type: integer
          description: "1=GV, 2=Vien chuc/NLD, 3=Khoa, 4=Phong."
