  # ── Session 5b: DinhMucGiangVien — định mức áp dụng ─────────────────────────
  /api/dinh-muc-giang-vien/ap-dung/{idNv}/{idNam}:
    get:
      tags:
        - DinhMucGiangVien
      summary: Tính định mức áp dụng sau ngoại lệ cho một GV trong năm
      description: >
        Trả về định mức gốc (base) và định mức đã áp dụng các ngoại lệ active.
        Công thức:
        GioGiangApDung = max(0, base − SoGioGiamGiang − base × ΣHeSoGiamGiang).
        GioNckhApDung  = max(0, base × max(HeSoNckh) − base × ΣHeSoGiamNckh).
        GioPvcdApDung  = max(0, base − base × ΣHeSoGiamPvcd).
        GV chỉ xem của chính mình; HR/Admin (chucVu 1, 7, 8) xem mọi người.
      operationId: dinhMucGiangVienGetApDung
      parameters:
        - name: idNv
          in: path
          required: true
          schema:
            type: integer
          description: id_nhan_vien
        - name: idNam
          in: path
          required: true
          schema:
            type: integer
          description: "Năm đánh giá (VD: 2025)"
      responses:
        "200":
          description: Định mức áp dụng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DinhMucApDungResponse"
        "400":
          description: GV chưa có chức danh hoặc chưa cấu hình định mức
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DinhMucApDungResponse"
        "403":
          description: Không có quyền xem định mức của người khác
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DinhMucApDungResponse"
  /api/dinh-muc-giang-vien/gio-nckh-thuc-te/{idNv}/{idNam}:
    get:
      tags:
        - DinhMucGiangVien
      summary: Giờ NCKH thực tế đã tính thêm so_gio_them_nckh từ ngoại lệ
      description: >
        = gio_thuc_hien_gv.gio_nckh_thuc_te (0 nếu chưa nhập)
          + Σ ngoai_le_active.so_gio_them_nckh (loại 6 — quân nhân dự bị).
        Session 7 dùng giá trị này khi chốt phiếu.
      operationId: dinhMucGiangVienGetGioNckhThucTe
      parameters:
        - name: idNv
          in: path
          required: true
          schema:
            type: integer
          description: id_nhan_vien
        - name: idNam
          in: path
          required: true
          schema:
            type: integer
          description: Năm đánh giá
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                  Message:
                    type: string
                  Data:
                    type: object
                    properties:
                      IdNhanVien:
                        type: integer
                      IdNam:
                        type: integer
                      GioNckhThucTe:
                        type: number
                        format: decimal
                        description: Giờ NCKH thực tế (gio_thuc_hien + so_gio_them_nckh)
        "400":
          description: Không tìm thấy nhân viên
        "403":
          description: Không có quyền
